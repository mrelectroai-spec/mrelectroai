.part{cursor:grab}.part.sel>.ol{stroke:var(--volt);stroke-width:2.5;stroke-dasharray:6 5;fill:rgba(34,199,155,.06)}
.act{cursor:pointer}
.tp{fill:transparent;cursor:crosshair}.tp.hot{fill:rgba(34,199,155,.35);stroke:var(--volt);stroke-width:2}
.tp.pend{fill:rgba(255,200,0,.4);stroke:#ffc400;stroke-width:2.5}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wsel{fill:none;stroke:#fff;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 13;animation:flow .9s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-16}}
.hot{animation:hotw .6s ease-in-out infinite alternate}@keyframes hotw{to{stroke:#ff7a1a}}
.spin{animation:spin .45s linear infinite}.spinr{animation:spin .45s linear infinite reverse}.hum{animation:hum .08s linear infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes hum{to{transform:translateX(1.5px)}}
.whd{fill:#fff;stroke:var(--volt);stroke-width:2.5;cursor:ns-resize}

.rub{stroke:var(--volt);stroke-width:4;stroke-dasharray:8 6;fill:none;pointer-events:none}
.frame text{font:600 13px 'Readex Pro',sans-serif;fill:rgba(255,255,255,.45);text-anchor:middle}

.pm{font:600 10.5px 'Readex Pro',sans-serif;fill:rgba(220,235,230,.78);text-anchor:middle;direction:ltr;pointer-events:none}
.cbr{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}.cbr button{flex:0 0 auto}
.cml{display:grid;grid-template-columns:1fr;gap:6px;max-height:34vh;overflow:auto}
.cm{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:start;padding:9px 11px;border-radius:12px;background:var(--chip,rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.12);color:inherit;font:inherit}

.csr{width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:inherit;padding:0 12px;font:inherit;font-size:15px;margin-bottom:6px}

/* ✨ حركات صغيرة */
.rip{position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2.5px solid #22C79B;pointer-events:none;z-index:60;animation:rip .45s ease-out forwards}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.cf{position:fixed;top:40%;left:50%;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:80;animation:cf 1.6s cubic-bezier(.15,.7,.4,1) forwards}

function rounded(pts){let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const p=pts[i],q=pts[i-1],n=pts[i+1];

 for(const c of B.comps)for(const t of P[c.type].terms){const k=c.id+'.'+t.n;if(k===except)continue;const d=Math.hypot(c.x+t.x-p.x,c.y+t.y-p.y);if(d<bd){bd=d;best=k;}}return best;}
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cam:{...cam},mid:wpt({clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2})};drag=null;return;}
 const p=wpt(e),tg=e.target;
 // الكبسات والقواطع أهم من الشريط اللي مارق فوقها
 const stack=document.elementsFromPoint(e.clientX,e.clientY);const pick=sel=>{for(const el of stack){const m=el.closest&&el.closest(sel);if(m&&svg.contains(m))return m;}return null;};
 const RUN=B.on&&tool!=='probe';const tp=RUN?null:tg.closest('[data-t]'),wh=RUN?null:tg.closest('[data-wh]'),act=tp||wh?null:pick('[data-act]'),wr=act?null:tg.closest('[data-w]'),pt=act?act.closest('[data-c]'):tg.closest('[data-c]');
 if(tp&&tool!=='probe'){drag={t:'link',from:tp.dataset.t,p0:p,moved:false};return;}
 if(tp&&tool==='probe'){probe(tp.dataset.t);return;}
 if(act&&pt){tapFx(e);control(pt.dataset.c,act.dataset.act,true);drag={t:'act',c:pt.dataset.c,a:act.dataset.act};return;}
 if(wh){const w=B.wires.find(x=>x.id===wh.dataset.wh);push();drag={t:'wh',w,y0:p.y,my0:wpath(w).my};return;}
 if(B.on&&!act&&(pt||wr)){drag={t:'pan',sx:e.clientX,sy:e.clientY,cam:{...cam},moved:false,lk:1};return;}
 if(pt&&tool!=='probe'){const c=B.comps.find(x=>x.id===pt.dataset.c);drag={t:'part',c,dx:p.x-c.x,dy:p.y-c.y,p0:p,moved:false};return;}
 if(wr){drag={t:'wtap',id:wr.dataset.w,p0:p};return;}
 drag={t:'pan',sx:e.clientX,sy:e.clientY,cam:{...cam},moved:false};});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const k=Math.max(.25,Math.min(4,pinch.d/d));
  const nw=Math.max(300,Math.min(W*2.6,pinch.cam.w*k)),nh=nw*pinch.cam.h/pinch.cam.w;const r=svg.getBoundingClientRect();
  const mx=((a.x+b.x)/2-r.left)/r.width,my=((a.y+b.y)/2-r.top)/r.height;cam={x:pinch.mid.x-mx*nw,y:pinch.mid.y-my*nh,w:nw,h:nh};applyCam();return;}
 if(!drag)return;const p=wpt(e);
 if(drag.t==='pan'){const r=svg.getBoundingClientRect();const dx=(e.clientX-drag.sx)/r.width*drag.cam.w,dy=(e.clientY-drag.sy)/r.height*drag.cam.h;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)drag.moved=true;cam={...drag.cam,x:drag.cam.x-dx,y:drag.cam.y-dy};applyCam();}
 else if(drag.t==='part'){if(!drag.moved&&Math.hypot(p.x-drag.p0.x,p.y-drag.p0.y)>6){drag.moved=true;push();FAST=true;try{svg.setPointerCapture(e.pointerId);}catch(x){}}
  if(drag.moved){const c=drag.c,d=P[c.type];c.x=Math.max(10,Math.min(W-pw(c)-10,snap(p.x-drag.dx)));c.y=Math.max(30,Math.min(H-d.h-10,p.y-drag.dy));
   const g=svg.querySelector(`[data-c="${c.id}"]`);if(g)g.setAttribute('transform',`translate(${c.x} ${c.y})`);drawWiresOnly();}}
 else if(drag.t==='link'){if(Math.hypot(p.x-drag.p0.x,p.y-drag.p0.y)>8){drag.moved=true;const a=tpos(drag.from);const rub=$('rub');const n=nearT(p,drag.from);const b=n?tpos(n):p;rub.setAttribute('d',`M${a.x} ${a.y}L${a.x} ${b.y}L${b.x} ${b.y}`);
  svg.querySelectorAll('.tp.hot').forEach(x=>x.classList.remove('hot'));if(n){const el=svg.querySelector(`[data-t="${n}"]`);if(el)el.classList.add('hot');}}}
 else if(drag.t==='wh'){drag.w.my=snap(drag.my0+(p.y-drag.y0));drawWiresOnly();}});
function endPtr(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;if(drag&&drag.t==='part'&&FAST){FAST=false;draw();}drag=null;return;}if(!drag)return;const d=drag;drag=null;const p=wpt(e);
 if(d.t==='act'){control(d.c,d.a,false);return;}
 if(d.t==='part'){FAST=false;if(d.moved){d.c.y=railY(d.c,d.c.y);save();draw();}else{sel=d.c.id;selW=null;draw();chipFor(d.c);}return;}
 if(d.t==='link'){$('rub').setAttribute('d','');if(d.moved){const n=nearT(p,d.from);if(n)connect(d.from,n);else draw();}
  else{if(pend&&pend!==d.from){connect(pend,d.from);pend=null;}else{pend=pend===d.from?null:d.from;draw();}}return;}
 if(d.t==='wh'){save();draw();return;}
 if(d.t==='wtap'){selW=d.id;sel=null;draw();chipWire(B.wires.find(x=>x.id===d.id));return;}
 if(d.t==='pan'&&!d.moved&&d.lk){lockMsg();return;}
 if(d.t==='pan'&&!d.moved){if(sel||selW||pend){sel=null;selW=null;pend=null;closeSheets();draw();}}}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=wpt(e);const k=Math.exp(e.deltaY*0.0015);const nw=Math.max(300,Math.min(W*2.6,cam.w*k)),nh=nw*cam.h/cam.w;
 cam={x:p.x-(p.x-cam.x)*nw/cam.w,y:p.y-(p.y-cam.y)*nh/cam.h,w:nw,h:nh};applyCam();},{passive:false});
function drawWiresOnly(){draw();}
function connect(a,b){if(a===b)return;if(a.split('.')[0]===b.split('.')[0]&&P[B.comps.find(c=>c.id===a.split('.')[0]).type].links)
 {}
 if(B.wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){toast('هالشريط موجود');draw();return;}
 push();const pa=E.termInfo(a),pb=E.termInfo(b);const pw=pa&&pb&&pa.pw&&pb.pw;const isPE=/\.PE$/.test(a)||/\.PE$/.test(b);const isN=/\.N$/.test(a)||/\.N$/.test(b);
 const ph=(/\.(L1|U1|L)$/.test(a)||/\.L$/.test(b)||/\.(L1|U1)$/.test(b))?'br':(/\.(L2|V1)$/.test(a)||/\.(L2|V1)$/.test(b))?'bk':(/\.(L3|W1)$/.test(a)||/\.(L3|W1)$/.test(b))?'gr':null;
 let i=1;while(B.wires.some(w=>w.id==='w'+i))i++;
 const w={id:'w'+i,a,b,color:isPE?'gy':isN?'bl':pw?(ph||'bk'):'rd',mm2:isPE?2.5:pw?1.5:1,num:''};
 B.wires.push(w);pend=null;save();sim();draw();toast(pw?'شريط باور: شيك المقطع على تيار الموتور':'شريط تحكم');}

/* ---------- الكبسات والقواطع ---------- */
function control(id,a,down){const c=B.comps.find(x=>x.id===id);if(!c)return;
 if(a==='press'){c.st.p=down;}
 else if(down&&a==='latch'){c.st.p=!c.st.p;}
 else if(down&&a==='lever'){if(c.st.trip){c.st.trip=false;c.st.on=false;c.st.heat=0;}else c.st.on=!c.st.on;if(B.blown&&c.st.on)B.blown=false;}
 else if(down&&a==='test'){c.st.trip=true;}
 else if(down&&a==='reset'){c.st.trip=false;c.st.heat=0;}
 else if(down&&a==='dial'){sel=c.id;chipFor(c);}
 else if(down&&a==='avail'){c.st.off=!c.st.off;toast(c.st.off?'المصدر انقطع':'رجع المصدر');}
 else if(down&&a==='smoke'){c.st.smoke=!c.st.smoke;}
 else if(down&&a==='toggle'){c.st.on=!c.st.on;}
 else if(down&&a==='leak'){c.st.leak=!c.st.leak;if(c.st.leak)toast('عملت تسريب عالأرض بهالجهاز: الديفرنسيال لازم يفصل',true);}
 else return;sim();draw();}

/* ---------- الملتيميتر ---------- */
function probe(k){if(!B.on){toast('شغّل الكهربا أوّل (زر ▶ فوق)');return;}const lv=E.live(k);const c=B.comps.find(x=>x.id===k.split('.')[0]);
 const nm=(c.label||P[c.type].name)+' · '+k.split('.')[1];
 if(!lv){toast(`${nm}: 0V، ما في كهربا`);return;}
 if(lv==='N'||lv==='PE'){toast(`${nm}: ${lv==='N'?'نوترال':'أرضي'} (0V)`);return;}
 toast(`${nm}: ${lv} · 230V مع النوترال · 400V مع الفاز التاني`);}

/* ---------- التشغيل ---------- */
let raf=0,last=0;
function sim(){if(!B.on){for(const c of B.comps){if(c.type==='kc'||c.type==='tmr'){c.st.e=false;c.st.t=0;c.st.done=false;}if(c.type==='lamp'||c.type==='load'||c.type==='bulb'||c.type==='siren')c.st.on=false;if(c.type==='relay')c.st.e=false;if(c.type==='socket')c.st.v=false;if(c.type==='motor'||c.type==='motor6'){c.st.m='off';c.st.I=0;}}B._N=null;for(const w of B.wires){w.I=0;w.heat=0;}return;}
 const ev=[];E.solve(ev);report(ev);}
function loop(t){if(!B.on)return;const dt=Math.min(.1,(t-last)/1000||0);last=t;const ev=[];E.tick(dt,ev);report(ev);
 if(!loop.n||t-loop.n>120){loop.n=t;draw();}raf=requestAnimationFrame(loop);}
function report(ev){for(const x of ev){
 if(x.k==='trip')toast(x.why==='short'?`⚡ قصر! فصل القاطع ${x.c.label}`:x.why==='cross'?`⚡ ربطت مصدرين ببعض! فصل ${x.c.label}`:`القاطع ${x.c.label} فصل: الحمل أكبر منو`,true);
 if(x.k==='rcd')toast(`الديفرنسيال ${x.c.label} فصل: في تيار راجع من برّا الـN (تسريب أو N غلط)`,true);
 if(x.k==='blown')toast('💥 قصر مباشر بلا قاطع: الفيوز الرئيسي ضرب! شيك الشرايط وطفّي وشغّل.',true);
 if(x.k==='burn')toast(`🔥 ${x.c.label} انحطّ على 400V واحترق. الكويل بدّو فاز ونوترال.`,true);
 if(x.k==='oltrip')toast(x.why==='phase'?`الأوفرلود ${x.c.label} فصل: فاز ناقص عالموتور`:`الأوفرلود ${x.c.label} فصل: ضبطو أقل من تيار الموتور`,true);
 if(x.k==='chatter')toast('الدارة عم ترجف (الكونتاكتور عم يفصل ويوصل). شيك التثبيت.',true);}}
function runUI(){$('bRun').classList.toggle('on',B.on);$('runI').textContent=B.on?'■':'▶';$('runT').textContent=B.on?'طفّي':'شغّل';}
$('bRun').onclick=()=>{B.on=!B.on;B.blown=false;if(B.on){pend=null;sel=null;selW=null;closeSheets();if(tool==='wire')setTool('move');for(const c of B.comps){if(c.st.burnt)c.st.burnt=false;}last=performance.now();sim();raf=requestAnimationFrame(loop);toast('⚡ الكهربا شغّالة: جرّب الكبسات والقواطع. التحريك مقفول لحتى تطفّي.');}else stop();runUI();draw();};
function stop(){B.on=false;cancelAnimationFrame(raf);sim();runUI();}

/* ---------- المهمّة والفحص ---------- */
function taskCard(){const p=PJ;const seen=ls('panelSeen_'+p.id)==='1';ls('panelSeen_'+p.id,'1');$('task').classList.toggle('min',seen);
 $('task').innerHTML=`<b>📋 ${p.title}</b><p>${p.brief}</p><details><summary style="font-size:13px;color:var(--volt);cursor:pointer;font-weight:600">شو المطلوب بالتفصيل</summary><ul>${p.goals.map(g=>`<li>${g}</li>`).join('')}</ul></details>
 <div class="row"><button class="chip on" type="button" id="bCheck">✓ افحص مشروعي</button><button class="chip" type="button" id="bHint">💡 تلميح</button><button class="chip" type="button" id="bHide">إخفي ⌃</button></div>`;
 $('bCheck').onclick=check;$('bHint').onclick=hint;$('bHide').onclick=()=>{$('task').classList.add('min');};}
/* أنور بيشوف مشاريع كل طالب من التطبيق (📊): كم مرة فحص، شو غلط، كم تلميح */
function labLog(ev,x){try{const v=ls('mea_vid');if(!v||ls('meaTeacher')==='1')return;let l={};try{l=JSON.parse(ls('mea_lead')||'{}')||{};}catch(e){}
 fetch('https://utjpvjnhffapbwpbkkuc.supabase.co/rest/v1/rpc/lab_save',{method:'POST',keepalive:true,headers:{apikey:'sb_publishable_wSY0Oa0SmW_Ipgaerw-zCA_CM_PZQvK',Authorization:'Bearer sb_publishable_wSY0Oa0SmW_Ipgaerw-zCA_CM_PZQvK','Content-Type':'application/json'},
 body:JSON.stringify({p:Object.assign({vid:v,name:l.name||'',phone:l.phone||'',project:PJ.id,course:PJ.course,ev},x||{})})}).catch(()=>{});}catch(e){}}
/* الرموز الإنكليزية (KM2 21-22) بتنقلب بالنص العربي: منعزلها LTR */
const ltr=s=>String(s).replace(/[A-Za-z0-9][A-Za-z0-9.\-\/() ]*[A-Za-z0-9)]|[A-Za-z0-9]/g,m=>'<span dir="ltr" style="unicode-bidi:isolate">'+m+'</span>');
let hi=0;function hint(){const h=ltr(PJ.hints[hi%PJ.hints.length]);hi++;labLog('hint');$('resBody').innerHTML=`<h3>💡 تلميح ${((hi-1)%PJ.hints.length)+1} من ${PJ.hints.length}<button type="button" data-close>سكّر</button></h3><p style="font-size:15px;line-height:1.9;margin:0 4px 10px">${h}</p><button class="big alt" type="button" id="nh">التلميح الجاي</button>`;openSheet('sRes');$('nh').onclick=hint;}
function check(){const r=PJ.check(B);const n=r.filter(x=>x.pass).length,all=n===r.length;const NX=all&&ls('meaTeacher')!=='1'?window.PROJECTS.filter(x=>x.course===PJ.course&&x.n===PJ.n+1&&!x.soon)[0]:null;
 labLog('check',{board:JSON.parse(snapState()),n,t:r.length,fail:r.filter(x=>!x.pass).map(x=>String(x.txt).replace(/<[^>]*>/g,'').slice(0,200)),tip:r.filter(x=>!x.pass).map(x=>String(x.hint||'').replace(/<[^>]*>/g,'').slice(0,300))});
 if(all){ls('panelDone_'+PJ.id,'1');try{window.meaTrack&&window.meaTrack('done_'+PJ.id);}catch(e){}}
 $('resBody').innerHTML=`<h3>${all?'🎉 مشروعك زابط!':'نتيجة الفحص'}<button type="button" data-close>سكّر</button></h3>
 <div class="score${all?' win':''}">${n} / ${r.length}<small>${all?'برافو! الدارة شغّالة متل التابلو الحقيقي.':'صلّح اللي عليه ✗ وافحص كمان مرّة.'}</small></div>
 <ul class="res">${r.map(x=>`<li><i>${x.pass?'✅':'❌'}</i><div>${ltr(x.txt)}${x.pass?'':`<small>${ltr(x.hint)}</small>`}</div></li>`).join('')}</ul>
 ${all&&NX?`<a class="nxt" href="#${NX.id}" data-close>🔓 انفتحلك مشروع ${NX.n}: ${NX.title} ←</a>`:''}
 ${all?`<button class="big" type="button" onclick="location.hash=''">رجوع للمشاريع</button>`:''}`;openSheet('sRes');if(all)setTimeout(confetti,250);}

/* ✨ كبسة: دايرة صغيرة + رجفة خفيفة للتلفون */
function tapFx(e){try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}const r=document.createElement('i');r.className='rip';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),500);}
/* 🎉 مشروع زابط: قصاقيص ملوّنة */
function confetti(){try{navigator.vibrate&&navigator.vibrate([20,40,30]);}catch(x){}const C=['#22C79B','#ffc93c','#ff6b6b','#5aa9ff','#fff'];
 for(let i=0;i<60;i++){const d=document.createElement('i');d.className='cf';const a=Math.random()*Math.PI*2,v=140+Math.random()*260;
  d.style.cssText+=`background:${C[i%5]};--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v+260}px;--r:${(Math.random()*720-360)|0}deg;animation-delay:${Math.random()*.15}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),1900);}}
/* ---------- إشعار ---------- */
let tt=0;function toast(m,bad){const t=$('toast');t.textContent=m;t.classList.toggle('bad',!!bad);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),bad?3800:2400);}
window.addEventListener('resize',()=>{if(!$('lab').hidden)fit(false);});
window.PANEL={B,add,connect,draw,check:()=>PJ&&PJ.check(B)};
route();
})();
