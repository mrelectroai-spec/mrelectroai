<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>مختبر التابلو · MrElectroAI</title>

<meta name="theme-color" content="#06110e">

<style>
:root{--volt:#22C79B;--ink:#03140f;--text:#eef6f3;--muted:#a5bdb6;--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.14);--edge:rgba(255,255,255,.22);--edge2:rgba(255,255,255,.08);--warn:#ffb020;--bad:#ff5a52}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#06110e;color:var(--text);font-family:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* الخلفية: ألوان ناعمة ورا الزجاج */
.bg{position:fixed;inset:-20%;z-index:0;background:
 radial-gradient(40% 35% at 20% 25%,rgba(34,199,155,.42),transparent 70%),
 radial-gradient(35% 30% at 85% 20%,rgba(60,120,255,.32),transparent 70%),
 radial-gradient(45% 40% at 70% 85%,rgba(150,90,255,.26),transparent 70%),
 radial-gradient(40% 35% at 10% 90%,rgba(0,180,220,.25),transparent 70%),#06110e;
 filter:saturate(120%);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(6deg) scale(1.06)}}
.glass{background:linear-gradient(180deg,var(--glass2),var(--glass));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
 border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 10px 40px rgba(0,0,0,.35)}
/* شاشة المشاريع */
#home{position:fixed;inset:0;z-index:5;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
#home .wrap{max-width:720px;margin:0 auto}
.hb{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.hb a{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;text-decoration:none;color:var(--text)}
.hb h1{font:700 22px 'Readex Pro',sans-serif}.hb p{font-size:13px;color:var(--muted)}
.pc{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;margin-bottom:12px;width:100%;text-align:start;transition:transform .16s cubic-bezier(.2,.8,.2,1)}
.pc:active{transform:scale(.97)}
.pc .i{flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:rgba(255,255,255,.12);border:1px solid var(--edge2)}
.pc b{display:block;font-size:16px}.pc span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55}
.pc .go{margin-inline-start:auto;font-size:13px;color:var(--volt);font-weight:700;white-space:nowrap}
.pc.soon{opacity:.55}.pc.soon .go{color:var(--muted)}
.pc.done .go{color:#7dffc6}
.sec{font-size:13px;color:var(--muted);margin:18px 4px 8px;font-weight:600}
/* المختبر */
#lab{position:fixed;inset:0;z-index:2}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.top{position:fixed;z-index:6;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:8px;border-radius:20px;padding:6px}
.tb{min-width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;transition:transform .14s,background .2s;padding:0 10px}
.tb:active{transform:scale(.9)}.tb.on{background:rgba(34,199,155,.28);box-shadow:inset 0 0 0 1px rgba(34,199,155,.6)}
.top .ttl{flex:1;min-width:0;font:700 14.5px 'Readex Pro',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run{background:var(--volt);color:var(--ink);font-weight:700;font-size:14px;gap:6px;display:flex;align-items:center;padding:0 14px}
.run.on{background:#ff5a52;color:#fff}
.dock{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:6px;border-radius:24px;padding:6px}
.dock .tb{flex-direction:column;gap:1px;font-size:19px;height:52px;min-width:60px}
.dock .tb small{font-size:10.5px;color:var(--muted);font-weight:600}
.dock .tb.on small{color:#c9fff0}
/* الشيتات */
.sheet{position:fixed;z-index:8;left:0;right:0;bottom:0;max-height:72vh;border-radius:26px 26px 0 0;padding:10px 14px max(16px,env(safe-area-inset-bottom));overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1)}
.sheet.open{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.35);margin:2px auto 10px}
.sheet h3{font:700 16px 'Readex Pro',sans-serif;margin:0 4px 10px;display:flex;align-items:center;gap:8px}
.sheet h3 button{margin-inline-start:auto;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08)}
.cat{font-size:12.5px;color:var(--muted);margin:10px 4px 6px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{border-radius:18px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:transform .14s}
.tile:active{transform:scale(.93)}
.tile svg{width:100%;height:64px}.tile span{font-size:12px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{padding:9px 13px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--edge2);font-size:14px;font-weight:600;transition:transform .12s}
.chip:active{transform:scale(.94)}.chip.on{background:var(--volt);color:var(--ink);border-color:transparent}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}.sw.on{outline:3px solid var(--volt);outline-offset:2px}
.lbl{font-size:13px;color:var(--muted);margin:4px 4px 0}
.inp{width:100%;height:44px;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.25);color:var(--text);padding:0 12px;font:inherit;font-size:16px}
.big{width:100%;height:50px;border-radius:16px;background:var(--volt);color:var(--ink);font-weight:700;font-size:16px;margin-top:8px}
.big.alt{background:rgba(255,255,255,.12);color:var(--text)}.big.bad{background:rgba(255,90,82,.2);color:#ffb3ae}
.step{display:flex;align-items:center;gap:10px}.step button{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);font-size:22px;font-weight:700}
.step b{flex:1;text-align:center;font-size:20px}
/* المهمّة */
.task{position:fixed;z-index:5;top:calc(max(10px,env(safe-area-inset-top)) + 64px);right:10px;width:min(380px,calc(100% - 20px));border-radius:20px;padding:12px 14px;max-height:46vh;overflow:auto;transition:transform .3s cubic-bezier(.2,.9,.2,1),opacity .3s}
.task.min{transform:translateY(-8px);opacity:0;pointer-events:none}
.task b{font-size:14.5px}.task p{font-size:13.5px;line-height:1.7;margin:6px 0;color:#dceee8}
.task ul{margin:4px 18px 8px 0;font-size:13px;line-height:1.75;color:var(--muted)}
.task .row{margin:6px 0 0}
.res{list-style:none}.res li{display:flex;gap:10px;padding:10px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:14px;line-height:1.6}
.res li:first-child{border-top:0}.res i{font-style:normal;font-size:17px}.res small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.score{font:700 30px 'Readex Pro',sans-serif;text-align:center;margin:4px 0}.score small{display:block;font-size:13px;color:var(--muted);font-weight:500}
/* الإشعار */
#toast{position:fixed;z-index:9;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 62px);transform:translate(-50%,-14px);opacity:0;padding:10px 16px;border-radius:16px;font-size:14px;font-weight:600;max-width:calc(100% - 30px);text-align:center;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:rgba(120,20,20,.55);border-color:rgba(255,120,110,.5)}
/* SVG */
.tl{font:600 10.5px 'IBM Plex Sans Arabic',sans-serif;text-anchor:middle;fill:#2a3036;pointer-events:none}
.lt{font:600 11px 'IBM Plex Sans Arabic',sans-serif;text-anchor:middle;fill:#38414a;pointer-events:none}
.lt.b{font-weight:700}.lt.s{font-size:8.5px}.lt.w{fill:#fff}
.tag{font:700 13px 'Readex Pro',sans-serif;text-anchor:middle;fill:#e8fff6;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px;pointer-events:none}
.part{cursor:grab}.part.sel>.ol{stroke:var(--volt);stroke-width:2.5;stroke-dasharray:6 5;fill:rgba(34,199,155,.06)}
.act{cursor:pointer}
.tp{fill:transparent;cursor:crosshair}.tp.hot{fill:rgba(34,199,155,.35);stroke:var(--volt);stroke-width:2}
.tp.pend{fill:rgba(255,200,0,.4);stroke:#ffc400;stroke-width:2.5}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wsel{fill:none;stroke:#fff;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 13;animation:flow .9s linear infinite;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-16}}
.hot{animation:hotw .6s ease-in-out infinite alternate}@keyframes hotw{to{stroke:#ff7a1a}}
.spin{animation:spin .45s linear infinite}.spinr{animation:spin .45s linear infinite reverse}.hum{animation:hum .08s linear infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes hum{to{transform:translateX(1.5px)}}
.whd{fill:#fff;stroke:var(--volt);stroke-width:2.5;cursor:ns-resize}
.sleeve{fill:#f4f6f7;stroke:#9aa3ab;stroke-width:.8}.sleevet{font:700 9.5px 'IBM Plex Sans Arabic',sans-serif;text-anchor:middle;fill:#1d2328;pointer-events:none}
.rub{stroke:var(--volt);stroke-width:4;stroke-dasharray:8 6;fill:none;pointer-events:none}
.frame text{font:600 13px 'Readex Pro',sans-serif;fill:rgba(255,255,255,.45);text-anchor:middle}
@media (prefers-reduced-motion:reduce){.bg,.flow,.spin,.spinr,.hum{animation:none}}
</style>

<div class="bg" aria-hidden="true"></div>

<section id="home">
 <div class="wrap">
  <div class="hb"><a class="glass" href="../app/" aria-label="رجوع">→</a><div><h1>مختبر التابلو ⚡</h1><p>ركّب، وصّل، شغّل، وشوف إذا مشروعك زابط.</p></div><div id="langSlot" style="margin-inline-start:auto"></div></div>
  <button class="pc glass" type="button" data-open="free"><div class="i">🧪</div><div><b>مختبر حرّ</b><span>كل القطع قدّامك: جرّب أي دارة بدّك ياها.</span></div><div class="go">افتح ←</div></button>

 </div>

 <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>

 </nav>
 <div class="sheet glass" id="sLib"><div class="grab"></div><h3>🧩 القطع<button type="button" data-close>سكّر</button></h3><div id="libBody"></div></div>
 <div class="sheet glass" id="sProp"><div class="grab"></div><div id="propBody"></div></div>

<script>
(function(){
'use strict';
const {P,motorI,CAP,GAUGES,RAT1,RAT3,COLORS,DEFS}=window.PARTS;
const $=i=>document.getElementById(i),NS='http://www.w3.org/2000/svg';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}};
const W=1700,H=1150; // ورقة التابلو
const RAILS=[300,560,820];
let B={comps:[],wires:[],on:false,blown:false},E=window.PENGINE(B),PJ=null,KEY='',cam={x:0,y:0,w:W,h:H},tool='move',sel=null,selW=null,pend=null,undo=[],events=[];

/* ---------- الصفحات ---------- */
function done(id){return ls('panelDone_'+id)==='1';}
function homeList(){const card=p=>`<button class="pc glass${p.soon?' soon':''}${done(p.id)?' done':''}" type="button" ${p.soon?'disabled':''} data-open="${p.id}"><div class="i">${p.icon}</div><div><b>مشروع ${p.n}: ${p.title}</b><span>${p.soon?'قريباً':done(p.id)?'خلّصتو ✓ فيك تعيدو':'ركّب الدارة كاملة، وبفحصلك ياها لحالي.'}</span></div><div class="go">${p.soon?'قريباً':done(p.id)?'✓ خلص':'ابدا ←'}</div></button>`;
 const C=[['electro','مشاريع كورس الكهربا'],['classic','مشاريع كورس الكلاسيك كنترول']];
 $('plist').innerHTML=C.map(([k,t])=>{const L=window.PROJECTS.filter(p=>p.course===k);const d=L.filter(p=>done(p.id)).length;return `<div class="sec">${t} · ${d}/${L.length} ✓</div>`+L.map(card).join('');}).join('')+
 `<div class="sec">مشاريع كورس الطاقة الشمسية</div><a class="pc glass" href="../sim/#projects" style="text-decoration:none;color:inherit"><div class="i">☀️</div><div><b>مشاريع الطاقة الشمسية</b><span>6 مشاريع بمختبر الطاقة: إنفرتر، بطاريات، ألواح، وإعدادات.</span></div><div class="go">افتح ←</div></a>`;}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o&&!o.disabled)location.hash=o.dataset.open;});
function route(){const h=location.hash.slice(1);if(!h){$('lab').hidden=true;$('home').hidden=false;homeList();stop();return;}
 const p=window.PROJECTS.find(x=>x.id===h&&!x.soon);if(h!=='free'&&!p){location.hash='';return;}
 open(p||null);}
window.addEventListener('hashchange',route);

function open(p){PJ=p;KEY='panel_'+(p?p.id:'free');$('home').hidden=true;$('lab').hidden=false;$('ttl').textContent=p?`مشروع ${p.n}: ${p.title}`:'مختبر حرّ';
 B.on=false;B.blown=false;runUI();
 let saved=null;try{saved=JSON.parse(ls(KEY)||'null');}catch(e){}
 if(saved&&saved.comps){B.comps=saved.comps;B.wires=saved.wires;for(const c of B.comps){c.st={};if(c.type.startsWith('mcb')||c.type==='rcd')c.st.on=true;}}
 else{B.comps=[];B.wires=[];if(p)p.setup((t,x,y)=>add(t,x,y,true));}
 undo=[];sel=null;selW=null;pend=null;$('task').hidden=!p;if(p)taskCard();setTool('move');fit(false);draw();}
$('bBack').onclick=()=>{location.hash='';};

/* ---------- القطع ---------- */
function nid(t){let i=1;while(B.comps.some(c=>c.id===t+i))i++;return t+i;}
function nlabel(t){const pre=P[t].pre;if(!pre)return '';let i=1;while(B.comps.some(c=>c.label===pre+i))i++;return pre+i;}
function add(t,x,y,quiet){const d=P[t];const c=Object.assign({id:nid(t),type:t,x:snap(x),y:y,label:nlabel(t),st:{}},JSON.parse(JSON.stringify(d.def||{})));
 if(t.startsWith('mcb')||t==='rcd')c.st.on=true;c.y=railY(c,y);B.comps.push(c);if(!quiet){sel=c.id;selW=null;}return c;}
const snap=v=>Math.round(v/10)*10;
const DIN={mcb1:1,mcb3:1,rcd:1,kc:1,ol:1,relay:1,tmr:1,tb:1};
function railY(c,y){const h=P[c.type].h;if(!DIN[c.type])return snap(y);
 for(const r of RAILS)if(Math.abs(y+h/2-r)<70)return r-h/2;return snap(y);}
function tpos(k){const [id,n]=k.split('.');const c=B.comps.find(x=>x.id===id);if(!c)return null;const t=P[c.type].terms.find(x=>x.n===n);return t?{x:c.x+t.x,y:c.y+t.y,d:t.d}:null;}

/* ---------- الرسم ---------- */
const svg=$('svg');
function frame(){let s=`<rect x="0" y="0" width="${W}" height="${H}" rx="28" fill="url(#gPlate)" stroke="rgba(255,255,255,.28)" stroke-width="2"/><rect x="0" y="0" width="${W}" height="${H}" rx="28" fill="url(#gSheen)" pointer-events="none"/>`;
 s+=`<g class="frame">`;for(let i=0;i<8;i++){const x=40+i*(W-80)/8;s+=`<line x1="${x}" y1="18" x2="${x}" y2="34" stroke="rgba(255,255,255,.25)"/><text x="${x+(W-80)/16}" y="31">${i+1}</text>`;}
 'ABCDE'.split('').forEach((L,i)=>{const y=60+i*(H-120)/5;s+=`<text x="22" y="${y+(H-120)/10+5}">${L}</text>`;});s+=`</g>`;
 s+=`<rect x="40" y="40" width="${W-80}" height="${H-80}" rx="16" fill="none" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 8"/>`;
 for(const r of RAILS)s+=`<rect x="70" y="${r-14}" width="${W-140}" height="28" rx="3" fill="url(#gRail)" opacity=".9"/>`+Array.from({length:Math.floor((W-160)/40)},(_,i)=>`<rect x="${86+i*40}" y="${r-4}" width="22" height="8" rx="3" fill="rgba(40,48,56,.55)"/>`).join('');
 s+=`<g transform="translate(${W-420} ${H-96})"><rect width="380" height="64" rx="12" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.2)"/><text x="190" y="27" style="font:700 15px 'Readex Pro';fill:#dffcf2;text-anchor:middle">MrElectroAI · مختبر التابلو</text><text x="190" y="49" style="font:500 12.5px 'IBM Plex Sans Arabic';fill:rgba(255,255,255,.6);text-anchor:middle">${PJ?'مشروع '+PJ.n+': '+PJ.title:'مختبر حرّ'}</text></g>`;
 return s;}
function wpath(w){const a=tpos(w.a),b=tpos(w.b);if(!a||!b)return null;
 const a1={x:a.x,y:a.y+a.d*22},b1={x:b.x,y:b.y+b.d*22};
 let my=w.my;if(my==null){if(a.d>0&&b.d>0)my=Math.max(a1.y,b1.y)+16;else if(a.d<0&&b.d<0)my=Math.min(a1.y,b1.y)-16;else my=(a1.y+b1.y)/2;}
 const pts=[[a.x,a.y],[a1.x,a1.y],[a1.x,my],[b1.x,my],[b1.x,b1.y],[b.x,b.y]].filter((p,i,arr)=>!i||p[0]!==arr[i-1][0]||p[1]!==arr[i-1][1]);
 // زوايا مدوّرة
 let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const p=pts[i],q=pts[i-1],n=pts[i+1];
  const r=Math.min(10,Math.hypot(p[0]-q[0],p[1]-q[1])/2,Math.hypot(n[0]-p[0],n[1]-p[1])/2);
  const ux=Math.sign(p[0]-q[0]),uy=Math.sign(p[1]-q[1]),vx=Math.sign(n[0]-p[0]),vy=Math.sign(n[1]-p[1]);

 if(d.t==='pan'&&!d.moved){if(sel||selW||pend){sel=null;selW=null;pend=null;closeSheets();draw();}}}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=wpt(e);const k=Math.exp(e.deltaY*0.0015);const nw=Math.max(300,Math.min(W*2.6,cam.w*k)),nh=nw*cam.h/cam.w;
 cam={x:p.x-(p.x-cam.x)*nw/cam.w,y:p.y-(p.y-cam.y)*nh/cam.h,w:nw,h:nh};applyCam();},{passive:false});
function drawWiresOnly(){draw();}
function connect(a,b){if(a===b)return;if(a.split('.')[0]===b.split('.')[0]&&P[B.comps.find(c=>c.id===a.split('.')[0]).type].links)
 {}
 if(B.wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){toast('هالشريط موجود');draw();return;}
 push();const pa=E.termInfo(a),pb=E.termInfo(b);const pw=pa&&pb&&pa.pw&&pb.pw;const isPE=/\.PE$/.test(a)||/\.PE$/.test(b);const isN=/\.N$/.test(a)||/\.N$/.test(b);
 const ph=(/\.(L1|U1|L)$/.test(a)||/\.L$/.test(b)||/\.(L1|U1)$/.test(b))?'br':(/\.(L2|V1)$/.test(a)||/\.(L2|V1)$/.test(b))?'bk':(/\.(L3|W1)$/.test(a)||/\.(L3|W1)$/.test(b))?'gr':null;
 let i=1;while(B.wires.some(w=>w.id==='w'+i))i++;
 const w={id:'w'+i,a,b,color:isPE?'gy':isN?'bl':pw?(ph||'bk'):'rd',mm2:isPE?2.5:pw?1.5:1,num:''};
 B.wires.push(w);pend=null;save();sim();draw();toast(pw?'شريط باور: شيك المقطع على تيار الموتور':'شريط تحكم');}

/* ---------- الكبسات والقواطع ---------- */
function control(id,a,down){const c=B.comps.find(x=>x.id===id);if(!c)return;
 if(a==='press'){c.st.p=down;}
 else if(down&&a==='latch'){c.st.p=!c.st.p;}
 else if(down&&a==='lever'){if(c.st.trip){c.st.trip=false;c.st.on=false;c.st.heat=0;}else c.st.on=!c.st.on;if(B.blown&&c.st.on)B.blown=false;}
 else if(down&&a==='test'){c.st.trip=true;}
 else if(down&&a==='reset'){c.st.trip=false;c.st.heat=0;}
 else if(down&&a==='dial'){sel=c.id;chipFor(c);}
 else if(down&&a==='avail'){c.st.off=!c.st.off;toast(c.st.off?'المصدر انقطع':'رجع المصدر');}
 else if(down&&a==='smoke'){c.st.smoke=!c.st.smoke;}
 else if(down&&a==='toggle'){c.st.on=!c.st.on;}
 else if(down&&a==='leak'){c.st.leak=!c.st.leak;if(c.st.leak)toast('عملت تسريب عالأرض بهالجهاز: الديفرنسيال لازم يفصل',true);}
 else return;sim();draw();}

/* ---------- الملتيميتر ---------- */
function probe(k){if(!B.on){toast('شغّل الكهربا أوّل (زر ▶ فوق)');return;}const lv=E.live(k);const c=B.comps.find(x=>x.id===k.split('.')[0]);
 const nm=(c.label||P[c.type].name)+' · '+k.split('.')[1];
 if(!lv){toast(`${nm}: 0V، ما في كهربا`);return;}
 if(lv==='N'||lv==='PE'){toast(`${nm}: ${lv==='N'?'نوترال':'أرضي'} (0V)`);return;}
 toast(`${nm}: ${lv} · 230V مع النوترال · 400V مع الفاز التاني`);}

/* ---------- التشغيل ---------- */
let raf=0,last=0;
function sim(){if(!B.on){for(const c of B.comps){if(c.type==='kc'||c.type==='tmr'){c.st.e=false;c.st.t=0;c.st.done=false;}if(c.type==='lamp'||c.type==='load'||c.type==='bulb'||c.type==='siren')c.st.on=false;if(c.type==='relay')c.st.e=false;if(c.type==='socket')c.st.v=false;if(c.type==='motor'||c.type==='motor6'){c.st.m='off';c.st.I=0;}}B._N=null;for(const w of B.wires){w.I=0;w.heat=0;}return;}
 const ev=[];E.solve(ev);report(ev);}
function loop(t){if(!B.on)return;const dt=Math.min(.1,(t-last)/1000||0);last=t;const ev=[];E.tick(dt,ev);report(ev);
 if(!loop.n||t-loop.n>120){loop.n=t;draw();}raf=requestAnimationFrame(loop);}
function report(ev){for(const x of ev){
 if(x.k==='trip')toast(x.why==='short'?`⚡ قصر! فصل القاطع ${x.c.label}`:x.why==='cross'?`⚡ ربطت مصدرين ببعض! فصل ${x.c.label}`:`القاطع ${x.c.label} فصل: الحمل أكبر منو`,true);
 if(x.k==='rcd')toast(`الديفرنسيال ${x.c.label} فصل: في تيار راجع من برّا الـN (تسريب أو N غلط)`,true);
 if(x.k==='blown')toast('💥 قصر مباشر بلا قاطع: الفيوز الرئيسي ضرب! شيك الشرايط وطفّي وشغّل.',true);
 if(x.k==='burn')toast(`🔥 ${x.c.label} انحطّ على 400V واحترق. الكويل بدّو فاز ونوترال.`,true);
 if(x.k==='oltrip')toast(x.why==='phase'?`الأوفرلود ${x.c.label} فصل: فاز ناقص عالموتور`:`الأوفرلود ${x.c.label} فصل: ضبطو أقل من تيار الموتور`,true);
 if(x.k==='chatter')toast('الدارة عم ترجف (الكونتاكتور عم يفصل ويوصل). شيك التثبيت.',true);}}
function runUI(){$('bRun').classList.toggle('on',B.on);$('runI').textContent=B.on?'■':'▶';$('runT').textContent=B.on?'طفّي':'شغّل';}
$('bRun').onclick=()=>{B.on=!B.on;B.blown=false;if(B.on){for(const c of B.comps){if(c.st.burnt)c.st.burnt=false;}last=performance.now();sim();raf=requestAnimationFrame(loop);toast('⚡ الكهربا شغّالة: جرّب الكبسات');}else stop();runUI();draw();};
function stop(){B.on=false;cancelAnimationFrame(raf);sim();runUI();}

/* ---------- المهمّة والفحص ---------- */
function taskCard(){const p=PJ;const seen=ls('panelSeen_'+p.id)==='1';ls('panelSeen_'+p.id,'1');$('task').classList.toggle('min',seen);
 $('task').innerHTML=`<b>📋 ${p.title}</b><p>${p.brief}</p><details><summary style="font-size:13px;color:var(--volt);cursor:pointer;font-weight:600">شو المطلوب بالتفصيل</summary><ul>${p.goals.map(g=>`<li>${g}</li>`).join('')}</ul></details>
 <div class="row"><button class="chip on" type="button" id="bCheck">✓ افحص مشروعي</button><button class="chip" type="button" id="bHint">💡 تلميح</button><button class="chip" type="button" id="bHide">إخفي ⌃</button></div>`;
 $('bCheck').onclick=check;$('bHint').onclick=hint;$('bHide').onclick=()=>{$('task').classList.add('min');};}
let hi=0;function hint(){const h=PJ.hints[hi%PJ.hints.length];hi++;$('resBody').innerHTML=`<h3>💡 تلميح ${((hi-1)%PJ.hints.length)+1} من ${PJ.hints.length}<button type="button" data-close>سكّر</button></h3><p style="font-size:15px;line-height:1.9;margin:0 4px 10px">${h}</p><button class="big alt" type="button" id="nh">التلميح الجاي</button>`;openSheet('sRes');$('nh').onclick=hint;}
function check(){const r=PJ.check(B);const n=r.filter(x=>x.pass).length,all=n===r.length;
 if(all){ls('panelDone_'+PJ.id,'1');try{window.meaTrack&&window.meaTrack('done_'+PJ.id);}catch(e){}}
 $('resBody').innerHTML=`<h3>${all?'🎉 مشروعك زابط!':'نتيجة الفحص'}<button type="button" data-close>سكّر</button></h3>
 <div class="score">${n} / ${r.length}<small>${all?'برافو! الدارة شغّالة متل التابلو الحقيقي.':'صلّح اللي عليه ✗ وافحص كمان مرّة.'}</small></div>
 <ul class="res">${r.map(x=>`<li><i>${x.pass?'✅':'❌'}</i><div>${x.txt}${x.pass?'':`<small>${x.hint}</small>`}</div></li>`).join('')}</ul>
 ${all?`<button class="big" type="button" onclick="location.hash=''">رجوع للمشاريع</button>`:''}`;openSheet('sRes');}

/* ---------- إشعار ---------- */
let tt=0;function toast(m,bad){const t=$('toast');t.textContent=m;t.classList.toggle('bad',!!bad);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),bad?3800:2400);}
window.addEventListener('resize',()=>{if(!$('lab').hidden)fit(false);});
window.PANEL={B,add,connect,draw,check:()=>PJ&&PJ.check(B)};
route();
})();
</script>
