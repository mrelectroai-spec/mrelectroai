  warn:'هيدا تبديل مع انقطاع قصير (مش تزامن). لتشغيل موتيرين سوا عنفس البار بدّك لوحة تزامن (Synchronizing)، وهيدي شغلة تانية.'},
 sol1:{icon:'☀️',grp:'solar',title:'تابلو طاقة شمسية مونوفاز (إنفرتر هايبرد)',lvl:'طاقة شمسية · مونوفاز',

const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VB='<svg width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1D9BF0"/><path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.4l3 3 5.8-6.2"/></svg>';
const PJ=(window.PROJECTS||[]);
function home(){let h='';[['ats','🔀 ATS وموتيرات'],['solar','☀️ تابلوهات طاقة شمسية']].forEach(([g,n])=>{h+=`<div class="grp">${n}</div><div class="list">`;Object.entries(EX).filter(([k,e])=>e.grp===g).forEach(([k,e])=>{h+=`<a class="it" href="?p=${k}"><i>${e.icon}</i><div><b>${esc(e.title)}</b><small>${e.lvl} · مخطط، قطع، خطوات، وفحص</small></div></a>`;});h+='</div>';});
 [['classic','⚙️ الكلاسيك كنترول'],['electro','💡 الكهربا']].forEach(([c,n])=>{h+=`<div class="grp">${n}</div><div class="list">`;
 PJ.filter(p=>p.course===c&&SH[p.id]).forEach(p=>{h+=`<a class="it" href="?p=${p.id}"><i>${p.icon}</i><div><b>${esc(p.title)}</b><small>${SH[p.id].lvl} · مخطط، قطع، خطوات، وفحص</small></div></a>`;});h+='</div>';});
 $('home').innerHTML=h;}
function sheet(id){let p=PJ.find(x=>x.id===id),d=SH[id];const e=EX[id];if(e){d=e;p={id,n:'',title:e.title,icon:e.icon,brief:e.brief,goals:e.checks,hints:e.steps,ex:1};}if(!p||!d){home();return;}
 document.title=p.title+' | ورقة تمرين MrElectroAI';$('bt').textContent=p.icon+' '+p.title;$('pr').hidden=false;$('home').hidden=true;$('sheet').hidden=false;
 let h=`<div class="page"><div class="hd"><div><div class="tt"><small>${d.lvl} ${p.n?' · ورقة تمرين '+p.n:''}</small>${esc(p.title)}</div></div><div><div class="lg"><i><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#22C79B" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></i>MrElectroAI</div><div class="by">أنور الجاسم ${VB}</div></div></div>`;
 h+=`<h2>🎯 المطلوب</h2><div class="brief">${esc(p.brief)}</div>`;
 if(d.dg)h+=`<h2>📐 المخطط</h2><div class="dg">${d.dg()}</div>`;
 h+=`<h2>🧩 القطع</h2><table><tr><th>القطعة</th><th>العدد</th><th>موديل مقترح</th></tr>${d.bom.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="m">${esc(r[2])}</td></tr>`).join('')}</table>`;
 h+=`<h2>🛠️ خطوات التركيب</h2><ol class="st">${(p.hints||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
 if(d.warn)h+=`<div class="warn">⚠️ ${esc(d.warn)}</div>`;
 h+=`<h2>✅ افحص حالك</h2><ul class="ck">${(p.goals||[]).map(x=>`<li>${esc(x)}</li>`).join('')}<li>شغّل وجرّب قبل ما تسكّر التابلو، والكهربا مقطوعة وإنت عم تشتغل.</li></ul>`;
 h+=`<div class="ft"><div class="q"><div id="qr"></div><div>${p.ex?'<b>الورقة أونلاين</b><br>امسح الرمز لتفتحها عالتلفون.':'<b>جرّبها بمختبر التابلو</b><br>امسح الرمز وركّبها عالتلفون، والمختبر بيفحصلك ياها.'}</div></div><div style="text-align:left">mrelectroai-spec.github.io/mrelectroai<br>واتساب: 79 434 479</div></div></div>`;
 $('sheet').innerHTML=h;
 try{new QRCode($('qr'),{text:p.ex?'https://mrelectroai-spec.github.io/mrelectroai/panel/sheet.html?p='+id:'https://mrelectroai-spec.github.io/mrelectroai/panel/#'+id,width:64,height:64,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
const id=new URLSearchParams(location.search).get('p');
if(id)sheet(id);else home();
$('pr').onclick=()=>window.print();
})();
