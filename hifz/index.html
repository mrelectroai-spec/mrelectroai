<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رفيق الحفظ</title>
<meta name="description" content="حفظ سورتي البقرة وآل عمران بالمراحل مع التجويد والتسميع والمراجعة">
<meta name="theme-color" content="#0F5B4E">
<link rel="manifest" href="manifest.webmanifest">
<script>if(window.Capacitor){document.write('<script src="cap-bridge.js"><\/script>');}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رفيق الحفظ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2E9;--card:#FFFDF8;--ink:#1D2B27;--muted:#6B7A74;--line:#E6DFCF;
  --pri:#0F5B4E;--pri-ink:#fff;--pri-soft:#E2EFEA;--gold:#A9821A;--gold-soft:#F5ECD2;
  --ok:#2E8B57;--mid:#C7891B;--bad:#C0473A;--shadow:0 1px 2px rgba(30,40,35,.06),0 4px 14px rgba(30,40,35,.06);
  --t-h:#9A9A9A;--t-s:#9A9A9A;--t-l:#9A9A9A;--t-d:#8A8A8A;--t-b:#8A8A8A;
  --t-n:#4A7BEA;--t-p:#3550E0;--t-m:#1A2BA8;--t-o:#2B48C2;--t-q:#D11A2A;
  --t-c:#C21EA6;--t-w:#4E9E12;--t-f:#8E17A3;--t-i:#1C9AD6;--t-a:#12806A;--t-u:#2F7A1F;--t-g:#E8731A;
  --qsize:28px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1715;--card:#17221F;--ink:#ECE6D6;--muted:#9AA8A2;--line:#26332F;
    --pri:#3FB494;--pri-ink:#06231C;--pri-soft:#173A31;--gold:#D9B44A;--gold-soft:#3A3218;
    --ok:#4CC27F;--mid:#E3A93B;--bad:#EF6F62;--shadow:none;
    --t-h:#8B9590;--t-s:#8B9590;--t-l:#8B9590;--t-d:#8B9590;--t-b:#8B9590;
    --t-n:#7FA4FF;--t-p:#8C98FF;--t-m:#A7B0FF;--t-o:#6F8CFF;--t-q:#FF6B74;
    --t-c:#F06BD8;--t-w:#8BD455;--t-f:#D07AE6;--t-i:#5FC8F5;--t-a:#4FD1AE;--t-u:#7CCB5C;--t-g:#FFA25A;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:36px}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.iconbtn:active{background:var(--pri-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--pri);color:var(--pri-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.block{width:100%}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.hello{font-size:22px;font-weight:700;margin:0}
.stat{display:flex;gap:10px}
.stat > div{flex:1;background:var(--pri-soft);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--pri)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--gold));border-radius:99px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);width:100%;text-align:right;margin-top:8px}
.task .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--pri-soft);flex:none}
.task.goldt .ic{background:var(--gold-soft)}
.task b{display:block}
.task .go{margin-inline-start:auto;color:var(--muted);font-size:20px}
/* map */
.station{margin-bottom:18px}
.station-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.node{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;position:relative;padding:4px}
.node small{font-weight:400;font-size:10px;color:var(--muted);line-height:1.2;text-align:center}
.node.done{background:var(--gold-soft);border-color:var(--gold)}
.node.done::after{content:"✓";position:absolute;top:3px;left:6px;font-size:12px;color:var(--gold)}
.node.cur{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.node.cur small{color:var(--pri-ink);opacity:.85}
.node.learn{border-color:var(--pri);border-style:dashed}
.node.lock{opacity:.45}
.node.lock::after{content:"🔒";position:absolute;top:2px;left:4px;font-size:10px}
/* quran text */
.q{font-family:"Amiri Quran","Amiri",serif;font-size:var(--qsize);line-height:2.15;direction:rtl;text-align:justify;word-spacing:2px}
.ayah{border-radius:12px;padding:2px 6px;transition:background .2s}
.ayah.playing{background:var(--gold-soft)}
.ayah-list .ayah{display:block;padding:10px 8px;border-bottom:1px dashed var(--line)}
.ayah-list .ayah:last-child{border-bottom:0}
.end{font-family:"Amiri Quran","Amiri",serif;color:var(--gold);font-size:.85em;white-space:nowrap}
.basmala{text-align:center;font-family:"Amiri Quran","Amiri",serif;font-size:calc(var(--qsize) * .95);color:var(--pri);margin:4px 0 10px}
.tj .t-h,.tj .t-s,.tj .t-l{color:var(--t-h)}
.tj .t-d,.tj .t-b{color:var(--t-d)}
.tj .t-n{color:var(--t-n)}.tj .t-p{color:var(--t-p)}.tj .t-m{color:var(--t-m)}.tj .t-o{color:var(--t-o)}
.tj .t-q{color:var(--t-q)}.tj .t-c{color:var(--t-c)}.tj .t-w{color:var(--t-w)}.tj .t-f{color:var(--t-f)}
.tj .t-i{color:var(--t-i)}.tj .t-a{color:var(--t-a)}.tj .t-u{color:var(--t-u)}.tj .t-g{color:var(--t-g)}
.w{display:inline}
.hid{display:inline-block;height:.9em;vertical-align:middle;border-radius:8px;background:var(--line);margin:0 3px;cursor:pointer}
.hid:active{background:var(--pri-soft)}
.peek{color:var(--pri)}
mark.tgt{background:var(--gold-soft);color:var(--bad);border-radius:6px;padding:0 2px;box-shadow:inset 0 -3px 0 var(--bad)}
/* tabs */
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:14px;position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:4}
.tabs button{flex:1;border:0;background:none;border-radius:12px;padding:9px 4px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--pri);color:var(--pri-ink);font-weight:700}
.tabs button .ck{font-size:11px}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps span.on{background:var(--gold)}
.counter{display:flex;align-items:center;gap:8px}
.counter b{min-width:28px;text-align:center;font-size:20px;color:var(--pri)}
.gradebar{display:flex;gap:6px;margin-top:8px}
.gradebar button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-size:14px}
.gradebar button.on.g2{background:var(--ok);color:#fff;border-color:var(--ok)}
.gradebar button.on.g1{background:var(--mid);color:#fff;border-color:var(--mid)}
.gradebar button.on.g0{background:var(--bad);color:#fff;border-color:var(--bad)}
.tcard{padding:12px 0;border-bottom:1px dashed var(--line)}
.tcard:last-child{border-bottom:0}
.tcard .num{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 10px;font-size:13px}
.opt{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-top:8px;font-weight:500}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.rule:last-child{border-bottom:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:6px}
.ex{font-family:"Amiri Quran","Amiri",serif;font-size:24px;line-height:2}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-weight:500;margin-bottom:6px}
.field input[type=text],.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:22px;height:22px;accent-color:var(--pri)}
input[type=range]{width:100%;accent-color:var(--pri)}
/* nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.bottom .in{max-width:640px;margin:0 auto;display:flex}
nav.bottom a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;padding:4px 0;border-radius:12px;position:relative}
nav.bottom a .i{display:block;font-size:20px;line-height:1.3}
nav.bottom a.on{color:var(--pri);font-weight:700}
nav.bottom a .badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40;padding:20px}
.modal .box{background:var(--card);border-radius:22px;padding:24px 20px;max-width:380px;width:100%;text-align:center}
.modal .big{font-size:52px;line-height:1.2}
.center{text-align:center}
.loading{display:grid;place-items:center;min-height:70vh;text-align:center}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
audio{width:100%;margin-top:8px}
.tip{background:var(--gold-soft);border-radius:14px;padding:12px;font-size:14px}
.sticky-play{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:3}
/* الفهرس والدولاب */
.wheel-head{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-bottom:6px}
.wheel-head span:first-child{flex:2;text-align:center}.wheel-head span:last-child{flex:1;text-align:center}
.wheels{display:flex;gap:12px}
.wheel-wrap{position:relative;flex:2}
.wheel-wrap.narrow{flex:1}
.wheel-wrap::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;background:var(--pri-soft);border-radius:12px;pointer-events:none}
.wheel{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:88px}
.wheel .it{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;scroll-snap-align:center;font-size:16px;color:var(--muted);white-space:nowrap;cursor:pointer;transition:font-size .12s,color .12s}
.wheel .it.sel{color:var(--pri);font-weight:700;font-size:19px}
.wheel .sn{font-size:12px;opacity:.7}
.sel{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:inherit;color:inherit}
/* التسميع بالمايك */
.rca{padding:8px 6px;border-bottom:1px dashed var(--line)}
.rca:last-of-type{border-bottom:0}
.rca.cur{background:var(--pri-soft);border-radius:14px;border-bottom:0}
.wl{color:var(--mid);text-decoration:underline wavy var(--mid);text-underline-offset:6px}
.we{color:var(--bad);text-decoration:underline var(--bad);text-underline-offset:6px}
.wh{color:var(--gold)}
.fast{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:12px;color:var(--gold);white-space:nowrap}
.rcbar{display:flex;gap:8px}
.rcbar .sq{flex:none;width:54px;background:var(--card);padding:0;font-size:20px}
.mic.on{background:var(--bad);color:#fff}
.legend{display:grid;gap:6px;margin-top:10px}
.lg{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;text-align:right;display:flex;gap:10px;align-items:center;font-size:13px;width:100%}
.lg .dot{margin-top:0}
.linkbtn{background:none;border:0;color:var(--pri);font-weight:500;padding:6px 2px;font-size:14px;text-decoration:underline;text-underline-offset:4px}
.howto{margin:0 0 12px;padding-inline-start:22px;color:var(--muted);font-size:14px;line-height:1.9}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><button class="iconbtn" id="backBtn" aria-label="رجوع" hidden>→</button><h1 id="title">رفيق الحفظ</h1><span id="streakTop" class="small muted"></span></div></header>
<main class="wrap" id="app"><div class="loading"><div><div class="spin"></div><div id="loadMsg">عم نحضّر المصحف…</div></div></div></main>
<nav class="bottom" id="nav" hidden><div class="in">
  <a href="#home" data-r="home"><span class="i">🏠</span>الرئيسية</a>
  <a href="#map" data-r="map"><span class="i">🗺️</span>المراحل</a>
  <a href="#index" data-r="index"><span class="i">📑</span>الفهرس</a>
  <a href="#review" data-r="review"><span class="i">🔁</span>المراجعة<span class="badge" id="revBadge" hidden></span></a>
  <a href="#tajweed" data-r="tajweed"><span class="i">🎨</span>التجويد</a>
  <a href="#settings" data-r="settings"><span class="i">⚙️</span>الإعدادات</a>
</div></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ ثوابت ============ */
const API = 'https://api.alquran.cloud/v1';
const IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const SURAHS = [{n:2,name:'البقرة',count:286},{n:3,name:'آل عمران',count:200}];
const RECITERS = [
  {id:'ar.husary', name:'محمود خليل الحصري (مرتّل)', g:'slow'},
  {id:'ar.minshawi', name:'محمد صدّيق المنشاوي (مرتّل)', g:'slow'},
  {id:'ar.abdulbasitmurattal', name:'عبد الباسط عبد الصمد (مرتّل)', g:'slow'},
  {id:'ar.husarymujawwad', name:'الحصري (مجوّد)', g:'slow'},
  {id:'ar.alafasy', name:'مشاري العفاسي', g:'mid'},
  {id:'ar.shaatree', name:'أبو بكر الشاطري', g:'mid'},
  {id:'ar.ahmedajamy', name:'أحمد العجمي', g:'mid'},
  {id:'ar.muhammadayyoub', name:'محمد أيوب', g:'mid'},
  {id:'ar.hudhaify', name:'علي الحذيفي', g:'mid'},
  {id:'ar.mahermuaiqly', name:'ماهر المعيقلي', g:'fast'},
  {id:'ar.abdurrahmaansudais', name:'عبد الرحمن السديس', g:'fast'},
  {id:'ar.saoodshuraym', name:'سعود الشريم', g:'fast'}
];
const RGROUPS = {slow:'🐢 هادئ وواضح (للحفظ الجديد)', mid:'🚶 وسط', fast:'🏃 سريع (للمراجعة)'};
const SILENT = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';

const RULE_GROUPS = [
  {title:'أحكام النون الساكنة والتنوين', codes:['a','u','i','f']},
  {title:'أحكام الميم الساكنة', codes:['c','w']},
  {title:'المدود', codes:['n','o','p','m']},
  {title:'القلقلة والغنّة', codes:['q','g']},
  {title:'حروف تُكتب ولا تُلفظ', codes:['h','l','s']},
  {title:'إدغامات أخرى', codes:['d','b']}
];
const RULES = {
  a:{name:'إدغام بغنّة', desc:'نون ساكنة أو تنوين بعدها حرف من حروف «يَنمو» (ي ن م و): بتدخل النون بالحرف اللي بعدها مع غنّة حركتين.'},
  u:{name:'إدغام بلا غنّة', desc:'نون ساكنة أو تنوين بعدها لام أو راء: بتدخل النون بالحرف اللي بعدها كاملة بلا غنّة.'},
  i:{name:'إقلاب', desc:'نون ساكنة أو تنوين بعدها باء: بتنقلب النون ميم مخفاة مع غنّة حركتين.'},
  f:{name:'إخفاء', desc:'نون ساكنة أو تنوين بعدها حرف من حروف الإخفاء الـ15: بتنلفظ النون بين الإظهار والإدغام مع غنّة حركتين.'},
  c:{name:'إخفاء شفوي', desc:'ميم ساكنة بعدها باء: بتنخفى الميم عند الباء مع غنّة.'},

const audioMaps = {};
async function audioSrc(a, rec){
  rec = rec || S.settings.reciter; const key=`hifz.aud.${rec}.${a.s}`;
  if(!audioMaps[key]){
    let m = lsGet(key);
    if(!m){
      try{ const r = await fetchTimeout(`data/aud-${rec}-${a.s}.json`, 10000); if(r.ok){ m = await r.json(); lsSet(key, m); } }catch(e){ m = null; }
    }
    if(!m){
      try{
        const j = await fetchJSON(`${API}/surah/${a.s}/${rec}`);
        m = {}; for(const x of j.data.ayahs){ m[x.number] = x.audio || (x.audioSecondary && x.audioSecondary[0]); }
        lsSet(key, m);
      }catch(e){ m = null; }
    }
    audioMaps[key] = m || {};
  }
  return audioMaps[key][a.g] || `https://cdn.islamic.network/quran/audio/128/${rec}/${a.g}.mp3`;
}
const blobUrls = new Map();
async function getAudio(a){
  const url = await audioSrc(a);
  if(blobUrls.has(url)) return blobUrls.get(url);
  try{
    if(!('caches' in window)) throw 0;
    const c = await caches.open('hifz-audio-v1');
    let resp = await c.match(url);
    if(!resp){ resp = await fetch(url, {mode:'cors'}); if(!resp.ok) throw 0; try{ await c.put(url, resp.clone()); }catch(e){} }
    const bu = URL.createObjectURL(await resp.blob());
    blobUrls.set(url, bu); return bu;
  }catch(e){ return url; }
}
function stopAudio(){ player.token++; try{ player.el.pause(); }catch(e){} document.querySelectorAll('.ayah.playing').forEach(x=>x.classList.remove('playing')); }
function playUrl(url, tok){
  return new Promise((res, rej) => {
    const el = player.el; let last = -1, still = 0, done = false;
    const fin = (ok, err) => { if(done) return; done = true; clearInterval(wd); el.onended = el.onerror = null; ok ? res() : rej(err || new Error('audio')); };
    // حارس: إذا الصوت علِق أو ما طلع حدث النهاية، منكمّل لحالنا
    const wd = setInterval(() => {
      if(tok !== player.token) return fin(true);
      if(el.paused) return;
      const t = el.currentTime;
      if(el.duration && isFinite(el.duration) && t >= el.duration - 0.15){ if(++still >= 2) fin(true); return; }
      if(t === last){ if(++still >= 8) fin(false, new Error('stall')); } else { still = 0; last = t; }
    }, 1500);
    el.onended = () => fin(true);
    el.onerror = () => fin(false);
    el.src = url; el.defaultPlaybackRate = S.settings.speed; el.playbackRate = S.settings.speed;
    const pr = el.play(); if(pr) pr.catch(err => { if(err && err.name === 'AbortError') return; fin(false, err); });
  });
}
async function playOne(a, tok){
  const url = await getAudio(a);
  if(tok !== player.token) return;
  try{ await playUrl(url, tok); }
  catch(e){
    if(tok !== player.token) return;
    const remote = await audioSrc(a);
    if(remote !== url){ try{ await playUrl(remote, tok); return; }catch(e2){ if(tok !== player.token) return; } }
    if(remote.includes('/128/')){ await playUrl(remote.replace('/128/','/64/'), tok); return; }
    throw e;
  }
}
async function playSeq(items, reps, onAyah, onDone){
  stopAudio(); const tok = player.token; let fails = 0;
  for(let k=0;k<items.length;k++){
    if(items[k+1]) getAudio(items[k+1]).catch(()=>{});
    for(let r=0;r<reps;r++){
      if(tok!==player.token) return;
      if(onAyah) onAyah(items[k], k, r);
      try{ await playOne(items[k], tok); fails = 0; }
      catch(e){
        if(tok!==player.token) return;
        if(++fails >= 2){ stopAudio(); toast('الصوت ما عم يشتغل. تأكّدي من النت وجرّبي كمان مرة'); if(onDone) onDone(false); return; }
        break; // منتخطّى هالآية ومنكمّل
      }
    }
  }
  if(tok===player.token){ document.querySelectorAll('.ayah.playing').forEach(x=>x.classList.remove('playing')); if(onDone) onDone(true); }
}

let actx = null, lastErrT = 0;
function beep(notes){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.01;
    for(const n of notes){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = n.type || 'sine'; o.frequency.setValueAtTime(n.f, t0 + n.at);
      g.gain.setValueAtTime(0.0001, t0 + n.at);
      g.gain.exponentialRampToValueAtTime(n.g || 0.2, t0 + n.at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.at + n.d);
      o.connect(g); g.connect(actx.destination); o.start(t0 + n.at); o.stop(t0 + n.at + n.d + 0.05);
    }
  }catch(e){}
}

/* ============ التعرّف على التلاوة ============ */
const Speech = {
  native(){ return IS_APP && window.CapX && window.CapX.SpeechRecognition; },
  webCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition; },
  supported(){ return !!(this.native() || (!IS_APP && this.webCtor())); },
  active:false, committed:'', cur:'', onText:null, onState:null, _r:null, _wd:null, _fails:0, _ls:[], _restarting:false,
  emit(){ if(this.onText) this.onText((this.committed + ' ' + this.cur).trim()); },
  commit(){ if(this.cur){ this.committed = (this.committed + ' ' + this.cur).trim(); this.cur = ''; } },
  async start(onText, onState){
    this.stop(true);
    this.onText = onText; this.onState = onState; this.committed = ''; this.cur = ''; this._fails = 0;
    const SR = this.native();
    if(SR){
      const perm = await SR.checkPermissions().catch(() => ({}));
      if(!perm || perm.speechRecognition !== 'granted'){
        const r = await SR.requestPermissions();
        if(!r || r.speechRecognition !== 'granted') throw new Error('perm');
      }
      const av = await SR.available().catch(() => ({available:false}));
      if(!av.available) throw new Error('unavailable');
      this.active = true;
      this._ls.push(await SR.addListener('partialResults', d => {
        if(!this.active) return; const m = d && d.matches && d.matches[0];
        if(m != null){ this.cur = m; this._fails = 0; this.emit(); }
      }));
      try{ this._ls.push(await SR.addListener('listeningState', s => { if(s && s.status === 'stopped') this._restart(); })); }catch(e){}
      this._wd = setInterval(async () => {
        if(!this.active || this._restarting) return;
        try{ const l = await SR.isListening(); if(l && l.listening === false) this._restart(); }catch(e){}
      }, 1500);
      this._go();
    } else {
      const R = this.webCtor(); if(!R) throw new Error('unsupported');
      const r = new R(); r.lang = 'ar-SA'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
      r.onresult = e => { let t = ''; for(let i=0;i<e.results.length;i++) t += ' ' + e.results[i][0].transcript; this.cur = t.trim(); this.emit(); };
      r.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){ this.active = false; if(this.onState) this.onState('denied'); } };
      r.onend = () => {
        this.commit();
        if(this.active){ setTimeout(() => { try{ if(this.active) r.start(); }catch(_){} }, 150); }
      };
      this.active = true; this._r = r; r.start();
    }
    if(this.onState) this.onState('listening');
  },
  _restart(){
    if(!this.active || this._restarting) return;
    this._restarting = true; this.commit();
    setTimeout(() => { this._restarting = false; if(this.active) this._go(); }, 250);
  },
  _go(){
    const SR = this.native(); if(!SR || !this.active) return;
    SR.start({language:'ar-SA', maxResults:1, partialResults:true, popup:false})
      .then(res => { if(this.active && res && res.matches && res.matches[0]){ this.cur = res.matches[0]; this.emit(); } })
      .catch(() => { if(!this.active) return; if(++this._fails > 10){ this.stop(); if(this.onState) this.onState('error'); } });
  },
  stop(silent){
    const was = this.active; this.active = false;
    clearInterval(this._wd); this._wd = null;
    const SR = this.native();
    if(SR){ try{ SR.stop(); }catch(e){} this._ls.forEach(l => { try{ l.remove(); }catch(e){} }); this._ls = []; }
    if(this._r){ try{ this._r.onend = null; this._r.stop(); }catch(e){} this._r = null; }
    this.commit();
    if(was && !silent && this.onState) this.onState('stopped');
  }
};

/* ============ مقارنة التلاوة بالنص ============ */
const AR_MARKS = /[ؐ-ًؚ-ٟۖ-ۭـ࣓-ࣿ]/g;
function normW(w){
  return String(w).replace(/ىٰ/g,'ى').replace(/ٰ/g,'ا').replace(AR_MARKS,'')
    .replace(/[ٱأإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/[^ء-ي]/g,'').replace(/ا+/g,'ا');
}
function normTranscript(t){
  let s = ' ' + String(t).split(/\s+/).map(normW).filter(Boolean).join(' ') + ' ';
  s = s.replace(/ الف لام ميم /g, ' الم ').replace(/ الف لام را /g, ' الر ');
  return s.trim() ? s.trim().split(' ') : [];
}
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_, j) => j);
  for(let i=1;i<=m;i++){
    const cur = [i];
    for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    prev = cur;
  }
  return prev[n];
}
// ٢ = صح، ١ = غلط بحرف، ٠ = كلمة غلط
function cmpW(e, h){
  if(!e || !h) return 0;
  if(e === h) return 2;
  const ea = e.replace(/ا/g,''), ha = h.replace(/ا/g,'');
  if(ea === ha) return 2;
  const ev = e.replace(/[اوي]/g,''), hv = h.replace(/[اوي]/g,'');
  if(ev && ev === hv) return 2;
  const L = Math.max(ea.length, ha.length, 1);
  return (1 - lev(ea, ha) / L) >= 0.5 ? 1 : 0;
}
function alignWords(E, H, freeEnd){
  const n = E.length, m = H.length, D = [], B = [], COST = [1.3, 0.5, 0];
  for(let i=0;i<=n;i++){ D.push(new Float64Array(m+1)); B.push(new Int8Array(m+1)); }
  for(let j=1;j<=m;j++){ D[0][j] = j*0.7; B[0][j] = 3; }
  for(let i=1;i<=n;i++){ D[i][0] = i; B[i][0] = 2; }
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    let best = D[i-1][j-1] + COST[cmpW(E[i-1], H[j-1])], b = 1, v;
    v = D[i-1][j] + 1;   if(v < best){ best = v; b = 2; }
    v = D[i][j-1] + 0.7; if(v < best){ best = v; b = 3; }
    if(j >= 2 && cmpW(E[i-1], H[j-2] + H[j-1]) === 2){ v = D[i-1][j-2] + 0.05; if(v < best){ best = v; b = 4; } }
    if(i >= 2 && cmpW(E[i-2] + E[i-1], H[j-1]) === 2){ v = D[i-2][j-1] + 0.05; if(v < best){ best = v; b = 5; } }
    D[i][j] = best; B[i][j] = b;
  }
  let ei = n;
  if(freeEnd){ ei = 0; let bv = D[0][m]; for(let i=1;i<=n;i++) if(D[i][m] <= bv + 1e-9){ bv = D[i][m]; ei = i; } }
  const st = new Array(n).fill(null), hj = new Array(n).fill(-1);
  let i = ei, j = m;
  while(i > 0 || j > 0){
    const b = (i>0 && j>0) ? B[i][j] : (i>0 ? 2 : 3);
    if(b === 1){ const c = cmpW(E[i-1], H[j-1]); st[i-1] = c===2?'ok':(c===1?'letter':'wrong'); hj[i-1] = j-1; i--; j--; }
    else if(b === 2){ st[i-1] = 'miss'; i--; }
    else if(b === 3){ j--; }
    else if(b === 4){ st[i-1] = 'ok'; hj[i-1] = j-1; i--; j -= 2; }
    else { st[i-1] = 'ok'; st[i-2] = 'ok'; hj[i-1] = j-1; hj[i-2] = j-1; i -= 2; j--; }
  }
  return {st, hj, end:ei};
}
// مدّة تلاوة الحصري (مرتّل) للآية، لتنبيه السرعة
const refDur = lsGet('hifz.refdur') || {};
function refDuration(a){
  if(refDur[a.g]) return Promise.resolve(refDur[a.g]);
  return audioSrc(a, 'ar.husary').then(url => new Promise(res => {
    const el = new Audio(); el.preload = 'metadata';
    const t = setTimeout(() => res(null), 8000);
    el.onloadedmetadata = () => {
      clearTimeout(t); const d = el.duration;
      if(d && isFinite(d)){ refDur[a.g] = Math.round(d*10)/10; lsSet('hifz.refdur', refDur); res(refDur[a.g]); } else res(null);
      el.removeAttribute('src');
    };
    el.onerror = () => { clearTimeout(t); res(null); };
    el.src = url;
  })).catch(() => null);
}

/* ============ التسجيل ============ */
const recState = { rec:null, url:null };
async function startRecording(onChange){
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('التسجيل مش مدعوم على هالمتصفّح'); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[]; const r = new MediaRecorder(stream);
    r.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    r.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      if(recState.url) URL.revokeObjectURL(recState.url);
      recState.url = URL.createObjectURL(new Blob(chunks, {type:r.mimeType||'audio/mp4'}));
      recState.rec=null; onChange();
    };
    stopAudio(); r.start(); recState.rec=r; onChange();
  }catch(e){ toast('لازم تسمحي للتطبيق يستعمل المايك'); }
}
function stopRecording(){ if(recState.rec) recState.rec.stop(); }

/* ============ المنطق ============ */
function isUnlocked(p){
  if(S.settings.free) return true;
  const i = DB.pageNos.indexOf(p); if(i<=0) return true;
  const st = pg(p).status; if(st!=='new') return true;
  return pg(DB.pageNos[i-1]).status==='done';
}
function nextPage(){ return DB.pageNos.find(p => pg(p).status!=='done' && isUnlocked(p)); }
function duePages(){ const t=todayStr(); return DB.pageNos.filter(p => pg(p).status==='done' && pg(p).due && pg(p).due<=t).sort((a,b)=>pg(a).due<pg(b).due?-1:1); }
function donePages(){ return DB.pageNos.filter(p => pg(p).status==='done'); }
function applyResult(p, ratio, isReview){
  const st = pg(p); st.last = {date:todayStr(), score:Math.round(ratio*100)};
  if(isReview || st.status==='done'){
    st.reviews=(st.reviews||0)+1;
    if(ratio>=0.9) st.interval = Math.min(60, Math.max(2, Math.round((st.interval||1)*2.5)));
    else if(ratio>=0.7) st.interval = Math.min(60, Math.max(1, Math.round((st.interval||1)*1.5)));
    else st.interval = 1;
    st.due = addDays(st.interval);
  } else if(ratio>=0.8){
    st.status='done'; st.interval=1; st.due=addDays(1); st.doneAt=todayStr();
  } else { st.status='learning'; }
  markActive();
}

function paneTest(pane, p){
  if(!pageCtx.manual && Speech.supported()) paneRecite(pane, p);
  else paneTestManual(pane, p);
}

/* ---------- التسميع بالمايك ---------- */
function rcInit(p){
  return { p, idx:0, offset:0, tokens:[], last:'', ayat: DB.pages.get(p).map(a => {
    const w = splitWords(a.t);
    return { w, E:w.map(normW), st:[], hj:[], m:0, fired:new Set(), hints:new Set(), done:false, t0:0, dur:0, fast:false };
  }) };
}
function rcScore(R){
  let tot=0, pts=0; const weak=[]; const list = DB.pages.get(R.p);
  R.ayat.forEach((A,i) => {
    let ap=0;
    A.w.forEach((_,k) => { const s=A.st[k]; let v = s==='ok'?1:(s==='letter'?0.5:0); if(A.hints.has(k)) v=Math.min(v,0.5); ap+=v; });
    tot+=A.w.length; pts+=ap;
    if(ap < A.w.length) weak.push(list[i].n);
  });
  return { ratio: tot ? pts/tot : 0, weak };
}
function rcUpdate(R, full, settled){
  R.last = full;
  const tokens = normTranscript(full); R.tokens = tokens;
  const list = DB.pages.get(R.p); const now = Date.now(); let changed = false;
  while(R.idx < list.length){
    const A = R.ayat[R.idx];
    if(R.offset > tokens.length) R.offset = tokens.length;
    const H = tokens.slice(R.offset); const m = H.length;
    if(!m) break;
    if(!A.t0) A.t0 = now;
    const res = alignWords(A.E, H, true);
    A.st = res.st; A.hj = res.hj; A.m = m; changed = true;
    let lastI = -1; res.hj.forEach((j,k) => { if(j >= 0) lastI = k; });
    for(let k=0;k<=lastI;k++){
      const s = res.st[k]; if(!s || s==='ok' || A.fired.has(k) || A.hints.has(k)) continue;
      const stable = settled || s==='miss' || res.hj[k] < m-1;
      if(stable){ A.fired.add(k); errFeedback(); }
    }
    const n = A.E.length;
    const complete = res.hj[n-1] >= 0 && (res.st[n-1]==='ok' || settled || res.hj[n-1] < m-1);
    if(!complete) break;
    const used = res.hj[n-1] + 1;
    const fin = alignWords(A.E, H.slice(0, used), false);
    A.st = fin.st; A.hj = fin.hj; A.done = true; A.dur = now - A.t0;
    let newErr = false;
    fin.st.forEach((s,k) => { if(s!=='ok' && !A.fired.has(k) && !A.hints.has(k)){ A.fired.add(k); newErr = true; } });
    if(newErr) errFeedback();
    rcSpeedCheck(R, R.idx);
    R.offset += used; R.idx++;
  }
  return changed;
}
function rcSpeedCheck(R, i){
  if(!S.settings.tjAlert) return;
  const A = R.ayat[i], a = DB.pages.get(R.p)[i];
  if(A.E.length < 5 || !A.dur) return;
  refDuration(a).then(ref => {
    if(!ref || R !== pageCtx.rc) return;
    if(A.dur/1000 < ref*0.45){ A.fast = true; tjFeedback(); if(R.render) R.render(); }
  });
}
function paneRecite(pane, p){
  const list = DB.pages.get(p); const C = pageCtx;
  if(!C.rc || C.rc.p !== p) C.rc = rcInit(p);
  const R = C.rc; const isRev = C.review || pg(p).status==='done';
  pane.innerHTML = `
    <div class="card">
      <div class="tip">${isRev?'مراجعة: ':''}كبسي عالمايك وسمّعي من حفظك، آية ورا آية. الكلمات بتبيّن لحالها وانتي عم تقري.</div>
      <div class="legend small">
        <button class="lg" id="lgErr"><span class="dot" style="background:var(--bad)"></span><span><b>«طنّة» + اهتزاز</b> = غلط بكلمة أو بحرف. كبسي لتسمعيها</span></button>
        <button class="lg" id="lgTj"><span class="dot" style="background:var(--gold)"></span><span><b>جرس 🔔</b> = قريتي بسرعة كتير، انتبهي للمدّ والغنّة</span></button>
      </div>
    </div>
    <div class="card q" id="rcList"></div>
    <div class="sticky-play"><div class="rcbar">
      <button class="btn ghost sq" id="rcHint" aria-label="ورجيني كلمة">💡</button>
      <button class="btn mic" id="rcMic" style="flex:1"></button>
      <button class="btn ghost sq" id="rcSkip" aria-label="تخطّي الآية">⏭</button>
    </div></div>
    <p class="small muted center" style="margin-top:6px">💡 كلمة · ⏭ تخطّي الآية · <button class="linkbtn" id="rcRedo">🔄 أعيدي الآية</button> · <button class="linkbtn" id="rcManual">بلا مايك</button></p>`;
  const box = $('#rcList', pane), mic = $('#rcMic', pane);
  let settleT = null;
  const wordHtml = (A, k, cur) => {
    const w = A.w[k], s = A.st[k], hint = A.hints.has(k);
    const stable = A.done || (s && (s==='ok' || s==='miss' || A.fired.has(k) || A.hj[k] < A.m-1));
    if(s && stable){
      const cls = (s==='ok') ? (hint?'wh':'') : (s==='letter' ? 'wl' : 'we');
      return `<span class="w ${cls}">${esc(w)}</span>`;
    }
    if(hint) return `<span class="w wh">${esc(w)}</span>`;
    return cur ? hidPill(w, k) : '';
  };
  const render = () => {
    let html = '';
    const upto = Math.min(R.idx, list.length-1);
    for(let i=0;i<=upto;i++){
      const a = list[i], A = R.ayat[i], cur = (i===R.idx);
      html += basmalaIfNeeded(a) + `<div class="rca ${cur?'cur':''}" data-i="${i}">` + A.w.map((_,k)=>wordHtml(A,k,cur)).join(' ') + endMark(a.n) + (A.fast?' <span class="fast">🔔 سريعة</span>':'') + `</div>`;
    }
    if(R.idx < list.length){
      const left = list.length - R.idx - 1;
      if(left > 0) html += `<div class="small muted center" style="font-family:inherit;margin-top:8px">باقي ${toAr(left)} ${left===1?'آية':'آيات'} بعد هيدي</div>`;
    } else {
      const sc = rcScore(R);
      html += `<div class="center" style="font-family:inherit;margin-top:12px"><b>خلّصتي الصفحة ✨ ${toAr(Math.round(sc.ratio*100))}٪</b></div>`;
    }
    box.innerHTML = html;
    box.querySelectorAll('.rca.cur .hid').forEach(h => h.onclick = () => { R.ayat[R.idx].hints.add(+h.dataset.i); render(); });
    const curEl = box.querySelector('.rca.cur'); if(curEl && Speech.active) curEl.scrollIntoView({block:'center', behavior:'smooth'});
    setMic();
  };
  R.render = render;
  const setMic = () => {
    if(R.idx >= list.length){ mic.className='btn gold mic'; mic.textContent='شوفي النتيجة ✨'; return; }
    if(Speech.active){ mic.className='btn mic on'; mic.innerHTML='<span class="recdot" style="background:#fff"></span> عم سمعك… كبسي لتوقّفي'; }
    else { mic.className='btn mic'; mic.textContent = (R.idx>0 || R.ayat[0].st.length) ? '🎙️ كمّلي التسميع' : '🎙️ ابدئي التسميع'; }
  };
  const onText = (full) => {
    if(pageCtx.rc !== R) return;
    clearTimeout(settleT);
    if(rcUpdate(R, full, false)) render();
    settleT = setTimeout(() => { if(pageCtx.rc===R && Speech.active && rcUpdate(R, R.last, true)) render(); }, 1600);
    if(R.idx >= list.length){ Speech.stop(true); render(); }
  };
  const onState = (s) => {
    if(s==='denied') toast('لازم تسمحي للتطبيق يستعمل المايك');
    if(s==='error') toast('وقف المايك. كبسي ليرجع يسمعك');
    setMic();
  };
  mic.onclick = async () => {
    if(R.idx >= list.length){ const sc = rcScore(R); finishTest(p, sc.ratio, sc.weak, isRev); return; }
    if(Speech.active){ Speech.stop(); clearTimeout(settleT); if(rcUpdate(R, R.last, true)) render(); setMic(); return; }
    stopAudio(); beep([]);
    R.offset = 0; R.tokens = []; R.last = '';
    const A = R.ayat[R.idx]; if(!A.done){ A.st=[]; A.hj=[]; A.m=0; A.t0=0; }
    try{ await Speech.start(onText, onState); }
    catch(e){ toast(e && e.message==='perm' ? 'لازم تسمحي للتطبيق يستعمل المايك' : 'التعرّف عالصوت مش متوفّر عهالموبايل. جرّبي «بلا مايك»'); }
    setMic();
  };
  $('#rcHint', pane).onclick = () => {
    if(R.idx >= list.length) return;
    const A = R.ayat[R.idx]; const k = A.w.findIndex((_,i) => !(A.st[i]==='ok' && A.hj[i] < A.m-1) && !A.hints.has(i));
    if(k >= 0){ A.hints.add(k); render(); }
  };
  $('#rcSkip', pane).onclick = () => {
    if(R.idx >= list.length) return;
    const A = R.ayat[R.idx];
    A.w.forEach((_,k) => { if(!(A.st[k] && A.hj[k] >= 0)) A.st[k] = 'miss'; });
    A.done = true; R.idx++; R.offset = R.tokens.length; render();
  };
  $('#rcRedo', pane).onclick = () => {
    if(R.idx >= list.length) return;
    const A = R.ayat[R.idx];
    Object.assign(A, { st:[], hj:[], m:0, fired:new Set(), hints:new Set(), done:false, t0:0, dur:0, fast:false });
    R.offset = R.tokens.length; render();
  };
  $('#lgErr', pane).onclick = () => { lastErrT = 0; errFeedback(); };
  $('#lgTj', pane).onclick = () => tjFeedback();
  $('#rcManual', pane).onclick = () => { Speech.stop(true); pageCtx.manual = true; paneTestManual(pane, p); };
  render();
  list.reduce((pr, a) => pr.then(() => refDuration(a)), Promise.resolve());
}

/* ---------- التسميع اليدوي ---------- */
function paneTestManual(pane, p){
  const list = DB.pages.get(p); const C = pageCtx; const T = C.test;
  list.forEach((a,i)=>{ if(!T[i]) T[i]={shown:1, grade:null}; });
  const words = list.map(a=>splitWords(a.t));
  const graded = list.filter((a,i)=>T[i].grade!==null).length;
  const isRev = C.review || pg(p).status==='done';
  const ayahBlock = (a,i) => {
    const w = words[i]; const t=T[i]; const full = t.shown>=w.length;
    const txt = full ? ayahHtml(a) : w.map((x,k)=> k<t.shown ? `<span class="w">${esc(x)}</span>` : hidPill(x,k)).join(' ')+endMark(a.n);
    return `<div class="tcard" data-i="${i}">${basmalaIfNeeded(a)}<div class="num">الآية ${toAr(a.n)} · ${esc(surahName(a.s))}</div><div class="q">${txt}</div>
      <div class="tools">${full?'':`<button data-a="word">كلمة كمان</button><button data-a="all">اكشفي الآية</button>`}<button data-a="hear">🔊 اسمعي</button></div>
      <div class="gradebar">${[[2,'✓ صح'],[1,'〜 تعثّرت'],[0,'✗ نسيت']].map(([g,l])=>`<button class="g${g} ${t.grade===g?'on':''}" data-g="${g}">${l}</button>`).join('')}</div></div>`;
  };
  const recHtml = () => recState.rec
    ? `<button class="btn danger block" id="recBtn"><span class="recdot"></span> وقّفي التسجيل</button>`
    : `<button class="btn soft block" id="recBtn">⏺ سجّلي صوتك</button>${recState.url?`<audio controls src="${recState.url}"></audio><button class="btn ghost block" id="cmp" style="margin-top:8px">🎧 اسمعي القارئ للمقارنة</button>`:''}`;
  pane.innerHTML = `
    <div class="card">
      <div class="tip" style="margin-bottom:12px">${isRev?'مراجعة: ':''}سمّعي كل آية من حفظك. اكشفي كلمة كلمة إذا علّقتي، وبعدها قيّمي حالك بصدق.</div>
      <div id="recBox">${recHtml()}</div>
      ${Speech.supported()?'<button class="linkbtn" id="toMic">🎙️ رجعي للتسميع بالمايك</button>':''}
    </div>
    <div class="card" id="tlist">${list.map(ayahBlock).join('')}</div>
    <div class="sticky-play"><button class="btn block ${graded===list.length?'gold':''}" id="finish" ${graded===list.length?'':'disabled'}>${graded===list.length?'شوفي النتيجة ✨':`قيّمتي ${toAr(graded)} من ${toAr(list.length)}`}</button></div>`;
  const bindRec = () => {
    $('#recBtn',pane).onclick = () => recState.rec ? stopRecording() : startRecording(()=>{ $('#recBox',pane).innerHTML=recHtml(); bindRec(); });
    const cmp=$('#cmp',pane); if(cmp) cmp.onclick = () => playSeq(list, 1);
  };
  bindRec();
  if($('#toMic',pane)) $('#toMic',pane).onclick = () => { pageCtx.manual = false; paneRecite(pane, p); };
  const redraw = () => { const y=window.scrollY; paneTestManual(pane,p); window.scrollTo({top:y}); };
  pane.querySelectorAll('.tcard').forEach(card => {
    const i=+card.dataset.i; const t=T[i];
    card.querySelectorAll('.hid').forEach(h => h.onclick = () => { t.shown = Math.max(t.shown, +h.dataset.i+1); redraw(); });
    card.querySelectorAll('.tools button').forEach(b => b.onclick = () => {
      const act=b.dataset.a;
      if(act==='word'){ t.shown++; redraw(); }
      else if(act==='all'){ t.shown=words[i].length; redraw(); }
      else playSeq([list[i]],1);
    });
    card.querySelectorAll('.gradebar button').forEach(b => b.onclick = () => { t.grade=+b.dataset.g; t.shown=words[i].length; redraw(); });
  });
  $('#finish',pane).onclick = () => {
    const pts = list.reduce((s,a,i)=>s+T[i].grade,0); const ratio = pts/(list.length*2);
    finishTest(p, ratio, list.filter((a,i)=>T[i].grade<2).map(a=>a.n), isRev);
  };
}

/* ============ التجويد ============ */
function collectMatches(ayat){
  const out=[];
  for(const a of ayat){ if(!a.tj) continue; let m, re=new RegExp(TJ_RE.source,'g'), k=0;
    while((m=re.exec(a.tj))){ if(QUIZ_CODES.includes(m[1]) && m[2].replace(MARKS_RE,'').length>0) out.push({a, code:m[1], k}); k++; } }
  return out;
}
function highlightHtml(raw, targetK){
  let k=0; return esc(raw).replace(TJ_RE, (m,c,seg)=> (k++===targetK) ? `<mark class="tgt">${seg}</mark>` : seg).replace(/[\[\]]/g,'');
}
function buildQuiz(ayat, n){
  const all = shuffle(collectMatches(ayat)); const used=new Set(); const qs=[];
  for(const m of all){ if(qs.length>=n) break; if(!used.has(m.code)){ used.add(m.code); qs.push(m); } }
  for(const m of all){ if(qs.length>=n) break; if(!qs.includes(m)) qs.push(m); }
  return shuffle(qs).map(m => {
    const grp = RULE_GROUPS.find(g=>g.codes.includes(m.code)).codes.filter(c=>c!==m.code && QUIZ_CODES.includes(c));
    const others = shuffle(QUIZ_CODES.filter(c=>c!==m.code && !grp.includes(c)));
    const opts = shuffle([m.code, ...shuffle(grp).slice(0,1), ...others].filter((v,i,arr)=>arr.indexOf(v)===i).slice(0,4));
    return {...m, opts, answered:null};
  });
}
function runQuiz(box, ayat, n, onFinish){
  const qs = buildQuiz(ayat, n);
  if(!qs.length){ box.innerHTML = `<p class="muted">ما في أحكام كفاية بهالآيات للاختبار.</p>`; return; }
  let i=0, right=0;
  const show = () => {
    if(i>=qs.length){ S.tj.right+=right; S.tj.total+=qs.length; markActive(); onFinish(right, qs.length); return; }
    const q=qs[i];
    box.innerHTML = `<div class="row between small muted"><span>سؤال ${toAr(i+1)} من ${toAr(qs.length)}</span><span>${esc(surahName(q.a.s))} ${toAr(q.a.n)}</span></div>
      <div class="q" style="margin:8px 0">${highlightHtml(q.a.tj, q.k)}${endMark(q.a.n)}</div>
      <b>شو حكم الحرف المعلَّم بالأحمر؟</b>
      <div id="opts">${q.opts.map(c=>`<button class="opt" data-c="${c}">${RULES[c].name}</button>`).join('')}</div><div id="fb"></div>`;
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if(q.answered) return; q.answered=b.dataset.c; const ok = q.answered===q.code; if(ok) right++;
      box.querySelectorAll('.opt').forEach(x => { if(x.dataset.c===q.code) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); });
      $('#fb',box).innerHTML = `<div class="tip" style="margin-top:12px">${ok?'✓ صح! ':'✗ الجواب: <b>'+RULES[q.code].name+'</b>. '}${RULES[q.code].desc}</div><button class="btn block" style="margin-top:10px" id="nx">${i===qs.length-1?'النتيجة':'التالي ←'}</button>`;
      $('#nx',box).onclick = () => { i++; show(); };
    });
  };
  show();
}
function paneTj(pane, p){
  const list = DB.pages.get(p);
  const counts = {}; collectMatches(list).forEach(m=>counts[m.code]=(counts[m.code]||0)+1);
  const present = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  pane.innerHTML = `
    <div class="card">
      <h2>الأحكام اللي بهالصفحة</h2>
      ${S.settings.tajweed?'':'<p class="small muted">تلوين التجويد مسكّر من الإعدادات.</p>'}
      ${present.length ? present.map(c=>`<div class="rule"><span class="dot" style="background:var(--t-${c})"></span><div><b>${RULES[c].name}</b> <span class="small muted">(${toAr(counts[c])} مرّة)</span><div class="small muted">${RULES[c].desc}</div></div></div>`).join('') : '<p class="muted">ما قدرنا نقرا علامات التجويد لهالصفحة.</p>'}
    </div>
    <div class="card" id="qz"><h2>اختبري حالك</h2><p class="small muted">٥ أسئلة من آيات هالصفحة.</p><button class="btn block" id="startQ">ابدئي ✏️</button></div>`;
  $('#startQ',pane).onclick = () => runQuiz($('#qz',pane), list, 5, (r,t) => {
    const st=pg(p); if(r/t>=0.6){ st.steps.tj=true; save(); }
    $('#qz',pane).innerHTML = `<div class="center"><div class="big" style="font-size:44px">${r===t?'🌟':r/t>=0.6?'👏':'📚'}</div><h2>${toAr(r)} من ${toAr(t)}</h2><p class="muted">${r/t>=0.6?'شاطرة!':'راجعي شرح الأحكام فوق وجرّبي كمان مرة.'}</p><button class="btn soft block" id="again">اختبار جديد</button></div>`;
    $('#again',pane).onclick = () => paneTj(pane,p);
  });
}
function exampleFor(code){
  for(const a of DB.ayat){ if(!a.tj) continue; let m, re=new RegExp(TJ_RE.source,'g');
    while((m=re.exec(a.tj))){ if(m[1]===code && m[2].replace(MARKS_RE,'').length){ const st=a.tj.lastIndexOf(' ', m.index)+1; let en=a.tj.indexOf(' ', m.index+m[0].length); if(en<0) en=a.tj.length; return {html:tjHtml(a.tj.slice(st,en)), a}; } } }
  return null;
}
function viewTajweed(){
  setTitle('أحكام التجويد'); setNav('tajweed');
  const pool = donePages().length ? donePages().flatMap(p=>DB.pages.get(p)) : DB.pages.get(DB.pageNos[0]);
  const acc = S.tj.total ? Math.round(S.tj.right/S.tj.total*100) : null;
  let html = `<div class="card" id="qz"><h2>اختبار شامل</h2><p class="small muted">١٠ أسئلة ${donePages().length?'من الصفحات اللي حفظتيها':'من أول صفحة'}${acc!==null?` · دقّتك لهلّق ${toAr(acc)}٪`:''}</p><button class="btn block" id="startQ">ابدئي ✏️</button></div>`;
  for(const g of RULE_GROUPS){
    html += `<div class="card"><h2>${g.title}</h2>`;
    for(const c of g.codes){ const ex=exampleFor(c);
      html += `<div class="rule"><span class="dot" style="background:var(--t-${c})"></span><div style="flex:1"><b>${RULES[c].name}</b><div class="small muted">${RULES[c].desc}</div>${ex?`<div class="ex tj">${ex.html} <span class="small muted" style="font-family:inherit;font-size:12px">(${esc(surahName(ex.a.s))} ${toAr(ex.a.n)})</span></div>`:''}</div></div>`; }
    html += `</div>`;
  }
  html += `<p class="small muted center">التلوين مأخوذ من مصحف التجويد على alquran.cloud. الشرح مبسّط، وأحسن شي تثبّتي التلاوة مع معلّمة.</p>`;
  app.innerHTML = html;
  $('#startQ').onclick = () => runQuiz($('#qz'), pool, 10, (r,t) => {
    $('#qz').innerHTML = `<div class="center"><h2>${toAr(r)} من ${toAr(t)}</h2><button class="btn soft block" id="again">اختبار جديد</button></div>`;
    $('#again').onclick = viewTajweed;
  });
}

const QURAN = [

// دولاب: لائحة بتلفّ وبتوقف عالعنصر اللي بالنص
function makeWheel(el, items, sel, onChange){
  const H = 44;
  el.innerHTML = '<div class="pad"></div>' + items.map((t,i)=>`<div class="it" data-i="${i}">${t}</div>`).join('') + '<div class="pad"></div>';
  let cur = Math.max(0, Math.min(items.length-1, sel)), t = null;
  const mark = () => { const o = el.querySelector('.it.sel'); if(o) o.classList.remove('sel'); const it = el.children[cur+1]; if(it) it.classList.add('sel'); };
  el.scrollTop = cur * H; mark();
  el.onscroll = () => {
    const i = Math.max(0, Math.min(items.length-1, Math.round(el.scrollTop / H)));
    if(i !== cur){ cur = i; mark(); }
    clearTimeout(t); t = setTimeout(() => onChange(cur), 140);
  };
  el.onclick = e => { const it = e.target.closest('.it'); if(it) el.scrollTo({top: +it.dataset.i * H, behavior:'smooth'}); };
  return { get: () => cur };
}

async function getSurahAyat(s){
  if(s===2 || s===3) return DB.ayat.filter(x => x.s===s);
  return loadSurah({n:s, name:qName(s), count:qCount(s)});
}

let readTok = 0;
async function viewRead(s, a){
  if(!(s>=1 && s<=114)){ location.hash = '#index'; return; }
  a = Math.max(1, Math.min(qCount(s), a||1));
  setTitle(`سورة ${qName(s)}`, true); setNav('index');
  const tok = ++readTok;
  app.innerHTML = '<div class="loading"><div><div class="spin"></div><div>عم نجيب السورة…</div></div></div>';
  let list;
  try{ list = await getSurahAyat(s); }
  catch(e){
    if(tok !== readTok) return;
    app.innerHTML = `<div class="loading"><div><div style="font-size:44px">📶</div><h2>ما قدرنا نجيب السورة</h2><p class="muted">هالسورة بدها نت أوّل مرة. بعدها بتنحفظ عالموبايل.</p><button class="btn" id="retry">جرّبي كمان مرة</button></div></div>`;
    $('#retry').onclick = () => viewRead(s, a); return;
  }
  if(tok !== readTok) return;
  S.lastRead = {s, a}; save();
  let from = a - 1, playing = false;
  app.innerHTML = `
    <div class="card">
      <div class="row" style="gap:8px">
        <select id="rcR" class="sel" style="flex:1">${reciterOptions()}</select>
        <button class="btn ghost" id="toIdx" style="flex:none">📑 الفهرس</button>
      </div>
      <div class="small muted" style="margin-top:10px">كم مرة تتكرّر كل آية؟</div>
      <div class="chips" id="repsR">${[1,3,5,7,10].map(n=>`<button class="chip ${n===S.settings.reps?'on':''}" data-n="${n}">${toAr(n)}×</button>`).join('')}</div>
    </div>
    <div class="card q ayah-list" id="rlist">${list.map((x,i)=>`${basmalaIfNeeded(x)}<span class="ayah" data-i="${i}">${ayahHtml(x)}</span>`).join('')}</div>
    <div class="sticky-play"><button class="btn block" id="playR"></button></div>
    <p class="small muted center">كبسي على أي آية لتبلّشي منها</p>`;
  bindReciter($('#rcR'));
  $('#toIdx').onclick = () => { location.hash = '#index'; };
  app.querySelectorAll('#repsR .chip').forEach(c => c.onclick = () => { S.settings.reps = +c.dataset.n; save(); app.querySelectorAll('#repsR .chip').forEach(x=>x.classList.toggle('on', x===c)); });
  const btn = $('#playR');
  const hl = (i, scroll) => { app.querySelectorAll('#rlist .ayah').forEach(x => x.classList.toggle('playing', +x.dataset.i===i)); const el = app.querySelector(`#rlist .ayah[data-i="${i}"]`); if(el && scroll) el.scrollIntoView({block:'center', behavior:'smooth'}); };
  const setBtn = () => { btn.textContent = playing ? '⏹️ وقّفي' : `▶️ شغّلي من الآية ${toAr(from+1)}`; };
  const start = (i) => {
    from = i; playing = true; setBtn();
    playSeq(list.slice(i), S.settings.reps, (x,k) => { hl(i+k, true); S.lastRead = {s, a:i+k+1}; save(); }, () => { playing = false; setBtn(); });
  };
  btn.onclick = () => { if(playing){ stopAudio(); playing = false; setBtn(); return; } start(from); };
  app.querySelectorAll('#rlist .ayah').forEach(el => el.onclick = () => start(+el.dataset.i));
  setBtn();
  hl(from, false);
  const target = app.querySelector(`#rlist .ayah[data-i="${from}"]`);
  if(target && from > 0) setTimeout(() => target.scrollIntoView({block:'center'}), 50);
}

/* ============ التوجيه ============ */
function route(){
  stopAudio(); Speech.stop(true); if(recState.rec) stopRecording();
  const h = (location.hash||'#home').slice(1).split('/');
  const r = h[0];
  window.scrollTo({top:0});
  if(r==='page') viewPage(+h[1], h[2]||null, false);
  else if(r==='review' && h[1]) viewPage(+h[1], h[2]||'test', true);
  else if(r==='review') viewReview();
  else if(r==='map') viewMap();
  else if(r==='tajweed') viewTajweed();
  else if(r==='settings') viewSettings();
  else if(r==='index') viewIndex();
  else if(r==='read') viewRead(+h[1], +h[2]||1);
  else viewHome();
  updateChrome();
}
async function boot(){
  try{
    await loadData();
    $('#nav').hidden=false;
    window.addEventListener('hashchange', route);
    route();
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="loading"><div><div style="font-size:44px">📶</div><h2>ما قدرنا نحمّل المصحف</h2><p class="muted">تأكّدي إنه في نت وجرّبي كمان مرة. بعد أول تحميل، التطبيق بيشتغل بلا نت.</p><button class="btn" id="retry">جرّبي كمان مرة</button></div></div>`;
    $('#retry').onclick = () => { app.innerHTML='<div class="loading"><div><div class="spin"></div><div id="loadMsg">عم نحضّر المصحف…</div></div></div>'; boot(); };
  }
}
if(!IS_APP && 'serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
// زر الرجوع بالأندرويد
if(IS_APP){
  try{
    const AppP = (window.CapX && window.CapX.App) || (window.Capacitor.Plugins && window.Capacitor.Plugins.App);
    if(AppP) AppP.addListener('backButton', () => {
      const r=(location.hash||'#home').slice(1).split('/')[0];
      if(document.querySelector('.modal')) return;
      if(r==='home' || r==='') AppP.exitApp();
      else if(r==='page' || (r==='review' && location.hash.split('/').length>1)) history.back();
      else location.hash='#home';
    });
  }catch(e){}
}
boot();
