<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نتيجتي بكورس MrElectroAI 🏆</title>
<meta name="description" content="خلّصت كورس الأسئلة مع أنور الجاسم. جرّب إنت كمان، والكتاب الأول ببلاش.">
<meta property="og:title" content="🏆 خلّصت كورس MrElectroAI">
<meta property="og:description" content="جرّب إنت كمان، والكتاب الأول ببلاش لآخر الشهر.">
<meta name="theme-color" content="#06110e">
<link rel="icon" href="../app/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Readex Pro',system-ui,sans-serif;background:#050c0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
.card{width:min(100%,420px);aspect-ratio:9/16;border-radius:28px;position:relative;overflow:hidden;padding:30px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;
 background:radial-gradient(120% 70% at 50% 0%,#1f8f71 0%,#0b2a22 45%,#050c0a 100%)}
.card:before{content:'';position:absolute;inset:0;background:radial-gradient(60% 40% at 80% 85%,rgba(255,196,0,.18),transparent 70%),radial-gradient(50% 35% at 10% 60%,rgba(34,199,155,.18),transparent 70%)}
.card>*{position:relative}
.lg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;direction:ltr}
.lg i{width:34px;height:34px;border-radius:10px;background:#0e1f1a;border:1px solid #22C79B55;display:grid;place-items:center}
.by{font-size:13px;opacity:.85;margin-top:4px;display:flex;align-items:center;gap:4px}
.tr{font-size:86px;line-height:1;margin-top:auto}
.k{font-size:15px;opacity:.85;margin-top:10px}
.nm{font-size:34px;font-weight:700;margin-top:4px;line-height:1.3}
.co{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:20px;background:#22C79B22;border:1px solid #22C79B88;font-weight:700;font-size:15px}
.rk{font-size:22px;font-weight:700;margin-top:16px;color:#ffd34d}
.st{display:flex;gap:10px;margin-top:16px}
.st div{padding:10px 14px;border-radius:16px;background:#ffffff12;border:1px solid #ffffff22;min-width:92px}
.st b{display:block;font-size:26px}.st small{font-size:12.5px;opacity:.8}
.ce{margin-top:14px;font-weight:700;font-size:15px;color:#ffd34d}
.cta{margin-top:auto;padding:12px 14px;border-radius:18px;background:#22C79B;color:#03140f;font-weight:700;font-size:15px;line-height:1.5;width:100%}
.cta small{display:block;font-weight:600;font-size:12.5px;direction:ltr}
.btns{width:min(100%,420px);display:flex;gap:8px;margin-top:12px}
.btns a{flex:1;text-align:center;padding:12px;border-radius:14px;background:#25D366;color:#fff;font-weight:700;text-decoration:none;font-size:14.5px}
.btns a.alt{background:#1b2a25;border:1px solid #2c4a40}
.hint{font-size:13px;opacity:.75;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="lg"><i><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#22C79B" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></i>MrElectroAI</div>
  <div class="by">أنور الجاسم <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1D9BF0"/><path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.4l3 3 5.8-6.2"/></svg></div>
  <div class="tr" id="tr">🏆</div>
  <div class="k">خلّص كورس الأسئلة</div>
  <div class="nm" id="nm"></div>
  <div class="co" id="co"></div>
  <div class="rk" id="rk"></div>
  <div class="st"><div><b id="ac"></b><small>فهم</small></div><div><b id="mi"></b><small>غلط</small></div></div>
  <div class="ce" id="ce" hidden>🎓 بيستاهل شهادة من أنور</div>
  <div class="cta">جرّب إنت كمان 💪 والكتاب الأول ببلاش<small>mrelectroai-spec.github.io/mrelectroai/free</small></div>
</div>
<div class="btns"><a id="wa" target="_blank" rel="noopener">📲 ابعت عالواتساب</a><a class="alt" href="../free/">🎁 خود الكتاب</a></div>
<p class="hint">📸 صوّر الشاشة ونزّل الكرت ستوري</p>
<script>
(function(){
var q=new URLSearchParams(location.search),$=function(i){return document.getElementById(i);};
var CN={electro:'⚡ كورس الكهربا',classic:'⚙️ كورس الكلاسيك كنترول',solar:'☀️ كورس الطاقة الشمسية'};
var n=(q.get('n')||'').slice(0,40),r=parseInt(q.get('r'))||0,m=parseInt(q.get('m')),a=parseInt(q.get('a'));
$('nm').textContent=n||'بطل الكهربا';$('co').textContent=CN[q.get('c')]||'كورس MrElectroAI';
$('tr').textContent=r===1?'🥇':r===2?'🥈':r===3?'🥉':'🏆';
$('rk').textContent=r?'رقم '+r+' بلوحة الشرف':'';
$('ac').textContent=isNaN(a)?'—':a+'%';$('mi').textContent=isNaN(m)?'—':m;
$('ce').hidden=!(m<=5);
$('wa').href='https://wa.me/?text='+encodeURIComponent('🏆 خلّصت '+($('co').textContent.replace(/^\S+\s/,''))+' مع أنور الجاسم'+(r?' وطلعت رقم '+r+' بلوحة الشرف':'')+'!\nجرّب إنت كمان، والكتاب الأول ببلاش:\nhttps://mrelectroai-spec.github.io/mrelectroai/free/');
})();
</script>
<script src="../t.js" data-page="share" defer></script>
</body>
</html>
