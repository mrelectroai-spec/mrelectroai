<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختار الخط | MrElectroAI</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Almarai:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=Alexandria:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Rubik:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../glass.css">
<script src="../glass.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{color:var(--g-text);padding:max(16px,env(safe-area-inset-top)) 14px 40px;font-family:system-ui,sans-serif}
.w{max-width:560px;margin:0 auto}
h1{font:700 20px 'Readex Pro',sans-serif;margin:4px 4px 4px}.hint{font-size:13px;color:var(--g-muted);margin:0 4px 14px;line-height:1.7}
.f{border-radius:22px;padding:14px 16px;margin-bottom:14px}
.n{display:inline-block;min-width:30px;height:30px;line-height:30px;text-align:center;border-radius:10px;background:#22C79B;color:#03140f;font:700 16px system-ui;margin-left:8px}
.nm{font:600 13px system-ui;color:var(--g-muted);direction:ltr;display:inline-block}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(34,199,155,.22);margin-right:6px;font-family:system-ui}
.t{font-size:21px;font-weight:700;margin:10px 0 4px;line-height:1.5}
.b{font-size:15.5px;line-height:1.85;color:var(--g-text)}
.m{font-size:13px;color:var(--g-muted);margin-top:4px;line-height:1.7}
.d{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.d span{font-size:13px;font-weight:700;padding:7px 11px;border-radius:12px;background:var(--g-chip);border:1px solid var(--g-edge2)}
</style>
</head>
<body>
<div class="w">
  <h1>🔤 اختار خط التطبيق</h1>
  <p class="hint">نفس الكلام بكل خط. شوف أيّا واحد أريح لعينك، وقلّي رقمو.</p>
  <div id="list"></div>
</div>
<script>
var F=[
 ['Readex Pro','العناوين هلّق'],
 ['IBM Plex Sans Arabic','الكتابة هلّق'],
 ['Noto Sans Arabic','نفس خط كتبك'],
 ['Cairo',''],
 ['Tajawal',''],
 ['Almarai',''],
 ['Noto Kufi Arabic',''],
 ['Alexandria',''],
 ['Rubik',''],
 ['Baloo Bhaijaan 2','']
];
var h='';F.forEach(function(f,i){var ff="'"+f[0]+"',sans-serif";
 h+='<div class="f mea-glass" style="font-family:'+ff+'"><span class="n">'+(i+1)+'</span><span class="nm">'+f[0]+'</span>'+(f[1]?'<span class="tag">'+f[1]+'</span>':'')
 +'<div class="t">مختبر التابلو ⚡ الكلاسيك كنترول</div>'
 +'<div class="b">ركّب قواطع وكونتاكتور وأوفرلود وموتور، وصّل بإيدك وشوف إذا مشروعك زابط. القاعدة 7: الأمبير بيقرّر سماكة الكابل.</div>'
 +'<div class="m">الكتاب 2 · 25 قاعدة · 250 سؤال · 1234567890</div>'
 +'<div class="d"><span>الكتب</span><span>مساري</span><span>الأدوات</span><span>اشتري عالواتساب</span></div></div>';});
document.getElementById('list').innerHTML=h;
</script>
</body>
</html>
