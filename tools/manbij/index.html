let mem = null;
function lsGet(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : { c: [] }; }
  catch(e){ return mem || { c: [] }; } }
function lsSet(){ mem = db; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }

/* ── Supabase REST ── */
async function api(path, opts = {}){
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...opts,
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
      'Content-Type':'application/json', Prefer:'return=representation', ...(opts.headers||{}) }
  });
  if(!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
function setSync(state, txt){
  const s = $('sync'); s.className = 'sync ' + state; $('syncTxt').innerHTML = txt;
  const d = $('dot');
  if(d) d.style.background = state==='on' ? 'var(--ok)' : state==='err' ? 'var(--danger)' : 'var(--sun)';
}
async function cloudLoad(){
  if(!CLOUD){
    db = lsGet();
    setSync('off','<b>وضع محلي</b> <span>— البيانات على هالجهاز بس. اربط قاعدة البيانات ليصير الفرعين على نفس الشي.</span>');
    $('setupCard').style.display = 'block';
    return;
  }
  $('setupCard').style.display = 'none';
  try {
    const rows = await api('customers?select=*&order=updated_at.desc');
    db = { c: rows.map(r => ({ id:r.id, name:r.name, nick:r.nick||'', vil:r.vil,
      phone:r.phone||'', sys:r.sys||'', visits:r.visits||[] })) };
    lsSet();
    setSync('on','<b>متصل</b> <span>— '+db.c.length+' زبون · الفرعين على نفس القاعدة</span>');
  } catch(e){
    db = lsGet();
    setSync('err','<b>ما قدرنا نتصل</b> <span>— عم نشتغل محلياً والبيانات محفوظة. رح نرجع نتصل لما يرجع النت.</span>');
  }
}
async function cloudSave(c){
  lsSet();
  if(!CLOUD) return;
  try {
    const body = { name:c.name, nick:c.nick, vil:c.vil, phone:c.phone, sys:c.sys,
      visits:c.visits, updated_at:new Date().toISOString() };
    if(c._new){ const r = await api('customers', { method:'POST', body: JSON.stringify(body) });
      if(r && r[0]) c.id = r[0].id; delete c._new; }
    else await api('customers?id=eq.'+c.id, { method:'PATCH', body: JSON.stringify(body) });
    setSync('on','<b>محفوظ بالسحابة</b> <span>— '+db.c.length+' زبون</span>');
  } catch(e){ setSync('err','<b>ما انحفظ بالسحابة</b> <span>— محفوظ محلياً، جرّب لما يرجع النت</span>'); }
}
async function cloudDelete(id){
  lsSet(); if(!CLOUD) return;
  try { await api('customers?id=eq.'+id, { method:'DELETE' }); } catch(e){}
}

const SQL = `create table if not exists customers (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  nick text default '',
  vil text not null,
  phone text default '',
  sys text default '',
  visits jsonb default '[]'::jsonb,
  created_at timestamptz default now(),
  updated_at timestamptz default now()
);
create index if not exists customers_name_idx on customers (name);
create index if not exists customers_vil_idx on customers (vil);
create index if not exists customers_phone_idx on customers (phone);
alter table customers enable row level security;
drop policy if exists "app_read" on customers;
drop policy if exists "app_insert" on customers;
drop policy if exists "app_update" on customers;
drop policy if exists "app_delete" on customers;
create policy "app_read" on customers for select using (true);
create policy "app_insert" on customers for insert with check (true);
create policy "app_update" on customers for update using (true);
create policy "app_delete" on customers for delete using (true);`;

function clearForm(){ ['fName','fNick','fVil','fPhone','fNote','fSys'].forEach(i => $(i).value=''); }
function newVisit(){ return { d:new Date().toISOString(), t:$('fType').value,
  n:$('fNote').value.trim(), br, by:SHOP.branches[br].mgr }; }
async function saveCustomer(){
  const name = $('fName').value.trim(), vil = $('fVil').value.trim();
  if(!name) return say('اكتب اسم الزبون');
  if(!vil) return say('اكتب اسم الضيعة');
  const nick = $('fNick').value.trim();
  const dup = db.c.find(c => c.name===name && c.vil===vil && (c.nick||'')===nick);
  if(dup){
    dup.visits.unshift(newVisit());
    if($('fSys').value.trim()) dup.sys = $('fSys').value.trim();
    if($('fPhone').value.trim()) dup.phone = $('fPhone').value.trim();
    await cloudSave(dup); say('هالزبون مسجّل من قبل — انضاف الشغل على ملفّو');
    return openProf(dup.id);
  }
  const c = { id:'tmp'+Date.now().toString(36), _new:true, name, nick, vil,
    phone:$('fPhone').value.trim(), sys:$('fSys').value.trim(), visits:[newVisit()] };
  db.c.push(c); await cloudSave(c); say('انحفظ الزبون'); openProf(c.id);
}

    n:$('nNote').value.trim(), br, by:SHOP.branches[br].mgr });

  else { const days = Math.floor((Date.now() - new Date(d)) / 86400000);

    else html = '✅ آخر نسخة: ' + new Date(d).toLocaleDateString('ar-EG'); }
  $('bkStatus').innerHTML = html ? '<div class="bkbox '+cls+'">'+html+'</div>' : '';
}

      if(!e2){ const c = {...x, id:'tmp'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), _new:true};
        db.c.push(c); await cloudSave(c); added++; }
      else { const have = new Set(e2.visits.map(v => v.d));
        let ch = false;
        (x.visits||[]).forEach(v => { if(!have.has(v.d)){ e2.visits.push(v); ch = true; } });
        if(ch){ e2.visits.sort((a,b) => b.d.localeCompare(a.d)); await cloudSave(e2); } }
    }
    say('انضاف '+added+' زبون'); refresh();
  } catch(err){ say('الملف مش صحيح'); } };
  r.readAsText(f);
};
function say(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2600); }

(async () => { await cloudLoad(); bkStatus(); go(0); })();
</script>
