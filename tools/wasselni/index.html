<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>وصّلني</title>
<meta name="description" content="اطلب توكتوك أو سيارة من أقرب سائق.">
<meta name="theme-color" content="#0E7C3A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--g:#0E7C3A;--g2:#0A5F2C;--gs:#E3F3E8;--y:#F5B301;--ink:#14261B;--muted:#6B7C72;
  --line:#E2E8E3;--soft:#F3F6F4;--paper:#FFF;--danger:#C0392B;
  --sh:0 -6px 28px rgba(20,38,27,.14);--sh2:0 4px 16px rgba(20,38,27,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:#DDE4DF;
  font-size:15px;line-height:1.6;position:fixed;inset:0}
:where(button,input,select):focus-visible{outline:2px solid var(--g);outline-offset:2px}

#map{position:absolute;inset:0;z-index:1;background:#DDE4DF}
#map:empty::after{content:'عم نحمّل الخريطة...';position:absolute;inset:0;display:grid;
  place-items:center;color:#6B7C72;font-size:14px}
.leaflet-container{font-family:'IBM Plex Sans Arabic',sans-serif;background:#DDE4DF}

/* ── الرأس العائم ── */
.top{position:absolute;top:0;inset-inline:0;z-index:400;padding:calc(10px + env(safe-area-inset-top)) 12px 0;
  display:flex;gap:9px;align-items:flex-start}
.tbtn{width:46px;height:46px;border-radius:14px;background:#fff;border:0;box-shadow:var(--sh2);
  display:grid;place-items:center;font-size:20px;cursor:pointer;flex-shrink:0}
.searchbar{flex:1;background:#fff;border-radius:14px;box-shadow:var(--sh2);padding:4px}
.sfield{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;border-radius:11px}
.sfield:active{background:var(--soft)}
.sdot{width:10px!important;height:10px;min-width:10px;max-width:10px;border-radius:50%;
  flex:0 0 10px;display:block;font-style:normal}
.sdot.a{background:var(--g)}.sdot.b{background:var(--danger);border-radius:2px}
.sfield span{flex:1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfield span.has{color:var(--ink);font-weight:600}
.sline{height:1px;background:var(--line);margin:0 11px}

/* ── دبوس المنتصف ── */
.pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);z-index:350;
  pointer-events:none;font-size:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));transition:transform .12s}
.pin.up{transform:translate(-50%,-118%)}
.pin.hide{display:none}

/* ── البطاقة السفلية ── */
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:500;background:#fff;
  border-radius:26px 26px 0 0;box-shadow:var(--sh);padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:82vh;overflow-y:auto;transition:transform .3s cubic-bezier(.32,.72,0,1)}
.grab{width:42px;height:5px;border-radius:5px;background:#D7DEDA;margin:0 auto 12px}
.sheet h2{font-family:'Readex Pro',sans-serif;font-size:19px;margin-bottom:3px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:13px}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;
  border-radius:15px;font-family:inherit;font-size:16px;font-weight:700;border:0;
  background:var(--soft);color:var(--ink);cursor:pointer;margin-top:9px}
.btn.main{background:var(--g);color:#fff}
.btn.y{background:var(--y);color:#3A2A00}
.btn.line{background:#fff;border:1.5px solid var(--line)}
.btn.dang{background:#FDEDEA;color:var(--danger)}
.btn:disabled{opacity:.45;pointer-events:none}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* ── اختيار المركبة ── */
.veh{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.vcard{background:var(--soft);border:2px solid transparent;border-radius:17px;padding:14px 10px;
  cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);position:relative}
.vcard.on{border-color:var(--g);background:var(--gs)}
.vcard .ic{font-size:34px;line-height:1}
.vcard b{display:block;font-size:14.5px;margin:5px 0 1px}
.vcard .p{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;color:var(--g2)}
.vcard small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}

.meta{display:flex;gap:8px;margin-bottom:12px}
.meta div{flex:1;background:var(--soft);border-radius:13px;padding:11px 8px;text-align:center}
.meta b{display:block;font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--g2)}
.meta small{font-size:10.5px;color:var(--muted)}

.pax{display:flex;gap:7px;margin-bottom:12px}
.pax button{flex:1;background:var(--soft);border:1.5px solid transparent;border-radius:12px;
  padding:12px 0;font-family:inherit;font-size:16px;cursor:pointer;color:var(--ink);font-weight:600}
.pax button.on{border-color:var(--g);background:var(--gs);color:var(--g2)}

input,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--soft);
  border:1.5px solid transparent;border-radius:13px;padding:14px}
input:focus,select:focus{border-color:var(--g);background:#fff}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mb{margin-bottom:11px}

/* ── البحث ── */
.searchpage{position:absolute;inset:0;z-index:700;background:#fff;display:none;
  flex-direction:column;padding-top:env(safe-area-inset-top)}
.searchpage.on{display:flex}
.sp-top{padding:12px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line)}
.sp-top input{flex:1}
.sp-res{flex:1;overflow-y:auto;padding:8px 12px 20px}
.res{display:flex;align-items:center;gap:12px;padding:14px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.res:active{background:var(--soft)}
.res .ri{width:38px;height:38px;border-radius:11px;background:var(--gs);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.res .rt{flex:1;min-width:0}
.res .rt b{display:block;font-size:14.5px}
.res .rt small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── البحث عن سائق ── */
.radar{width:88px;height:88px;border-radius:50%;border:3px solid var(--g);margin:6px auto 14px;
  display:grid;place-items:center;font-size:38px;animation:rd 1.5s ease-in-out infinite}
@keyframes rd{0%,100%{box-shadow:0 0 0 0 rgba(14,124,58,.35)}50%{box-shadow:0 0 0 20px rgba(14,124,58,0)}}

/* ── السائق ── */
.drv{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.drv img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--g);flex-shrink:0}
.drv .av{width:60px;height:60px;border-radius:50%;background:var(--gs);display:grid;place-items:center;font-size:28px;flex-shrink:0}
.drv .di{flex:1;min-width:0}
.drv .di b{display:block;font-size:17px}
.drv .di small{display:block;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:7px;padding:2px 8px;
  background:var(--gs);color:var(--g2);margin-inline-end:5px}
.call{width:54px;height:54px;border-radius:50%;background:var(--g);display:grid;place-items:center;
  text-decoration:none;font-size:24px;flex-shrink:0}
.status{background:var(--gs);border-radius:13px;padding:12px;text-align:center;margin-bottom:11px}
.status b{display:block;font-size:15px;color:var(--g2)}
.status small{font-size:12px;color:var(--muted)}

.stars{display:flex;gap:8px;justify-content:center;margin:12px 0}
.stars button{background:none;border:0;font-size:36px;cursor:pointer;filter:grayscale(1);opacity:.35}
.stars button.on{filter:none;opacity:1}
.note{font-size:12.5px;color:var(--muted);background:#FDF6E3;border-radius:12px;padding:12px;line-height:1.75;margin-top:10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:14px;
  transition:transform .3s;z-index:900;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.menu{position:absolute;inset:0;z-index:800;background:rgba(0,0,0,.45);display:none}
.menu.on{display:block}
.mbox{position:absolute;inset-block:0;inset-inline-start:0;width:min(300px,82vw);background:#fff;
  padding:calc(20px + env(safe-area-inset-top)) 18px 20px;overflow-y:auto}
.mbox h3{font-family:'Readex Pro',sans-serif;font-size:19px;margin-bottom:3px}
.mbox .mm{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.mi{display:flex;align-items:center;gap:12px;padding:14px 10px;border-radius:13px;cursor:pointer;
  text-decoration:none;color:var(--ink);font-size:14.5px}
.mi:active{background:var(--soft)}
.mi i{font-size:20px;font-style:normal;width:26px;text-align:center}
</style>
</head>
<body>

<div id="map"></div>
<div class="pin hide" id="pin">📍</div>

<div class="top">
  <button class="tbtn" id="menuBtn">☰</button>
  <div class="searchbar">
    <div class="sfield" data-f="a"><i class="sdot a"></i><span id="fromTxt">من وين؟</span></div>
    <div class="sline"></div>
    <div class="sfield" data-f="b"><i class="sdot b"></i><span id="toTxt">لوين رايح؟</span></div>
  </div>
</div>

<div class="sheet" id="sheet"></div>

<!-- البحث عن مكان -->
<div class="searchpage" id="sp">
  <div class="sp-top">
    <button class="tbtn" id="spBack">→</button>
    <input id="spq" placeholder="اكتب اسم المنطقة..." autocomplete="off">
  </div>
  <div class="sp-res" id="spr"></div>
</div>

<!-- القائمة -->
<div class="menu" id="menu">
  <div class="mbox">
    <h3>وصّلني 🛺</h3>
    <div class="mm">توكتوك وسيارات — عكار</div>
    <a class="mi" href="driver.html"><i>🛺</i> أنا سائق</a>
    <div class="mi" id="myTrips"><i>🧾</i> رحلاتي</div>
    <div class="mi" id="repBtn"><i>🚨</i> إبلاغ عن مشكلة</div>
    <a class="mi" href="../../privacy/"><i>🔒</i> سياسة الخصوصية</a>
    <a class="mi" href="https://mrelectroai-spec.github.io/mrelectroai/" target="_blank"><i>⚡</i> من نحن</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SB_URL="https://utjpvjnhffapbwpbkkuc.supabase.co";
const SB_KEY="sb_publishable_wSY0Oa0SmW_Ipgaerw-zCA_CM_PZQvK";

/* تسعيرة العدّاد — بالألف ل.ل. */
const TAR = {
  tuktuk:{ name:'توكتوك', ic:'🛺', base:50, km:40, min:3, extraPax:100, minFare:100 },
  car:   { name:'سيارة',  ic:'🚗', base:100, km:70, min:5, extraPax:100, minFare:200 }
};
const CENTER=[34.5145,36.0075];

const $=i=>document.getElementById(i);
let map,pin=null,A=null,B=null,mA=null,mB=null,line=null,mDrv=null;
let veh='tuktuk',pax=1,picking=null,ride=null,poll=null,quote=null;
const money=n=>Math.round(n).toLocaleString('en-US');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function say(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}

async function api(path,opts={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{apikey:SB_KEY,
    Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',
    Prefer:'return=representation',...(opts.headers||{})}});
  if(!r.ok) throw new Error(await r.text());
  return r.status===204?null:r.json();
}
const sb=async fn=>{try{return await fn()}catch(e){return null}};

/* ══ الخريطة ══ */
map=L.map('map',{zoomControl:false,attributionControl:false}).setView(CENTER,14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20}).addTo(map);
L.control.attribution({position:'bottomright',prefix:false}).addAttribution('© OSM · Carto').addTo(map);

navigator.geolocation && navigator.geolocation.getCurrentPosition(p=>{
  const c=[p.coords.latitude,p.coords.longitude];
  map.setView(c,16);
  if(!A){ A={lat:c[0],lng:c[1],name:'موقعي الحالي'}; setPt('a',A); }
},()=>{},{enableHighAccuracy:true,timeout:8000});

function icon(emo,size){return L.divIcon({className:'',iconSize:[size,size],
  html:'<div style="font-size:'+(size-8)+'px;line-height:1;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))">'+emo+'</div>'});}
function setPt(k,p){
  if(k==='a'){ A=p; $('fromTxt').textContent=p.name; $('fromTxt').classList.add('has');
    if(mA)map.removeLayer(mA); mA=L.marker([p.lat,p.lng],{icon:icon('🟢',30)}).addTo(map); }
  else { B=p; $('toTxt').textContent=p.name; $('toTxt').classList.add('has');
    if(mB)map.removeLayer(mB); mB=L.marker([p.lat,p.lng],{icon:icon('📍',34)}).addTo(map); }
  if(A&&B){
    if(line)map.removeLayer(line);
    line=L.polyline([[A.lat,A.lng],[B.lat,B.lng]],{color:'#0E7C3A',weight:4,dashArray:'8 7'}).addTo(map);
    map.fitBounds(line.getBounds().pad(.35));
    quoteRide();
  }
  render();
}
function km(a,b){const R=6371,p=Math.PI/180;
  const s=Math.sin((b.lat-a.lat)*p/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin((b.lng-a.lng)*p/2)**2;
  return Math.max(.5, R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))*1.3);   /* ×1.3 لطرق الواقع */
}
function fare(t,d,n){const c=TAR[t];
  const mins=Math.max(3,Math.round(d*2.6));
  let v=c.base+d*c.km+mins*c.min+(n>1?c.extraPax:0);
  return {v:Math.max(c.minFare,Math.round(v/25)*25),mins};
}
function quoteRide(){ if(!A||!B)return; const d=km(A,B);
  quote={d, t:fare('tuktuk',d,pax), c:fare('car',d,pax)}; }

/* ══ اختيار المكان ══ */
document.querySelectorAll('.sfield').forEach(f=>f.onclick=()=>openSearch(f.dataset.f));
function openSearch(k){ picking=k; $('sp').classList.add('on'); $('spq').value='';
  $('spq').placeholder = k==='a'?'من وين؟':'لوين رايح؟';
  $('spr').innerHTML=quickList(); setTimeout(()=>$('spq').focus(),150); }
$('spBack').onclick=()=>$('sp').classList.remove('on');
function quickList(){
  const rec=JSON.parse(localStorage.getItem('w_recent')||'[]');
  return '<div class="res" id="useMap"><span class="ri">🗺️</span><span class="rt"><b>حدّد على الخريطة</b>'
    +'<small>حرّك الدبوس عالمكان بالضبط</small></span></div>'
    +'<div class="res" id="useGps"><span class="ri">📍</span><span class="rt"><b>موقعي الحالي</b>'
    +'<small>استعمل GPS</small></span></div>'
    + rec.map(r=>'<div class="res" data-r=\''+JSON.stringify(r)+'\'><span class="ri">🕘</span>'
      +'<span class="rt"><b>'+r.name+'</b><small>زيارة سابقة</small></span></div>').join('');
}
let tmr;
$('spq').addEventListener('input',()=>{ clearTimeout(tmr);
  const q=$('spq').value.trim();
  if(q.length<2){ $('spr').innerHTML=quickList(); return; }
  tmr=setTimeout(async()=>{
    $('spr').innerHTML='<div class="res"><span class="rt"><b>عم ندوّر...</b></span></div>';
    try{
      const c=map.getCenter();
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=8&accept-language=ar&countrycodes=lb&q='
        +encodeURIComponent(q)+'&viewbox='+(c.lng-.6)+','+(c.lat+.4)+','+(c.lng+.6)+','+(c.lat-.4));
      const d=await r.json();
      $('spr').innerHTML = d.length ? d.map(x=>{
        const p={lat:+x.lat,lng:+x.lon,name:x.display_name.split(',')[0],full:x.display_name.split(',').slice(0,3).join('، ')};
        return '<div class="res" data-r=\''+JSON.stringify(p)+'\'><span class="ri">📌</span>'
          +'<span class="rt"><b>'+p.name+'</b><small>'+p.full+'</small></span></div>';
      }).join('') : '<div class="res"><span class="rt"><b>ما لقينا</b><small>جرّب اسم تاني أو حدّد على الخريطة</small></span></div>';
    }catch(e){ $('spr').innerHTML='<div class="res"><span class="rt"><b>ما قدرنا ندوّر</b><small>تفقّد الإنترنت</small></span></div>'; }
  },450);
});
$('spr').onclick=e=>{
  if(e.target.closest('#useMap')){ $('sp').classList.remove('on'); startPin(); return; }
  if(e.target.closest('#useGps')){
    $('sp').classList.remove('on');
    navigator.geolocation.getCurrentPosition(p=>{
      setPt(picking,{lat:p.coords.latitude,lng:p.coords.longitude,name:'موقعي الحالي'});
      map.setView([p.coords.latitude,p.coords.longitude],16);
    },()=>say('ما قدرنا نحدّد موقعك'),{enableHighAccuracy:true,timeout:8000});
    return; }
  const r=e.target.closest('[data-r]'); if(!r) return;
  const p=JSON.parse(r.dataset.r);
  const rec=JSON.parse(localStorage.getItem('w_recent')||'[]');
  localStorage.setItem('w_recent',JSON.stringify([p,...rec.filter(x=>x.name!==p.name)].slice(0,5)));
  setPt(picking,p); $('sp').classList.remove('on'); map.setView([p.lat,p.lng],16);
};
function startPin(){
  $('pin').classList.remove('hide');
  $('sheet').innerHTML='<div class="grab"></div><h2>حدّد المكان</h2>'
    +'<div class="sub">حرّك الخريطة لتصير النقطة على المكان بالضبط</div>'
    +'<button class="btn main" id="pinOk">تأكيد الموقع</button>'
    +'<button class="btn line" id="pinX">إلغاء</button>';
  map.on('movestart',pinUp); map.on('moveend',pinDown);
  $('pinOk').onclick=async()=>{
    const c=map.getCenter();
    let nm='موقع محدّد';
    try{ const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&accept-language=ar&lat='+c.lat+'&lon='+c.lng);
      const d=await r.json(); nm=(d.name||d.display_name||'').split(',')[0]||nm; }catch(e){}
    endPin(); setPt(picking,{lat:c.lat,lng:c.lng,name:nm});
  };
  $('pinX').onclick=()=>{ endPin(); render(); };
}
const pinUp=()=>$('pin').classList.add('up');
const pinDown=()=>$('pin').classList.remove('up');
function endPin(){ $('pin').classList.add('hide'); map.off('movestart',pinUp); map.off('moveend',pinDown); }

/* ══ القائمة ══ */
$('menuBtn').onclick=()=>$('menu').classList.add('on');
$('menu').onclick=e=>{ if(!e.target.closest('.mbox')) $('menu').classList.remove('on'); };
$('repBtn').onclick=async()=>{ const b=prompt('شو المشكلة؟'); if(!b)return;
  await sb(()=>api('w_reports',{method:'POST',body:JSON.stringify([{id:uid('p'),who:'customer',
    name:localStorage.getItem('w_name')||'',phone:localStorage.getItem('w_phone')||'',body:b}])}));
  say('وصلنا البلاغ 🙏'); $('menu').classList.remove('on'); };
$('myTrips').onclick=async()=>{
  const ph=localStorage.getItem('w_phone'); $('menu').classList.remove('on');
  if(!ph) return say('ما في رحلات بعد');
  const rows=await sb(()=>api('w_rides?cphone=eq.'+encodeURIComponent(ph)+'&select=*&order=created_at.desc&limit=15'));
  $('sheet').innerHTML='<div class="grab"></div><h2>رحلاتي</h2>'
    +((rows&&rows.length)?rows.map(r=>'<div class="status" style="text-align:right;margin-bottom:8px">'
      +'<b>'+r.fromtxt+' ← '+r.totxt+'</b>'
      +'<small>'+new Date(r.created_at).toLocaleDateString('ar-LB')+' · '+money(r.paid||r.est)+' ألف · '
      +({searching:'ملغى',accepted:'ملغى',done:'خلصت',cancelled:'ملغى'}[r.status]||r.status)+'</small></div>').join('')
      :'<div class="sub">ما في رحلات بعد.</div>')
    +'<button class="btn main" onclick="render()">رجوع</button>';
};

/* ══ الواجهة الرئيسية ══ */
function render(){
  if(ride) return;
  const s=$('sheet');
  if(!A||!B){
    s.innerHTML='<div class="grab"></div><h2>لوين رايح؟</h2>'
      +'<div class="sub">حدّد نقطة الانطلاق والوجهة من فوق</div>'
      +'<div class="veh">'+Object.entries(TAR).map(([k,c])=>
        '<button class="vcard'+(veh===k?' on':'')+'" data-v="'+k+'"><div class="ic">'+c.ic+'</div>'
        +'<b>'+c.name+'</b><small>ابدأ من '+c.minFare+' ألف</small></button>').join('')+'</div>'
      +'<button class="btn main" onclick="document.querySelector(\'[data-f=b]\').click()">حدّد وجهتك</button>';
    bindVeh(); return;
  }
  const q=quote||{d:km(A,B),t:fare('tuktuk',km(A,B),pax),c:fare('car',km(A,B),pax)};
  s.innerHTML='<div class="grab"></div>'
    +'<div class="meta"><div><b>'+q.d.toFixed(1)+'</b><small>كم</small></div>'
      +'<div><b>'+q[veh==='tuktuk'?'t':'c'].mins+'</b><small>دقيقة</small></div>'
      +'<div><b>'+pax+'</b><small>راكب</small></div></div>'
    +'<div class="veh">'+Object.entries(TAR).map(([k,c])=>{
      const f=k==='tuktuk'?q.t:q.c;
      return '<button class="vcard'+(veh===k?' on':'')+'" data-v="'+k+'"><div class="ic">'+c.ic+'</div>'
        +'<b>'+c.name+'</b><div class="p">'+money(f.v)+'</div><small>ألف ل.ل.</small></button>';}).join('')+'</div>'
    +'<label class="lbl">كم شخص؟</label><div class="pax" id="paxB">'
      +[1,2,3,4].map(n=>'<button data-p="'+n+'"'+(pax===n?' class="on"':'')+'>'+(n===4?'4+':n)+'</button>').join('')+'</div>'
    +'<div class="two mb"><div><label class="lbl">اسمك</label><input id="cn" placeholder="محمد" value="'+(localStorage.getItem('w_name')||'')+'"></div>'
      +'<div><label class="lbl">رقمك</label><input id="cp" type="tel" placeholder="70xxxxxx" value="'+(localStorage.getItem('w_phone')||'')+'"></div></div>'
    +'<button class="btn main" id="go">'+TAR[veh].ic+' اطلب '+TAR[veh].name+' · '+money(q[veh==='tuktuk'?'t':'c'].v)+' ألف</button>'
    +'<div class="note">السعر تقديري بالعدّاد — الدفع نقداً للسائق.</div>';
  bindVeh();
  $('paxB').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;pax=+b.dataset.p;quoteRide();render();};
  $('go').onclick=order;
}
function bindVeh(){ document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{veh=b.dataset.v;render();}); }

async function order(){
  const n=$('cn').value.trim(),p=$('cp').value.trim();
  if(!n||!p) return say('اكتب اسمك ورقمك');
  localStorage.setItem('w_name',n); localStorage.setItem('w_phone',p);
  const q=quote, f=veh==='tuktuk'?q.t:q.c, id=uid('r');
  $('go').disabled=true;
  const r=await sb(()=>api('w_rides',{method:'POST',body:JSON.stringify([{id,cname:n,cphone:p,vtype:veh,
    fromtxt:A.name,totxt:B.name,flat:A.lat,flng:A.lng,tlat:B.lat,tlng:B.lng,pax,
    km:+q.d.toFixed(2),mins:f.mins,est:f.v,status:'searching'}])}));
  $('go').disabled=false;
  if(!r) return say('ما قدرنا نبعت الطلب');
  ride=id; localStorage.setItem('w_ride',id); watch();
}

/* ══ متابعة الرحلة ══ */
function watch(){
  clearInterval(poll);
  const tick=async()=>{
    const rows=await sb(()=>api('w_rides?id=eq.'+ride+'&select=*'));
    if(!rows||!rows[0])return; const r=rows[0];
    if(r.status==='searching') vSearch(r);
    else if(r.status==='cancelled'){clearInterval(poll);localStorage.removeItem('w_ride');ride=null;say('انلغى الطلب');render();}
    else if(r.status==='done') vRate(r);
    else vDriver(r);
  };
  tick(); poll=setInterval(tick,4000);
}
function vSearch(r){
  if($('sheet').dataset.v==='s')return; $('sheet').dataset.v='s';
  $('sheet').innerHTML='<div class="grab"></div><div style="text-align:center">'
    +'<div class="radar">'+TAR[r.vtype].ic+'</div>'
    +'<h2>عم ندوّرلك على سائق</h2>'
    +'<div class="sub">'+r.fromtxt+' ← '+r.totxt+' · '+money(r.est)+' ألف</div></div>'
    +'<button class="btn dang" id="cx">إلغاء الطلب</button>';
  $('cx').onclick=async()=>{ await sb(()=>api('w_rides?id=eq.'+ride,{method:'PATCH',body:JSON.stringify({status:'cancelled'})}));
    clearInterval(poll); localStorage.removeItem('w_ride'); ride=null; $('sheet').dataset.v=''; render(); };
}
async function vDriver(r){
  const d=(await sb(()=>api('w_drivers?id=eq.'+r.driver+'&select=*')))?.[0];
  if(d&&d.lat){ const p=[d.lat,d.lng];
    if(mDrv)mDrv.setLatLng(p); else mDrv=L.marker(p,{icon:icon(TAR[r.vtype].ic,40)}).addTo(map);
    if(r.status==='accepted'&&mA) map.fitBounds(L.latLngBounds([mA.getLatLng(),p]).pad(.4));
  }
  if($('sheet').dataset.v===r.status)return; $('sheet').dataset.v=r.status;
  const st={accepted:['السائق جاي 🛺','عم يوصل لعندك'],
            arrived:['السائق وصل! 🎉','هو مستنيك برّا'],
            onboard:['بالطريق 🚀','رحلة سعيدة']}[r.status]||['',''];
  $('sheet').innerHTML='<div class="grab"></div>'
    +'<div class="status"><b>'+st[0]+'</b><small>'+st[1]+'</small></div>'
    +'<div class="drv">'+(d&&d.photo?'<img src="'+d.photo+'">':'<span class="av">'+TAR[r.vtype].ic+'</span>')
    +'<span class="di"><b>'+(d?d.name:'سائق')+'</b><small>'
    +'<span class="chip">'+TAR[r.vtype].name+' '+(d?d.color:'')+'</span>'
    +(d&&d.plate?'<span class="chip">'+d.plate+'</span>':'')
    +(d&&d.trips?'<span class="chip">⭐ '+(+d.rating).toFixed(1)+'</span>':'<span class="chip">جديد</span>')
    +'</small></span>'+(d?'<a class="call" href="tel:'+d.phone+'">📞</a>':'')+'</div>'
    +'<div class="meta"><div><b>'+money(r.est)+'</b><small>ألف ل.ل.</small></div>'
      +'<div><b>'+(+r.km).toFixed(1)+'</b><small>كم</small></div>'
      +'<div><b>'+r.mins+'</b><small>دقيقة</small></div></div>'
    +(r.status!=='onboard'?'<button class="btn dang" id="cx2">إلغاء</button>':'')
    +'<div class="note">الدفع نقداً — السعر النهائي بيحددو العدّاد مع السائق.</div>';
  if($('cx2'))$('cx2').onclick=async()=>{ await sb(()=>api('w_rides?id=eq.'+ride,{method:'PATCH',body:JSON.stringify({status:'cancelled'})}));
    clearInterval(poll); localStorage.removeItem('w_ride'); ride=null; $('sheet').dataset.v=''; if(mDrv){map.removeLayer(mDrv);mDrv=null;} render(); };
}
function vRate(r){
  clearInterval(poll);
  if($('sheet').dataset.v==='d')return; $('sheet').dataset.v='d';
  $('sheet').innerHTML='<div class="grab"></div><div style="text-align:center"><h2>وصلت! كيف كانت؟</h2>'
    +'<div class="stars" id="st">'+[1,2,3,4,5].map(i=>'<button data-s="'+i+'">⭐</button>').join('')+'</div></div>'
    +'<label class="lbl">كم دفعت فعلياً؟ (بالألف)</label>'
    +'<input id="pd" type="number" inputmode="numeric" placeholder="'+r.est+'" style="text-align:center;font-family:monospace;font-size:22px">'
    +'<div class="note">رقمك بيساعدنا نضبط التسعيرة — ما بيظهر لحدا.</div>'
    +'<button class="btn main" id="sr">إرسال</button><button class="btn line" id="sk">تخطّي</button>';
  let s=0;
  $('st').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;s=+b.dataset.s;
    [...$('st').children].forEach((x,i)=>x.classList.toggle('on',i<s));};
  $('sr').onclick=async()=>{
    const paid=parseInt($('pd').value)||null;
    await sb(()=>api('w_rides?id=eq.'+ride,{method:'PATCH',body:JSON.stringify({stars:s||null,paid})}));
    if(s&&r.driver){ const d=(await sb(()=>api('w_drivers?id=eq.'+r.driver+'&select=rating,trips')))?.[0];
      if(d){const t=(d.trips||0)+1,rt=((+d.rating||0)*(d.trips||0)+s)/t;
        await sb(()=>api('w_drivers?id=eq.'+r.driver,{method:'PATCH',body:JSON.stringify({rating:+rt.toFixed(2),trips:t})}));}}
    done();
  };
  $('sk').onclick=done;
  function done(){ localStorage.removeItem('w_ride'); ride=null; $('sheet').dataset.v='';
    if(mDrv){map.removeLayer(mDrv);mDrv=null;} say('شكراً! 🙏'); render(); }
}

const open=localStorage.getItem('w_ride');
if(open){ ride=open; watch(); } else render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
