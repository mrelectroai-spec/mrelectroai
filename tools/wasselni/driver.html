<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>وصّلني — سائق</title>
<meta name="theme-color" content="#14261B">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--g:#0E7C3A;--g2:#0A5F2C;--gs:#E3F3E8;--y:#F5B301;--ink:#14261B;--muted:#6B7C72;
  --line:#E2E8E3;--soft:#F3F6F4;--danger:#C0392B;--ds:#FDEDEA;
  --sh:0 -6px 28px rgba(20,38,27,.16);--sh2:0 4px 16px rgba(20,38,27,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:#DDE4DF;
  font-size:15px;line-height:1.6;position:fixed;inset:0}
:where(button,input,select):focus-visible{outline:2px solid var(--g);outline-offset:2px}
#map{position:absolute;inset:0;z-index:1}
.leaflet-container{font-family:'IBM Plex Sans Arabic',sans-serif;background:#DDE4DF}

.top{position:absolute;top:0;inset-inline:0;z-index:400;padding:calc(10px + env(safe-area-inset-top)) 12px 0;
  display:flex;gap:9px;align-items:center}
.tbtn{width:46px;height:46px;border-radius:14px;background:#fff;border:0;box-shadow:var(--sh2);
  display:grid;place-items:center;font-size:20px;cursor:pointer;flex-shrink:0;text-decoration:none;color:var(--ink)}
.onbar{flex:1;background:#fff;border-radius:14px;box-shadow:var(--sh2);padding:10px 14px;
  display:flex;align-items:center;gap:11px}
.onbar.live{background:var(--g);color:#fff}
.onbar .oi{flex:1;min-width:0}
.onbar b{display:block;font-size:14px}
.onbar small{display:block;font-size:11px;opacity:.75}
.sw{position:relative;width:52px;height:30px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#CBD5CF;border-radius:30px;transition:.25s;cursor:pointer}
.sl:before{content:"";position:absolute;width:24px;height:24px;right:3px;top:3px;background:#fff;
  border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw input:checked + .sl{background:var(--y)}
.sw input:checked + .sl:before{transform:translateX(-22px)}

.sheet{position:absolute;inset-inline:0;bottom:0;z-index:500;background:#fff;
  border-radius:26px 26px 0 0;box-shadow:var(--sh);padding:8px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:84vh;overflow-y:auto}
.grab{width:42px;height:5px;border-radius:5px;background:#D7DEDA;margin:0 auto 12px}
.sheet h2{font-family:'Readex Pro',sans-serif;font-size:19px;margin-bottom:3px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:13px}

.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;
  border-radius:15px;font-family:inherit;font-size:16px;font-weight:700;border:0;
  background:var(--soft);color:var(--ink);cursor:pointer;margin-top:9px;text-decoration:none}
.btn.main{background:var(--g);color:#fff}
.btn.y{background:var(--y);color:#3A2A00}
.btn.line{background:#fff;border:1.5px solid var(--line)}
.btn.dang{background:var(--ds);color:var(--danger)}
.btn:disabled{opacity:.45;pointer-events:none}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:9px}

input,select{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--soft);
  border:1.5px solid transparent;border-radius:13px;padding:14px}
input:focus,select:focus{border-color:var(--g);background:#fff}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mb{margin-bottom:11px}

.job{background:#fff;border:2px solid var(--y);border-radius:18px;padding:15px;margin-bottom:10px;
  box-shadow:0 4px 18px rgba(245,179,1,.22)}
.job .jh{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:9px}
.job .jh b{font-size:16px}
.job .price{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--g2)}
.route{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.rp{display:flex;align-items:center;gap:10px;font-size:13.5px}
.rp .d{width:9px;min-width:9px;height:9px;border-radius:50%;flex:0 0 9px;display:block}
.rp .d.a{background:var(--g)}.rp .d.b{background:var(--danger);border-radius:2px}
.rp span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jm{display:flex;gap:8px;margin-bottom:11px}
.jm div{flex:1;background:var(--soft);border-radius:11px;padding:9px 6px;text-align:center}
.jm b{display:block;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--g2)}
.jm small{font-size:10px;color:var(--muted)}

.stat{display:flex;gap:8px;margin-bottom:12px}
.stat div{flex:1;background:var(--soft);border-radius:13px;padding:12px 6px;text-align:center}
.stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--g2)}
.stat small{font-size:10.5px;color:var(--muted)}

.up{display:flex;align-items:center;gap:11px;background:var(--soft);border:1.5px dashed var(--line);
  border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer}
.up img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0}
.up .ui{width:48px;height:48px;border-radius:10px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-size:22px;flex-shrink:0}
.up b{display:block;font-size:13.5px}
.up small{display:block;font-size:11.5px;color:var(--muted)}
.up.done{border-style:solid;border-color:var(--g);background:var(--gs)}
.veh{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.vcard{background:var(--soft);border:2px solid transparent;border-radius:16px;padding:14px 10px;
  cursor:pointer;text-align:center;font-family:inherit;color:var(--ink)}
.vcard.on{border-color:var(--g);background:var(--gs)}
.vcard .ic{font-size:32px;line-height:1}
.vcard b{display:block;font-size:14px;margin-top:5px}
.note{font-size:12.5px;color:var(--muted);background:#FDF6E3;border-radius:12px;padding:12px;line-height:1.75;margin-top:10px}
.note b{color:#8A6100}
.wait{text-align:center;padding:22px 8px}
.wait .ic{font-size:46px;margin-bottom:10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:14px;
  transition:transform .3s;z-index:900;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.ring{animation:rg 1.1s infinite}
@keyframes rg{50%{box-shadow:0 4px 26px rgba(245,179,1,.55)}}
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <a class="tbtn" href="./">→</a>
  <div class="onbar" id="onbar">
    <div class="oi"><b id="onTxt">غير متاح</b><small id="onSub">شغّل لتستقبل الطلبات</small></div>
    <label class="sw"><input type="checkbox" id="onSw"><span class="sl"></span></label>
  </div>
</div>

<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SB_URL="https://utjpvjnhffapbwpbkkuc.supabase.co";
const SB_KEY="sb_publishable_wSY0Oa0SmW_Ipgaerw-zCA_CM_PZQvK";
const VEH={tuktuk:{name:'توكتوك',ic:'🛺'},car:{name:'سيارة',ic:'🚗'}};
const $=i=>document.getElementById(i);
let map,me=null,poll=null,photos={},vt='tuktuk',wake=null,mMe=null,mA=null,mB=null,line=null,cur=null;
const money=n=>Math.round(n).toLocaleString('en-US');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function say(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
async function api(path,opts={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{apikey:SB_KEY,
    Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',
    Prefer:'return=representation',...(opts.headers||{})}});
  if(!r.ok) throw new Error(await r.text());
  return r.status===204?null:r.json();
}
const sb=async fn=>{try{return await fn()}catch(e){return null}};

map=L.map('map',{zoomControl:false,attributionControl:false}).setView([34.5145,36.0075],14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20}).addTo(map);
const icon=(e,s)=>L.divIcon({className:'',iconSize:[s,s],
  html:'<div style="font-size:'+(s-8)+'px;line-height:1;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))">'+e+'</div>'});

function pos(){return new Promise(r=>{ if(!navigator.geolocation)return r(null);
  navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),
    ()=>r(null),{enableHighAccuracy:true,timeout:9000});});}

/* ══ التسجيل ══ */
function regForm(){
  $('sheet').innerHTML='<div class="grab"></div><h2>سجّل كسائق</h2>'
    +'<div class="sub">عبّي معلوماتك — الإدارة بتوافق بأسرع وقت.</div>'
    +'<div class="veh">'+Object.entries(VEH).map(([k,v])=>
      '<button class="vcard'+(vt===k?' on':'')+'" data-v="'+k+'"><div class="ic">'+v.ic+'</div><b>'+v.name+'</b></button>').join('')+'</div>'
    +'<div class="two mb"><div><label class="lbl">اسمك</label><input id="dn" placeholder="أبو علي"></div>'
      +'<div><label class="lbl">رقمك</label><input id="dp" type="tel" placeholder="70xxxxxx"></div></div>'
    +'<div class="two mb"><div><label class="lbl">اللون</label><select id="dc">'
      +['أحمر','أزرق','أصفر','أخضر','أبيض','أسود','رمادي','غير ذلك'].map(c=>'<option>'+c+'</option>').join('')+'</select></div>'
      +'<div><label class="lbl">رقم اللوحة</label><input id="dl" placeholder="اختياري"></div></div>'
    +'<label class="up" id="u1"><span class="ui">📷</span><span><b>صورتك الشخصية</b><small>ليعرفك الزبون</small></span><input type="file" accept="image/*" capture="user" hidden></label>'
    +'<label class="up" id="u2"><span class="ui">'+VEH[vt].ic+'</span><span><b>صورة المركبة</b><small>واضحة من الأمام</small></span><input type="file" accept="image/*" hidden></label>'
    +'<label class="up" id="u3"><span class="ui">🪪</span><span><b>صورة الهوية</b><small>للإدارة فقط — ما بتظهر للزباين</small></span><input type="file" accept="image/*" hidden></label>'
    +'<button class="btn main" id="reg">إرسال الطلب</button>'
    +'<div class="note">بإرسالك الطلب أنت موافق على <a href="../../privacy/" style="color:#8A6100">سياسة الخصوصية</a>.</div>';
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vt=b.dataset.v;regForm();});
  binds(); $('reg').onclick=doReg;
}
function binds(){
  [['u1','photo'],['u2','vehicle'],['u3','idcard']].forEach(([id,k])=>{
    const el=$(id),inp=el.querySelector('input');
    inp.onchange=()=>{const f=inp.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{const im=new Image();
        im.onload=()=>{const c=document.createElement('canvas');
          const w=Math.min(560,im.width);c.width=w;c.height=im.height*w/im.width;
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          photos[k]=c.toDataURL('image/jpeg',.55);
          el.classList.add('done'); el.querySelector('.ui').outerHTML='<img src="'+photos[k]+'">';
        };im.src=rd.result;};
      rd.readAsDataURL(f);};
  });
}
async function doReg(){
  const n=$('dn').value.trim(),p=$('dp').value.trim();
  if(!n||!p)return say('اكتب اسمك ورقمك');
  if(!photos.photo||!photos.vehicle||!photos.idcard)return say('ارفع الصور التلاتة');
  const id=uid('d'); $('reg').disabled=true;
  const r=await sb(()=>api('w_drivers',{method:'POST',body:JSON.stringify([{id,name:n,phone:p,vtype:vt,
    color:$('dc').value,plate:$('dl').value.trim(),photo:photos.photo,vehicle:photos.vehicle,
    idcard:photos.idcard,status:'pending'}])}));
  $('reg').disabled=false;
  if(!r)return say('ما قدرنا نسجّل — تفقّد الإنترنت');
  me={id,name:n,phone:p,vtype:vt};
  localStorage.setItem('w_drv',JSON.stringify(me));
  say('انبعت الطلب ✅'); start();
}

/* ══ التشغيل ══ */
async function start(){ tick(); clearInterval(poll); poll=setInterval(tick,5000); }

$('onSw').onchange=async()=>{
  const on=$('onSw').checked;
  $('onbar').classList.toggle('live',on);
  $('onTxt').textContent=on?'متاح ✅':'غير متاح';
  $('onSub').textContent=on?'خلّي الشاشة فاتحة':'شغّل لتستقبل الطلبات';
  await sb(()=>api('w_drivers?id=eq.'+me.id,{method:'PATCH',body:JSON.stringify({online:on})}));
  if(on){ push(); try{wake=await navigator.wakeLock.request('screen')}catch(e){} }
  else if(wake){ wake.release(); wake=null; }
};
async function push(){
  if(!me||!$('onSw').checked)return;
  const g=await pos(); if(!g)return;
  if(mMe)mMe.setLatLng([g.lat,g.lng]); else mMe=L.marker([g.lat,g.lng],{icon:icon(VEH[me.vtype||'tuktuk'].ic,42)}).addTo(map);
  if(!cur) map.setView([g.lat,g.lng],15);
  await sb(()=>api('w_drivers?id=eq.'+me.id,{method:'PATCH',
    body:JSON.stringify({lat:g.lat,lng:g.lng,seen:new Date().toISOString()})}));
}
setInterval(push,45000);

async function tick(){
  if(!me)return;
  const d=(await sb(()=>api('w_drivers?id=eq.'+me.id+'&select=*')))?.[0];
  if(!d)return;
  me.vtype=d.vtype;
  if(d.status!=='approved'){
    $('onbar').style.display='none';
    $('sheet').innerHTML='<div class="grab"></div><div class="wait">'
      +'<div class="ic">'+(d.status==='blocked'?'🚫':'⏳')+'</div>'
      +'<h2>'+(d.status==='blocked'?'حسابك موقوف':'طلبك قيد المراجعة')+'</h2>'
      +'<div class="sub">'+(d.status==='blocked'?'تواصل مع الإدارة.':'رح تشوف الطلبات أول ما تنقبل.')+'</div></div>';
    return;
  }
  $('onbar').style.display='flex';
  $('onSw').checked=d.online;
  $('onbar').classList.toggle('live',d.online);
  $('onTxt').textContent=d.online?'متاح ✅':'غير متاح';
  $('onSub').textContent=d.online?'خلّي الشاشة فاتحة':'شغّل لتستقبل الطلبات';

  /* رحلة شغّالة */
  const mine=await sb(()=>api('w_rides?driver=eq.'+me.id+'&status=in.(accepted,arrived,onboard)&select=*'));
  if(mine&&mine.length){ cur=mine[0]; return active(cur); }
  cur=null; if(mA){map.removeLayer(mA);mA=null} if(mB){map.removeLayer(mB);mB=null} if(line){map.removeLayer(line);line=null}

  if(!d.online){ $('sheet').innerHTML='<div class="grab"></div><div class="wait">'
    +'<div class="ic">😴</div><h2>أنت غير متاح</h2>'
    +'<div class="sub">شغّل التبديل فوق لتستقبل الطلبات.</div></div>'; return; }

  /* الطلبات */
  const open=await sb(()=>api('w_rides?status=eq.searching&vtype=eq.'+d.vtype+'&select=*&order=created_at.asc&limit=12'));
  const stats=await sb(()=>api('w_rides?driver=eq.'+me.id+'&status=eq.done&select=est,paid,created_at'));
  const today=(stats||[]).filter(r=>new Date(r.created_at).toDateString()===new Date().toDateString());
  const earn=today.reduce((a,r)=>a+(r.paid||r.est||0),0);

  const head='<div class="stat"><div><b>'+today.length+'</b><small>رحلة اليوم</small></div>'
    +'<div><b>'+money(earn)+'</b><small>ألف اليوم</small></div>'
    +'<div><b>'+(+d.rating||0).toFixed(1)+'</b><small>⭐ التقييم</small></div></div>';

  if(!open||!open.length){
    $('sheet').innerHTML='<div class="grab"></div>'+head
      +'<div class="wait"><div class="ic">🔎</div><h2>ما في طلبات هلق</h2>'
      +'<div class="sub">خلّي التطبيق فاتح — أول طلب بيوصلك هون.</div></div>'; return;
  }
  const list=open.map(r=>{
    const dd=(d.lat&&r.flat)?dist(d.lat,d.lng,r.flat,r.flng):null;
    return {r,dd};
  }).sort((a,b)=>(a.dd??99)-(b.dd??99));

  $('sheet').innerHTML='<div class="grab"></div>'+head
    +'<h2>طلبات جديدة</h2><div class="sub">الأقرب إلك أول</div>'
    + list.map(({r,dd},i)=>'<div class="job'+(i===0?' ring':'')+'">'
      +'<div class="jh"><b>'+VEH[r.vtype].ic+' '+r.cname+'</b><span class="price">'+money(r.est)+'</span></div>'
      +'<div class="route"><div class="rp"><i class="d a"></i><span>'+r.fromtxt+'</span></div>'
      +'<div class="rp"><i class="d b"></i><span>'+r.totxt+'</span></div></div>'
      +'<div class="jm"><div><b>'+(dd!==null?dd.toFixed(1):'—')+'</b><small>كم عنك</small></div>'
      +'<div><b>'+(+r.km).toFixed(1)+'</b><small>كم الرحلة</small></div>'
      +'<div><b>'+r.pax+'</b><small>راكب</small></div></div>'
      +'<button class="btn y" onclick="take(\''+r.id+'\')">✅ خدها</button></div>').join('');
}
function dist(a,b,c,d){const R=6371,p=Math.PI/180;
  const x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

async function take(id){
  const ok=await sb(()=>api('w_rides?id=eq.'+id+'&status=eq.searching',
    {method:'PATCH',body:JSON.stringify({status:'accepted',driver:me.id,updated_at:new Date().toISOString()})}));
  if(!ok||!ok.length)return say('حدا تاني سبقك');
  say('أخدت الرحلة 🛺'); push(); tick();
}
function active(r){
  if(!mA){ mA=L.marker([r.flat,r.flng],{icon:icon('🟢',30)}).addTo(map);
    mB=L.marker([r.tlat,r.tlng],{icon:icon('📍',34)}).addTo(map);
    line=L.polyline([[r.flat,r.flng],[r.tlat,r.tlng]],{color:'#0E7C3A',weight:4,dashArray:'8 7'}).addTo(map);
    map.fitBounds(line.getBounds().pad(.35)); }
  const st={accepted:['رايح عالزبون','اضغط «وصلت» لما توصل'],
            arrived:['وصلت — مستني الزبون','اضغط «ركب» لما يركب'],
            onboard:['بالطريق للوجهة','اضغط «خلصت» لما توصلوا']}[r.status];
  const nx={accepted:['arrived','📍 وصلت'],arrived:['onboard','🚀 ركب الزبون'],onboard:['done','✅ خلصت الرحلة']}[r.status];
  if($('sheet').dataset.s===r.status+r.id)return; $('sheet').dataset.s=r.status+r.id;
  $('sheet').innerHTML='<div class="grab"></div>'
    +'<h2>'+st[0]+'</h2><div class="sub">'+st[1]+'</div>'
    +'<div class="route"><div class="rp"><i class="d a"></i><span>'+r.fromtxt+'</span></div>'
    +'<div class="rp"><i class="d b"></i><span>'+r.totxt+'</span></div></div>'
    +'<div class="jm"><div><b>'+money(r.est)+'</b><small>ألف</small></div>'
    +'<div><b>'+(+r.km).toFixed(1)+'</b><small>كم</small></div>'
    +'<div><b>'+r.pax+'</b><small>راكب</small></div></div>'
    +'<div class="brow"><a class="btn line" href="tel:'+r.cphone+'">📞 اتصل</a>'
    +'<a class="btn line" href="https://maps.google.com/?daddr='
      +(r.status==='onboard'?r.tlat+','+r.tlng:r.flat+','+r.flng)+'" target="_blank">🧭 الطريق</a></div>'
    +'<button class="btn main" onclick="step(\''+r.id+'\',\''+nx[0]+'\')">'+nx[1]+'</button>'
    +(r.status!=='onboard'?'<button class="btn dang" onclick="cancelRide(\''+r.id+'\')">إلغاء الرحلة</button>':'');
}
async function step(id,s){
  await sb(()=>api('w_rides?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:s,updated_at:new Date().toISOString()})}));
  if(s==='done'){say('خلصت — مبروك 🎉');$('sheet').dataset.s='';}
  tick();
}
async function cancelRide(id){
  if(!confirm('متأكد بدك تلغي الرحلة؟'))return;
  await sb(()=>api('w_rides?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:'searching',driver:null})}));
  $('sheet').dataset.s=''; say('انلغت'); tick();
}

const s=localStorage.getItem('w_drv');
if(s){ me=JSON.parse(s); start(); } else { $('onbar').style.display='none'; regForm(); }
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
