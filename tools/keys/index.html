<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مفاتيح التفعيل | MrElectroAI</title>
<meta name="theme-color" content="#081311">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--void:#081311;--panel:#0F1D1A;--panel-2:#152724;--line:#223B36;
  --volt:#22C79B;--volt-ink:#04140F;--arc:#63E3C2;--text:#E4F0EC;--muted:#7D948E;
  --glow:rgba(34,199,155,.13);--warn:#E8A33D;--danger:#E06B6B;--ok:#4ADE80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--void);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  font-size:15px;line-height:1.65;padding-bottom:40px;
  background-image:linear-gradient(to bottom,var(--glow),transparent 320px)}
:where(button,input,select):focus-visible{outline:2px solid var(--arc);outline-offset:2px}
.bar{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  padding-top:env(safe-area-inset-top)}
.bar-in{max-width:680px;margin:0 auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.lg{display:flex;align-items:center;gap:10px}
.lg span{width:34px;height:34px;border-radius:10px;background:var(--volt);color:var(--volt-ink);
  display:grid;place-items:center;font-size:17px}
.lg b{font-family:'JetBrains Mono',monospace;font-size:13px;display:block;line-height:1.2}
.lg small{font-size:10px;color:var(--muted);display:block}
.wrap{max-width:680px;margin:0 auto;padding:18px 15px}
h1{font-family:'Readex Pro',sans-serif;font-size:24px;margin-bottom:4px}
.lede{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-family:'Readex Pro',sans-serif;font-size:15px;margin-bottom:13px;padding-bottom:10px;
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:500}
input,select{width:100%;font-family:inherit;font-size:15px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:11px;padding:12px 13px}
input:focus,select:focus{border-color:var(--volt)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mb{margin-bottom:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;
  border-radius:12px;font-family:inherit;font-size:14.5px;font-weight:700;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);cursor:pointer;margin-top:9px;text-decoration:none}
.btn.main{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.btn.dang{color:var(--danger);border-color:rgba(224,107,107,.35)}
.btn.sm{width:auto;padding:8px 13px;font-size:12.5px;margin:0}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 5px;text-align:center}
.stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:19px;color:var(--volt)}
.stat span{font-size:10px;color:var(--muted)}
.lic{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}
.lic.off{opacity:.55;border-style:dashed}
.lic.exp{border-color:var(--warn)}
.lh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.code{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--volt);
  background:var(--void);border:1px solid var(--volt);border-radius:9px;padding:6px 11px;cursor:pointer}
.lh b{font-size:14.5px}
.lm{font-size:12px;color:var(--muted);line-height:1.8}
.chip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;margin-inline-end:5px}
.chip.g{background:rgba(74,222,128,.14);color:var(--ok)}
.chip.y{background:rgba(232,163,61,.14);color:var(--warn)}
.chip.r{background:rgba(224,107,107,.14);color:var(--danger)}
.chip.m{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px;line-height:1.9}
.note{font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px dashed var(--warn);
  border-radius:11px;padding:12px;line-height:1.8;margin-top:10px}
.note b{color:var(--warn)}
.lock{position:fixed;inset:0;background:var(--void);display:grid;place-items:center;padding:22px;z-index:80}
.lockbox{width:100%;max-width:330px;text-align:center}
.lockbox .ic{font-size:50px;margin-bottom:12px}
.lockbox h2{font-family:'Readex Pro',sans-serif;font-size:21px;margin-bottom:4px}
.lockbox p{font-size:12.5px;color:var(--muted);margin-bottom:18px}
#pin{text-align:center;font-family:'JetBrains Mono',monospace;letter-spacing:2px}
.perr{font-size:12.5px;color:var(--danger);min-height:20px;margin-top:8px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);
  background:var(--volt);color:var(--volt-ink);font-size:13.5px;font-weight:700;padding:11px 20px;
  border-radius:13px;transition:transform .3s;z-index:900;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.search{margin-bottom:11px}
.pkgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pk{background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;
  cursor:pointer;text-align:center;font-family:inherit;color:var(--text)}
.pk.on{border-color:var(--volt);background:var(--glow)}
.pk.life{grid-column:1/-1;border-color:rgba(232,163,61,.5)}
.pk.life.on{border-color:var(--warn);background:rgba(232,163,61,.12)}
.pk b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.pk .v{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;color:var(--volt)}
.pk.life .v{color:var(--warn)}
.tabs{display:flex;gap:7px;margin-bottom:13px}
.tabs button{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
  padding:11px 6px;font-family:inherit;font-size:13.5px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--volt);color:var(--volt-ink);border-color:var(--volt);font-weight:700}
.pg{display:none}.pg.on{display:block}
</style>
</head>
<body>

<div class="lock" id="lock">
  <div class="lockbox">
    <div class="ic">🔑</div>
    <h2>مفاتيح التفعيل</h2>
    <p>MrElectroAI — لوحة الإدارة</p>
    <input id="pin" type="password" placeholder="كود الإدارة" autocomplete="off">
    <div class="perr" id="perr"></div>
    <button class="btn main" id="enter">دخول</button>
  </div>
</div>

<div class="bar"><div class="bar-in">
  <div class="lg"><span>🔑</span><b>مفاتيح التفعيل<small>MrElectroAI</small></b></div>
  <button class="btn sm" id="out">خروج</button>
</div></div>

<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-t="k" class="on">🔑 المفاتيح</button>
    <button data-t="t">🎁 التجارب</button>
  </div>
  <div class="stat">
    <div><b id="s1">0</b><span>مفتاح</span></div>
    <div><b id="s2">0</b><span>نشط</span></div>
    <div><b id="s3">0</b><span>منتهي</span></div>
    <div><b id="s4">0</b><span>موقوف</span></div>
  </div>

  <div class="pg on" id="pgK">
  <div class="card">
    <h2>➕ مفتاح جديد</h2>
    <div class="two mb">
      <div><label class="lbl">اسم المشترك</label><input id="nName" placeholder="أبو علي — كهربائي"></div>
      <div><label class="lbl">رقم التلفون</label><input id="nPhone" type="tel" placeholder="70xxxxxx"></div>
    </div>
    <div class="mb"><label class="lbl">الأداة</label>
      <select id="nTools">
        <option value="all" selected>🎁 كل الأدوات</option>
        <option value="roof">قياس السطح</option>
        <option value="load">حساب المنظومة</option>
        <option value="inverters">إعدادات الإنفرترات</option>
        <option value="transformer">حاسبة المحوّلات</option>
        <option value="wirephase">توزيع الفازات</option>
      </select></div>
    <label class="lbl">الباقة</label>
    <div class="pkgs" id="pkgs"></div>
    <input type="hidden" id="nDur" value="365">
    <div class="two mb">
      <div><label class="lbl">المبلغ المدفوع ($)</label><input id="nPaid" type="number" inputmode="decimal" placeholder="80"></div>
      <div><label class="lbl">طريقة الدفع</label>
        <select id="nPay"><option>OMT</option><option>Whish</option><option>نقداً</option>
          <option>تحويل بنكي</option><option>لسا ما دفع</option></select></div>
    </div>
    <div class="mb"><label class="lbl">ملاحظة (اختياري)</label><input id="nNote" placeholder="أي تفاصيل إضافية"></div>
    <button class="btn main" id="gen">🔑 ولّد المفتاح</button>
    <div id="genOut"></div>
  </div>

  <div class="card">
    <h2>📋 المفاتيح <span class="chip m" id="cnt">0</span></h2>
    <input id="q" class="search" placeholder="دوّر بالاسم أو الرقم أو المفتاح...">
    <div id="list"></div>
  </div>
  </div>

  <div class="pg" id="pgT">
    <div class="stat">
      <div><b id="t1">0</b><span>تجربة</span></div>
      <div><b id="t2">0</b><span>شغّالة</span></div>
      <div><b id="t3">0</b><span>خلصت</span></div>
      <div><b id="t4">0</b><span>صاروا مشتركين</span></div>
    </div>
    <div class="card"><h2>🎁 التجارب المجانية</h2>
      <div class="note" style="margin:0 0 12px"><b>تابعهم:</b> اللي خلصت تجربته وما تواصلت معه بيطلع بالأحمر.
        اضغط 📲 لتحكيه، وبعدين علّمه كـ«تواصلت».</div>
      <div id="tlist"></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL="https://utjpvjnhffapbwpbkkuc.supabase.co";
const SB_KEY="sb_publishable_wSY0Oa0SmW_Ipgaerw-zCA_CM_PZQvK";
const PIN="71736401ANWAR";
const WA="96179434479";
const TOOLS={all:'كل الأدوات',roof:'قياس السطح',transformer:'المحوّلات',
  inverters:'الإنفرترات',load:'حساب المنظومة',wirephase:'توزيع الفازات'};
const PRICE={
  roof:{m:10,q:25,y:80,L:200}, load:{m:10,q:25,y:80,L:200},
  inverters:{m:8,q:20,y:60,L:150}, transformer:{m:8,q:20,y:60,L:150},
  wirephase:{m:5,q:12,y:35,L:90}, all:{m:25,q:60,y:180,L:450}
};
const PKG={m:['شهر',30],q:['3 شهور',90],y:['سنة',365],L:['مدى الحياة',0]};

const $=i=>document.getElementById(i);
let DB=[];
function say(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}
async function api(p,o={}){const r=await fetch(SB_URL+'/rest/v1/'+p,{...o,headers:{apikey:SB_KEY,
  Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})}});
  if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json();}
const sb=async fn=>{try{return await fn()}catch(e){say('ما قدرنا نتصل');return null}};

$('enter').onclick=()=>{if($('pin').value.trim()!==PIN){$('perr').textContent='كود غلط';$('pin').value='';return;}
  sessionStorage.setItem('mea_adm','1');$('lock').style.display='none';load();};
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
$('out').onclick=()=>{sessionStorage.removeItem('mea_adm');location.reload()};
if(sessionStorage.getItem('mea_adm')){$('lock').style.display='none';load();}
drawPkgs();

let pkg='y';
function drawPkgs(){
  const t=$('nTools').value, P=PRICE[t]||PRICE.all;
  $('pkgs').innerHTML=['m','q','y'].map(k=>'<button class="pk'+(pkg===k?' on':'')+'" data-k="'+k+'">'
    +'<b>'+PKG[k][0]+'</b><span class="v">'+P[k]+'$</span></button>').join('')
    +'<button class="pk life'+(pkg==='L'?' on':'')+'" data-k="L"><b>💎 مدى الحياة</b>'
    +'<span class="v">'+P.L+'$</span></button>';
  $('nPaid').value=P[pkg];
  $('nDur').value=PKG[pkg][1];
}
$('pkgs').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;pkg=b.dataset.k;drawPkgs();};
$('nTools').onchange=drawPkgs;

function newCode(){
  const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const p=n=>Array.from({length:n},()=>C[Math.floor(Math.random()*C.length)]).join('');
  return 'MEA-'+p(4)+'-'+p(4);
}
$('gen').onclick=async()=>{
  const n=$('nName').value.trim();
  if(!n)return say('اكتب اسم المشترك');
  const days=+$('nDur').value;
  const exp=days?new Date(Date.now()+days*864e5).toISOString().slice(0,10):null;
  const code=newCode();
  $('gen').disabled=true;
  const paid=$('nPaid').value.trim(), pay=$('nPay').value;
  const note=[paid?paid+'$ · '+pay:pay, $('nNote').value.trim()].filter(Boolean).join(' · ');
  const r=await sb(()=>api('licenses',{method:'POST',body:JSON.stringify([{code,name:n,
    phone:$('nPhone').value.trim(),note,tools:$('nTools').value,
    expires:exp,active:true}])}));
  $('gen').disabled=false;
  if(!r)return;
  const ph=$('nPhone').value.trim();
  const msg=waMsg({code,name:n,expires:exp,tools:$('nTools').value,paid,pay});
  $('nName').value='';$('nPhone').value='';$('nNote').value='';$('nPaid').value='';
  $('genOut').innerHTML='<div class="note" style="border-color:var(--volt);border-style:solid">'
    +'<b style="color:var(--volt)">✅ المفتاح جاهز</b><br>'
    +'<span class="code" onclick="cp(\''+code+'\')" style="display:inline-block;margin:9px 0;font-size:18px">'+code+'</span><br>'
    +(ph?'رح ينفتح واتساب على رقم <b style="color:var(--text)">'+ph+'</b> والرسالة معبّاية — بس اضغط إرسال.'
       :'⚠️ ما حطّيت رقم — انسخ المفتاح وابعتو يدوياً.')+'</div>'
    +'<a class="btn main" target="_blank" href="'+waLink(ph,msg)+'">📲 '+(ph?'ابعت لـ '+ph:'ابعت على واتساب')+'</a>';
  load();
};
function waLink(phone,msg){
  const p=(phone||'').replace(/\D/g,'').replace(/^0/,'');
  const full=p?('961'+p):'';
  return 'https://wa.me/'+full+'?text='+encodeURIComponent(msg);
}
function waMsg(L){
  const t=TOOLS[L.tools]||L.tools;
  let m='🔑 *مفتاح تفعيل أدوات MrElectroAI*\n';
  m+='━━━━━━━━━━━━━━━\n';
  m+='المشترك: '+L.name+'\n';
  m+='*المفتاح:* '+L.code+'\n';
  m+='الأدوات: '+t+'\n';
  m+='الصلاحية: '+(L.expires?'حتى '+L.expires:'دائم — بدون انتهاء')+'\n';
  if(L.paid) m+='الباقة: '+L.paid+'$ · '+(L.pay||'')+'\n';
  m+='━━━━━━━━━━━━━━━\n';
  m+='*كيف تفعّل؟*\n';
  m+='1. افتح رابط الأداة\n';
  m+='2. بتطلعلك شاشة التفعيل\n';
  m+='3. حطّ المفتاح واضغط تفعيل\n';
  m+='4. خلص — بيضل مفتوح لعندك\n\n';
  m+='⚠️ المفتاح بينربط بجهازك الأول. إذا بدّلت موبايل تواصل معي وبفكّو.\n\n';
  m+='🔗 الأدوات:\nhttps://mrelectroai-spec.github.io/mrelectroai/\n\n';
  m+='أي سؤال أنا جاهز 👍\nأنور الحسن الجاسم — MrElectroAI\n+961 79 434 479';
  return m;
}
function cp(t){navigator.clipboard.writeText(t).then(()=>say('انتسخ المفتاح'));}

$('q').addEventListener('input',draw);
async function load(){
  const r=await sb(()=>api('licenses?select=*&order=created_at.desc'));
  if(!r)return; DB=r; draw();
}
function status(L){
  if(!L.active)return['موقوف','r'];
  if(L.expires&&new Date(L.expires)<new Date(new Date().toDateString()))return['منتهي','y'];
  return['نشط','g'];
}
function draw(){
  const q=$('q').value.trim();
  let L=DB;
  if(q)L=DB.filter(x=>(x.code+' '+x.name+' '+(x.phone||'')+' '+(x.note||'')).includes(q));
  $('s1').textContent=DB.length;
  $('s2').textContent=DB.filter(x=>status(x)[0]==='نشط').length;
  $('s3').textContent=DB.filter(x=>status(x)[0]==='منتهي').length;
  $('s4').textContent=DB.filter(x=>!x.active).length;
  $('cnt').textContent=L.length;
  $('list').innerHTML=L.length?L.map(x=>{
    const [st,cl]=status(x);
    return '<div class="lic'+(!x.active?' off':'')+(st==='منتهي'?' exp':'')+'">'
      +'<div class="lh"><b>'+x.name+'</b>'
      +'<span class="code" onclick="cp(\''+x.code+'\')">'+x.code+'</span></div>'
      +'<div class="lm"><span class="chip '+cl+'">'+st+'</span>'
      +'<span class="chip m">'+(TOOLS[x.tools]||x.tools)+'</span>'
      +(x.expires?'<span class="chip m">حتى '+x.expires+'</span>':'<span class="chip m">دائم</span>')
      +(x.device?'<span class="chip m">🔒 مربوط بجهاز</span>':'<span class="chip m">لسا ما انفعّل</span>')
      +'<br>'+(x.phone||'—')+(x.note?' · '+x.note:'')
      +(x.last_seen?'<br>آخر استعمال: '+new Date(x.last_seen).toLocaleDateString('ar-LB')+' · '+(x.uses||0)+' مرة':'')
      +'</div>'
      +'<div class="acts">'
      +'<button class="btn sm" onclick="tog(\''+x.code+'\','+(!x.active)+')">'+(x.active?'⏸️ إيقاف':'▶️ تفعيل')+'</button>'
      +'<button class="btn sm" onclick="unbind(\''+x.code+'\')">🔓 فكّ الجهاز</button>'
      +'<button class="btn sm" onclick="extend(\''+x.code+'\')">📅 تمديد سنة</button>'
      +'<a class="btn sm" target="_blank" href="'+waLink(x.phone,waMsg(x))+'">📲 ابعت</a>'
      +'<button class="btn sm dang" onclick="del(\''+x.code+'\')">🗑️</button>'
      +'</div></div>';
  }).join(''):'<div class="empty">ما في مفاتيح بعد.</div>';
}
let TR=[], tab='k';
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;
  tab=b.dataset.t;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));
  $('pgK').classList.toggle('on',tab==='k');$('pgT').classList.toggle('on',tab==='t');
  document.querySelectorAll('.stat')[0].style.display = tab==='k'?'grid':'none';
  if(tab==='t')loadTrials();};

async function loadTrials(){
  const r=await sb(()=>api('trials?select=*&order=started.desc&limit=200'));
  if(!r)return; TR=r; drawTrials();
}
function drawTrials(){
  const now=new Date();
  const live=TR.filter(t=>new Date(t.ends)>now);
  $('t1').textContent=TR.length;
  $('t2').textContent=live.length;
  $('t3').textContent=TR.length-live.length;
  $('t4').textContent=TR.filter(t=>t.converted).length;
  $('tlist').innerHTML=TR.length?TR.map(t=>{
    const on=new Date(t.ends)>now;
    const days=Math.ceil((new Date(t.ends)-now)/864e5);
    const need=!on&&!t.contacted&&!t.converted;
    return '<div class="lic'+(need?' exp':'')+(t.converted?'':'')+'">'
      +'<div class="lh"><b>'+t.name+'</b>'
      +'<span class="chip '+(t.converted?'g':on?'g':need?'r':'m')+'">'
        +(t.converted?'✅ مشترك':on?'شغّالة · '+days+' يوم':need?'⚠️ محتاج متابعة':'خلصت')+'</span></div>'
      +'<div class="lm">📱 '+t.phone+' · '+(TOOLS[t.tool]||t.tool||'—')
      +'<br>بلّشت: '+new Date(t.started).toLocaleDateString('ar-LB')
      +' · بتخلص: '+new Date(t.ends).toLocaleDateString('ar-LB')
      +(t.note?'<br>'+t.note:'')+'</div>'
      +'<div class="acts">'
      +'<a class="btn sm" target="_blank" href="'+waLink(t.phone,followMsg(t))+'">📲 حكيه</a>'
      +(!t.contacted?'<button class="btn sm" onclick="mark(\''+t.id+'\',\'contacted\')">✅ تواصلت</button>':'')
      +(!t.converted?'<button class="btn sm main" onclick="conv(\''+t.id+'\',\''+t.name+'\',\''+t.phone+'\')">🔑 اعملو مفتاح</button>':'')
      +'<button class="btn sm dang" onclick="delTr(\''+t.id+'\')">🗑️</button>'
      +'</div></div>';
  }).join(''):'<div class="empty">ما في تجارب بعد.<br>لما حدا يجرّب أداة، بيطلع هون باسمه ورقمه.</div>';
}
function followMsg(t){
  const on=new Date(t.ends)>new Date();
  return 'مرحبا '+t.name+' 👋\n\nأنا أنور من MrElectroAI.\n'
    +(on?'شفت إنك عم تجرّب '+(TOOLS[t.tool]||'الأداة')+' — كيف لاقيتها؟'
        :'خلصت تجربتك المجانية لـ'+(TOOLS[t.tool]||'الأداة')+'. كيف كانت معك؟')
    +'\n\nإذا عجبتك، بقدر أعطيك مفتاح كامل يفتحلك كل الأدوات.\n'
    +'وإذا في شي ناقص أو مزعج، احكيلي وبعدّلو 👍';
}
async function mark(id,f){await sb(()=>api('trials?id=eq.'+id,{method:'PATCH',body:JSON.stringify({[f]:true})}));
  say('انعلّم');loadTrials();}
async function conv(id,name,phone){
  await sb(()=>api('trials?id=eq.'+id,{method:'PATCH',body:JSON.stringify({converted:true,contacted:true})}));
  $('nName').value=name;$('nPhone').value=phone;
  tab='k';[...$('tabs').children].forEach((x,i)=>x.classList.toggle('on',i===0));
  $('pgK').classList.add('on');$('pgT').classList.remove('on');
  document.querySelectorAll('.stat')[0].style.display='grid';
  say('عبّينالك بياناتو — ولّد المفتاح');window.scrollTo({top:0,behavior:'smooth'});
}
async function delTr(id){if(!confirm('حذف هالتجربة؟'))return;
  await sb(()=>api('trials?id=eq.'+id,{method:'DELETE'}));loadTrials();}

async function tog(c,v){await sb(()=>api('licenses?code=eq.'+c,{method:'PATCH',body:JSON.stringify({active:v})}));
  say(v?'انفعّل':'انوقف');load();}
async function unbind(c){await sb(()=>api('licenses?code=eq.'+c,{method:'PATCH',body:JSON.stringify({device:null})}));
  say('انفكّ من الجهاز — بيقدر يفعّلو من جهاز تاني');load();}
async function extend(c){
  const L=DB.find(x=>x.code===c);
  const base=L.expires&&new Date(L.expires)>new Date()?new Date(L.expires):new Date();
  const exp=new Date(base.getTime()+365*864e5).toISOString().slice(0,10);
  await sb(()=>api('licenses?code=eq.'+c,{method:'PATCH',body:JSON.stringify({expires:exp,active:true})}));
  say('تمدّد حتى '+exp);load();}
async function del(c){if(!confirm('متأكد بدك تحذف المفتاح '+c+'؟'))return;
  await sb(()=>api('licenses?code=eq.'+c,{method:'DELETE'}));say('انحذف');load();}
</script>
