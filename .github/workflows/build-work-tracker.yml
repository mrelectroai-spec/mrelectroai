name: Build Signed Work Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/work-tracker/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js & Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Initialize Capacitor Project
        run: |
          mkdir -p cap-app/www
          cp -r tools/work-tracker/* cap-app/www/
          cd cap-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "WorkTracker" "com.mrelectroai.worktracker" --web-dir www
          sed -i 's/"webDir": "www"/"webDir": "www", "server": { "url": "https:\/\/mrelectroai-spec.github.io\/mrelectroai\/tools\/work-tracker\/", "cleartext": true }/' capacitor.config.json
          npx cap add android

      - name: 5. Inject Android Permissions
        run: |
          MANIFEST="cap-app/android/app/src/main/AndroidManifest.xml"
          PERMS='<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" /><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /><uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" /><uses-permission android:name="android.permission.WAKE_LOCK" />'
          sed -i "/<\/manifest>/i $PERMS" "$MANIFEST"

      - name: 6. Configure MainActivity (Auto-Ask Permissions & Keep Screen On)
        run: |
          MAIN_ACT=$(find cap-app/android/app/src/main/java -name "MainActivity.java")
          cat << 'EOF' > "$MAIN_ACT"
          package com.mrelectroai.worktracker;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      requestPermissions(new String[]{
                          Manifest.permission.ACCESS_FINE_LOCATION,
                          Manifest.permission.ACCESS_COARSE_LOCATION,
                          Manifest.permission.RECORD_AUDIO
                      }, 101);
                  }
                  this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });
              }
          }
          EOF

      - name: 7. Build & Sign APK
        run: |
          cd cap-app/android
          chmod +x gradlew
          keytool -genkey -v -keystore release-key.keystore -alias mrelectroai -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Anwar, OU=MrElectroAI, O=MrElectroAI, L=Beirut, S=Beirut, C=LB"
          ./gradlew assembleRelease
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release-key.keystore --ks-pass pass:123456 --key-pass pass:123456 --out WorkTracker-Signed.apk app-aligned.apk

      - name: 8. Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkTracker-Signed-APK
          path: cap-app/android/WorkTracker-Signed.apk
