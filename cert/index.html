<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شهادة | MrElectroAI</title>
<meta name="description" content="شهادة إتمام كورس من MrElectroAI · أنور الجاسم. امسح الرمز لتتأكد إنها صحيحة.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06110e">
<link rel="icon" href="../app/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Readex Pro',system-ui,sans-serif;background:#0b1512;color:#e9f3ef;min-height:100vh;padding:16px}
.bar{max-width:900px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ok{flex:1;min-width:220px;padding:10px 14px;border-radius:14px;background:rgba(34,199,155,.16);border:1px solid rgba(34,199,155,.5);font-size:14px;font-weight:600}
.bad{background:rgba(229,72,77,.15);border-color:rgba(229,72,77,.5)}
.b{padding:11px 16px;border-radius:14px;background:#22C79B;color:#03140f;font:inherit;font-weight:700;border:0;cursor:pointer;text-decoration:none;font-size:14.5px}
.b.alt{background:#1b2a25;color:#e9f3ef;border:1px solid #2c4a40}
.wrap{max-width:900px;margin:0 auto;overflow-x:auto}
/* الشهادة: A4 بالعرض */
.cert{position:relative;width:1123px;height:794px;transform-origin:top right;background:#fffdf7;color:#14211c;border-radius:6px;overflow:hidden;box-shadow:0 20px 60px #0008}
.cert:before{content:'';position:absolute;inset:18px;border:3px solid #22C79B;border-radius:4px}
.cert:after{content:'';position:absolute;inset:28px;border:1px solid #c9a227;border-radius:2px}
.in{position:absolute;inset:50px 70px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;direction:ltr}
.logo i{width:48px;height:48px;border-radius:13px;background:#0e1f1a;display:grid;place-items:center}
.t1{font-family:'Aref Ruqaa',serif;font-size:62px;color:#0e7a5f;margin-top:16px;line-height:1.2}
.t2{font-size:19px;color:#5b6b65;margin-top:4px}
.name{font-size:50px;font-weight:700;margin-top:22px;padding:0 30px 6px;border-bottom:2px solid #c9a227;min-width:420px}
.txt{font-size:20px;line-height:1.9;margin-top:18px;color:#2a3a34;max-width:820px}
.txt b{color:#0e7a5f}
.stats{display:flex;gap:16px;margin-top:16px}
.stats div{padding:8px 18px;border-radius:12px;background:#eef8f4;border:1px solid #cfe9df;font-size:16px}
.stats b{font-size:20px;color:#0e7a5f}
.foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end}
.sig{text-align:center;width:300px}
.sig .s{font-family:'Aref Ruqaa',serif;font-size:36px;color:#14211c;line-height:1}
.sig .l{border-top:1.5px solid #14211c;margin-top:6px;padding-top:6px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.sig small{display:block;font-size:13px;color:#5b6b65}
.qr{text-align:center;font-size:12px;color:#5b6b65;direction:ltr}
.qr #q{background:#fff;padding:6px;border:1px solid #ddd;border-radius:6px;display:inline-block}
.seal{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#e6c35a,#c9a227 70%);display:grid;place-items:center;color:#5a4300;font-weight:700;font-size:15px;text-align:center;line-height:1.3;box-shadow:inset 0 0 0 5px #fff6,0 6px 14px #0003}
.msg{max-width:520px;margin:60px auto;text-align:center;font-size:16px;line-height:1.9}
@media print{
 @page{size:A4 landscape;margin:0}
 body{background:#fff;padding:0}.bar{display:none}.wrap{overflow:visible;max-width:none}
 .cert{transform:none!important;box-shadow:none;border-radius:0;width:297mm;height:210mm}
}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <div class="ok" id="ver">✅ شهادة صحيحة، صادرة عن MrElectroAI</div>
  <button class="b" id="pdf" type="button">🖨️ احفظ PDF</button>
  <a class="b alt" id="wa" target="_blank" rel="noopener">📲 شارك</a>
</div>
<div class="wrap" id="wrap" hidden>
  <div class="cert" id="cert">
    <div class="in">
      <div class="logo"><i><svg width="28" height="28" viewBox="0 0 24 24"><path fill="#22C79B" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></i>MrElectroAI</div>
      <div class="t1">شهادة إتمام</div>
      <div class="t2">بتشهد MrElectroAI إنو</div>
      <div class="name" id="nm"></div>
      <p class="txt" id="tx"></p>
      <div class="stats"><div>الفهم <b id="ac"></b></div><div>الأغلاط <b id="mi"></b></div><div>التاريخ <b id="dt"></b></div></div>
      <div class="foot">
        <div class="qr"><div id="q"></div><div style="margin-top:4px">رقم الشهادة <b id="cd"></b></div></div>
        <div class="seal">🎓<br>بإشراف<br>أنور الجاسم</div>
        <div class="sig"><div class="s">أنور الجاسم</div><div class="l">أنور الحسن الجاسم <svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1D9BF0"/><path fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M7.6 12.4l3 3 5.8-6.2"/></svg></div><small>كهربجي ومدرّب · 13 سنة خبرة</small></div>
      </div>
    </div>
  </div>
</div>
<div class="msg" id="msg">⏳</div>
<script>
(function(){
var SBU='https://utjpvjnhffapbwpbkkuc.supabase.co',SBK='sb_publishable_wSY0Oa0SmW_Ipgaerw-zCA_CM_PZQvK';
var CN={electro:['كورس الكهربا','الكهرباء بالمختصر المفيد',18],classic:['كورس الكلاسيك كنترول','الكلاسيك كنترول بالمختصر المفيد',25],solar:['كورس الطاقة الشمسية','الطاقة الشمسية بالمختصر المفيد',32]};
var code=(new URLSearchParams(location.search).get('c')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
var $=function(i){return document.getElementById(i);};
function fit(){var w=$('wrap').clientWidth,c=$('cert');var s=Math.min(1,w/1123);c.style.transform='scale('+s+')';$('wrap').style.height=(794*s)+'px';}
if(!code){$('msg').textContent='ما في رقم شهادة.';return;}
fetch(SBU+'/rest/v1/rpc/cert_get',{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})})
.then(function(r){return r.json();}).then(function(j){
 if(!j||!j.ok){$('msg').innerHTML='❌ ما لقينا شهادة بهالرقم <b dir="ltr">'+code+'</b>.<br>يا إمّا الرقم غلط، يا إمّا الشهادة لسّا ما انوافق عليها.';$('bar').hidden=false;$('ver').className='ok bad';$('ver').textContent='❌ شهادة مش موجودة';$('pdf').hidden=true;$('wa').hidden=true;return;}
 var c=CN[j.course]||['الكورس','',0];
 document.title='شهادة '+j.name+' | MrElectroAI';
 $('nm').textContent=j.name;
 $('tx').innerHTML='خلّص <b>'+c[0]+'</b> ('+c[2]+' قاعدة) المبني على كتاب «'+c[1]+'»، ونجح بأسئلة كل القواعد بتفوّق.';
 $('ac').textContent=(j.accuracy!=null?j.accuracy:'—')+'%';$('mi').textContent=j.mistakes;$('dt').textContent=String(j.date).split('-').reverse().join('/');
 $('cd').textContent=j.code;
 try{new QRCode($('q'),{text:location.origin+location.pathname+'?c='+j.code,width:92,height:92,correctLevel:QRCode.CorrectLevel.M});}catch(e){}
 $('ver').textContent='✅ شهادة صحيحة: '+j.name+' · '+c[0];
 $('wa').href='https://wa.me/?text='+encodeURIComponent('🎓 خلّصت '+c[0]+' مع أنور الجاسم!\nشهادتي: '+location.origin+location.pathname+'?c='+j.code);
 $('msg').hidden=true;$('bar').hidden=false;$('wrap').hidden=false;fit();})
.catch(function(){$('msg').textContent='ما قدرنا نوصل. تأكد من الإنترنت.';});
$('pdf').onclick=function(){window.print();};
window.addEventListener('resize',function(){if(!$('wrap').hidden)fit();});
})();
</script>
<script src="../t.js" data-page="cert" defer></script>
</body>
</html>
