<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد المستوى والاهتمامات | MrElectroAI ⚡</title>
    <meta name="theme-color" content="#081311">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* نفس ألوان موقع MrElectroAI */
            --bg-dark: #070F0D;
            --card-bg: #0E1A17;
            --item-bg: #14241F;
            --electric-blue: #22C79B;
            --neon-blue-glow: rgba(34, 199, 155, 0.25);
            --gold: #22C79B;
            --gold-glow: rgba(34, 199, 155, 0.3);
            --text-light: #E8F2EE;
            --text-muted: #7B928C;
            --border-color: #1E332D;
            --danger: #F06A6A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 85% 5%, rgba(34, 199, 155, 0.14) 0%, transparent 45%);
            color: var(--text-light);
            padding: 12px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            margin: 10px auto;
            padding: 20px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(34, 199, 155, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
            background: linear-gradient(110deg, #22C79B, #63E3C2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        /* تنبيه الخطأ */
        .error-toast {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* نظام الواجهات المغلقة (Accordion) */
        .accordion-item {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .accordion-item.active {
            border-color: var(--electric-blue);
            box-shadow: 0 0 15px rgba(34, 199, 155, 0.15);
        }

        .accordion-item.completed {
            border-color: rgba(34, 199, 155, 0.45);
        }

        .accordion-item.error-border {
            border-color: var(--danger);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }

        .accordion-header {
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(34, 199, 155, 0.12);
            border: 1px solid var(--electric-blue);
            color: var(--electric-blue);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .accordion-item.completed .step-num {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
        }

        .question-text {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-light);
            white-space: nowrap;
        }

        .selected-preview {
            font-size: 12px;
            color: var(--gold);
            background: rgba(34, 199, 155, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: auto;
            margin-left: 8px;
            display: none;
        }

        .accordion-item.completed .selected-preview {
            display: inline-block;
        }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 12px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .accordion-item.active .arrow-icon {
            transform: rotate(180deg);
            color: var(--electric-blue);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(7, 15, 13, 0.6);
        }

        .accordion-content {
            padding: 12px 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-light);
            font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
            font-size: 14.5px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--electric-blue);
            box-shadow: 0 0 10px var(--neon-blue-glow);
        }

        /* خيارات الكبس */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .options-grid.two-cols {
            grid-template-columns: 1fr 1fr;
        }

        .option-item {
            position: relative;
        }

        .option-item input {
            position: absolute;
            opacity: 0;
            height: 0;
            width: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 13px;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .option-item input:checked ~ .option-label {
            background: rgba(34, 199, 155, 0.14);
            border-color: var(--electric-blue);
            box-shadow: 0 0 10px var(--neon-blue-glow);
            color: #fff;
        }

        .indicator {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-item input:checked ~ .option-label .indicator {
            border-color: var(--gold);
            background-color: var(--gold);
        }

        .option-item input:checked ~ .option-label .indicator::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 11px;
            font-weight: 900;
        }

        .submit-btn {
            width: 100%;
            background: #22C79B;
            color: #031310;
            border: none;
            padding: 14px;
            font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(34, 199, 155, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .home-link { display: inline-block; text-decoration: none; }
        .next-btn {
            margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px; cursor: pointer;
            background: transparent; border: 1px solid var(--electric-blue); color: var(--electric-blue);
            font-family: inherit; font-size: 14px; font-weight: 700;
        }
        /* نتيجة بعد الإرسال */
        .result { text-align: center; }
        .result h2 { font-family: 'Readex Pro', sans-serif; font-size: 22px; margin: 6px 0 8px; }
        .result p { color: var(--text-muted); font-size: 14px; line-height: 1.8; margin-bottom: 14px; }
        .rec { background: var(--item-bg); border: 1px solid var(--electric-blue); border-radius: 16px; padding: 16px; margin: 14px 0; text-align: right; }
        .rec .top { display: flex; gap: 14px; align-items: flex-start; }
        .rec img { width: 92px; border-radius: 10px; border: 1px solid var(--border-color); flex-shrink: 0; }
        .rec h3 { font-family: 'Readex Pro', sans-serif; font-size: 17px; margin-bottom: 4px; }
        .rec .why { color: var(--text-muted); font-size: 13px; line-height: 1.75; }
        .rec .price { margin: 10px 0 2px; font-family: 'JetBrains Mono', monospace; display: flex; align-items: baseline; gap: 10px; }
        .rec .price b { font-size: 26px; color: #22C79B; }
        .rec .price s { color: var(--text-muted); margin-inline-start: 10px; }
        .rec .promo { font-size: 12px; color: #E8A33D; }
        .buy-btn { display: block; text-decoration: none; text-align: center; background: #22C79B; color: #031310; font-weight: 800; padding: 13px; border-radius: 12px; margin-top: 12px; }
        .ghost-btn { display: block; text-decoration: none; text-align: center; color: var(--text-muted); font-size: 13px; padding: 10px; margin-top: 6px; text-decoration: underline; text-underline-offset: 4px; }
        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a class="home-link" href="./" aria-label="MrElectroAI — الصفحة الرئيسية"><div class="brand-title">MrElectroAI ⚡</div></a>
        <div class="subtitle">نقّي جوابك، ومنقلك لحالنا عالسؤال يلي بعدو</div>
    </div>

    <div id="errorToast" class="error-toast">⚠️ عبّي كل الخانات قبل ما تبعت.</div>

    <form id="electroForm" onsubmit="return false;">

        <!-- 1. الاسم والمنطقة -->
        <div class="accordion-item active" id="step-1">
            <div class="accordion-header" onclick="toggleStep(1)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-1">1</span>
                    <span class="question-text">👤 الاسم والمنطقة</span>
                    <span class="selected-preview" id="preview-1"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body" style="max-height: 170px;">
                <div class="accordion-content">
                    <input type="text" id="fullName" placeholder="اكتب اسمك ومنطقتك (مثال: أحمد - بيروت)" oninput="handleNameInput()" onkeydown="handleNameKey(event)">
                    <button type="button" class="next-btn" onclick="nameNext()">التالي</button>
                </div>
            </div>
        </div>

        <!-- 2. الفئة العمرية -->
        <div class="accordion-item" id="step-2">
            <div class="accordion-header" onclick="toggleStep(2)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-2">2</span>
                    <span class="question-text">🎂 الفئة العمرية</span>
                    <span class="selected-preview" id="preview-2"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid two-cols">
                        <label class="option-item">
                            <input type="radio" name="age" value="أقل من 20 سنة" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>أقل من 20</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="من 20 لـ 29 سنة" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>20 لـ 29</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="من 30 لـ 39 سنة" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>30 لـ 39</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="40 سنة وطالع" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>40 وطالع</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. سنوات الخبرة -->
        <div class="accordion-item" id="step-3">
            <div class="accordion-header" onclick="toggleStep(3)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-3">3</span>
                    <span class="question-text">⏳ سنوات الخبرة بالكهرباء</span>
                    <span class="selected-preview" id="preview-3"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="experience" value="مبتدئ من الصفر (ما عندي فكرة)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>مبتدئ من الصفر (ما عندي فكرة)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="هاوي (بعرف شغلات بسيطة)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>هاوي (بعرف شغلات بسيطة)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="أقل من سنتين (عم أتعلم بالورش)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>أقل من سنتين (عم أتعلم بالورش)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="من 2 إلى 5 سنوات (فني شغال)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>من 2 إلى 5 سنوات (فني شغال)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="أكثر من 5 سنوات (معلم / بروفيشنال)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>أكثر من 5 سنوات (معلم / بروفيشنال)</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. المهارات الحالية -->
        <div class="accordion-item" id="step-4">
            <div class="accordion-header" onclick="toggleStep(4)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-4">4</span>
                    <span class="question-text">🛠️ شو بتشتغل حالياً؟</span>
                    <span class="selected-preview" id="preview-4"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="ولا شي (بعدني بالبداية)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>🆕 ولا شي (بعدني بالبداية)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="تمديدات منزلية وصيانة" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>🔌 تمديدات منزلية وصيانة عامة</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="طاقة شمسية وانفرترات (Solar)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>☀️ طاقة شمسية وانفرترات (Solar)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="كلاسيك كنترول ولوحات ATS" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>⚙️ كلاسيك كنترول ولوحات ATS</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="منازل ذكية (Smart Home)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>🏠 منازل ذكية (Smart Home)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="بتشتغل بأكثر من مجال (شامل)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>⚡ بشتغل بأكثر من مجال (شامل)</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. المجالات المطلوبة للتطوير -->
        <div class="accordion-item" id="step-5">
            <div class="accordion-header" onclick="toggleStep(5)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-5">5</span>
                    <span class="question-text">🎯 بشو حابب تطور حالك؟</span>
                    <span class="selected-preview" id="preview-5"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="أساسيات الكهرباء من الصفر" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>⚡ أساسيات الكهرباء من الصفر</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="احتراف الطاقة الشمسية والانفرترات" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>🔋 احتراف الطاقة الشمسية والانفرترات</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="الكلاسيك كنترول وتجميع اللوحات" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>🎛️ الكلاسيك كنترول وتجميع اللوحات</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="السمارت هوم والأنظمة الذكية" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>📱 السمارت هوم والأنظمة الذكية</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="شامل (كل المجالات من الصفر للاحتراف)" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>🔥 شامل (كل المجالات من الصفر للاحتراف)</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 6. طريقة التعلم المفضلة -->
        <div class="accordion-item" id="step-6">
            <div class="accordion-header" onclick="toggleStep(6)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-6">6</span>
                    <span class="question-text">📘 كيف بتحب تتعلّم؟</span>
                    <span class="selected-preview" id="preview-6"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="كتب وأدلة PDF مختصرة وعملية" onclick="autoAdvance(6, this.value)">
                            <span class="option-label"><span>📄 كتب وأدلة PDF مختصرة وعملية</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="فيديوهات مسجلة وشروحات" onclick="autoAdvance(6, this.value)">
                            <span class="option-label"><span>🎥 فيديوهات مسجلة وشروحات</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="تدريب عملي حضوري / كورس مباشر" onclick="autoAdvance(6, this.value)">
                            <span class="option-label"><span>🛠️ تدريب عملي حضوري / كورس مباشر</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <button type="button" class="submit-btn" onclick="sendToWhatsApp()">
            <span>شوف نتيجتك</span>
            <span>📲</span>
        </button>

        <div class="footer-note">MrElectroAI © جميع الحقوق محفوظة</div>
    </form>
</div>

<script>
    const PHONE = "96179434479";
    // الخبرة: 0 مبتدئ من الصفر، 1 هاوي، 2 أقل من سنتين، 3 من 2 لـ 5، 4 أكتر من 5
    const LEVEL = {
        'مبتدئ من الصفر (ما عندي فكرة)': 0,
        'هاوي (بعرف شغلات بسيطة)': 1,
        'أقل من سنتين (عم أتعلم بالورش)': 2,
        'من 2 إلى 5 سنوات (فني شغال)': 3,
        'أكثر من 5 سنوات (معلم / بروفيشنال)': 4
    };
    const NOTHING = 'ولا شي (بعدني بالبداية)';
    const BASICS = 'أساسيات الكهرباء من الصفر';
    const ALL_BEGIN = 'شامل (كل المجالات من الصفر للاحتراف)';
    const ALL_PRO = 'شامل (تعمّق بكل المجالات)';

    // سعر الكتاب: 10$، وخصم 9$ لحد ليل 1 تشرين التاني 2026
    const PROMO_END = new Date('2026-11-01T23:59:59+02:00');
    const promoOn = () => new Date() < PROMO_END;
    const bookPrice = () => promoOn() ? 9 : 10;

    function toggleStep(stepNumber) {
        const nameVal = document.getElementById('fullName').value.trim();
        if (nameVal.length >= 2) markCompleted(1, nameVal);
        document.querySelectorAll('.accordion-item').forEach((item, index) => {
            const body = item.querySelector('.accordion-body');
            if (index + 1 === stepNumber) {
                item.classList.add('active');
                item.classList.remove('error-border');
                body.style.maxHeight = body.scrollHeight + "px";
            } else {
                item.classList.remove('active');
                body.style.maxHeight = null;
            }
        });
    }

    function markCompleted(stepNumber, previewText) {
        const item = document.getElementById(`step-${stepNumber}`);
        const preview = document.getElementById(`preview-${stepNumber}`);
        const numBadge = document.getElementById(`num-${stepNumber}`);
        if (previewText) {
            item.classList.add('completed');
            item.classList.remove('error-border');
            preview.textContent = previewText;
            numBadge.textContent = "✓";
            document.getElementById('errorToast').style.display = 'none';
        } else {
            item.classList.remove('completed');
            preview.textContent = "";
            numBadge.textContent = stepNumber;
        }
    }

    // الاسم: ما منقلو لحالو وهوّي عم يكتب، بس بزر «التالي» أو Enter
    function handleNameInput() {
        markCompleted(1, document.getElementById('fullName').value.trim());
    }
    function nameNext() {
        const val = document.getElementById('fullName').value.trim();
        if (val.length < 2) { showError(1, "⚠️ اكتب اسمك ومنطقتك (الخانة 1)"); return; }
        markCompleted(1, val);
        toggleStep(2);
    }
    function handleNameKey(e) {
        if (e.key === 'Enter') { e.preventDefault(); nameNext(); }
    }

    function optionLabel(name, value) {
        const input = document.querySelector(`input[name="${name}"][value="${value}"]`);
        return input ? input.closest('label') : null;
    }
    function setVisible(name, value, show) {
        const label = optionLabel(name, value);
        if (!label) return;
        label.style.display = show ? '' : 'none';
        const input = label.querySelector('input');
        if (!show && input.checked) {
            input.checked = false;
            markCompleted(name === 'currentSkills' ? 4 : 5, '');
        }
    }

    // الأجوبة لازم تركب مع الخبرة: المحترف ما بيتعلّم «من الصفر»، والمبتدئ ما بيشتغل بمجال
    function applyExperience(level) {
        // السؤال 4
        document.querySelectorAll('input[name="currentSkills"]').forEach((input) => {
            const isNothing = input.value === NOTHING;
            const show = level === 0 ? isNothing : (level <= 1 ? true : !isNothing);
            setVisible('currentSkills', input.value, show);
        });
        // السؤال 5
        setVisible('targetSkills', BASICS, level <= 2);
        const allInput = document.querySelector('input[name="targetSkills"][value="' + ALL_BEGIN + '"], input[name="targetSkills"][value="' + ALL_PRO + '"]');
        const want = level >= 3 ? ALL_PRO : ALL_BEGIN;
        if (allInput.value !== want) {
            if (allInput.checked) { allInput.checked = false; markCompleted(5, ''); }
            allInput.value = want;
            allInput.closest('label').querySelector('.option-label > span').textContent = '🔥 ' + want;
        }
        // المبتدئ من الصفر: السؤال 4 جوابو واحد، منعبّيه لحالو
        if (level === 0) {
            const nothing = document.querySelector('input[name="currentSkills"][value="' + NOTHING + '"]');
            nothing.checked = true;
            markCompleted(4, NOTHING);
        }
    }

    function autoAdvance(stepNumber, value) {
        markCompleted(stepNumber, value);
        let next = stepNumber + 1;
        if (stepNumber === 3) {
            const level = LEVEL[value];
            applyExperience(level);
            if (level === 0) next = 5;
        }
        setTimeout(() => toggleStep(stepNumber < 6 ? next : 0), 220);
    }

    function showError(stepNumber, msg) {
        const toast = document.getElementById('errorToast');
        toast.textContent = msg;
        toast.style.display = 'block';
        document.getElementById(`step-${stepNumber}`).classList.add('error-border');
        toggleStep(stepNumber);
    }

    // الكتاب للمبتدئين: من الصفر، هاوي، أو أقل من سنتين
    function recommendBook(level) { return level <= 2; }

    function waLink(text) {
        // api.whatsapp.com بيحافظ عالإيموجي أحسن من wa.me على بعض تلفونات أندرويد
        return `https://api.whatsapp.com/send?phone=${PHONE}&text=${encodeURIComponent(text)}`;
    }

    // التصنيف: لحتى ينفرز الاستبيان بالواتساب بالبحث عن الهاشتاغ
    function methodTag(method) {
        if (method.includes('حضوري')) return 'حضوري';
        if (method.includes('فيديو')) return 'فيديوهات';
        return 'PDF';
    }

    let CARD = null;   // البطاقة بعد ما يعبّي

    function sendToWhatsApp() {
        const name = document.getElementById('fullName').value.trim();
        const age = document.querySelector('input[name="age"]:checked')?.value;
        const experience = document.querySelector('input[name="experience"]:checked')?.value;
        const currentSkills = document.querySelector('input[name="currentSkills"]:checked')?.value;
        const targetSkills = document.querySelector('input[name="targetSkills"]:checked')?.value;
        const learningMethod = document.querySelector('input[name="learningMethod"]:checked')?.value;

        if (!name || name.length < 2) { showError(1, "⚠️ اكتب اسمك ومنطقتك (الخانة 1)"); setTimeout(() => document.getElementById('fullName').focus(), 300); return; }
        if (!age) { showError(2, "⚠️ نقّي عمرك (الخانة 2)"); return; }
        if (!experience) { showError(3, "⚠️ نقّي خبرتك (الخانة 3)"); return; }
        if (!currentSkills) { showError(4, "⚠️ نقّي شو بتشتغل هلّق (الخانة 4)"); return; }
        if (!targetSkills) { showError(5, "⚠️ نقّي بشو بدك تطوّر حالك (الخانة 5)"); return; }
        if (!learningMethod) { showError(6, "⚠️ نقّي كيف بتحب تتعلّم (الخانة 6)"); return; }

        const level = LEVEL[experience];
        CARD = { name, age, experience, currentSkills, targetSkills, learningMethod, level, book: recommendBook(level) };
        showResult();   // ما منفتح الواتساب هون: أول شي بيشوف شو بيناسبو
    }

    function buildMessage(buying) {
        const c = CARD;
        const p = bookPrice();
        const rec = c.book ? 'كتاب «الكهرباء بالمختصر المفيد» (مبتدئ)' : 'مستوى متقدّم: بدّو متابعة شخصية';
        const tag = methodTag(c.learningMethod);
        const tags = ['#' + tag, c.book ? '#مبتدئ' : '#متقدم'];
        if (buying) tags.push('#طلب_شراء');
        let m = buying
            ? `🛒 *طلب شراء كتاب + تقييم مستوى* ⚡\n\n` +
              `بدي كتاب «الكهرباء بالمختصر المفيد»\n` +
              `▸ السعر: ${p}$${promoOn() ? ' (خصم الإطلاق)' : ''}\n` +
              `كيف بدفع؟\n\n` +
              `━━━━━━━━━━━━━━━\n`
            : `⚡ *تقييم مستوى جديد - MrElectroAI* ⚡\n\n`;
        m += `👤 *الاسم والمنطقة:* ${c.name}\n` +
             `🎂 *الفئة العمرية:* ${c.age}\n` +
             `⏳ *سنوات الخبرة:* ${c.experience}\n` +
             `🛠️ *المهارات الحالية:* ${c.currentSkills}\n` +
             `🎯 *يرغب بتعلم:* ${c.targetSkills}\n` +
             `📘 *طريقة التعلم المفضلة:* ${c.learningMethod}\n\n` +
             `📊 *التوصية:* ${rec}\n` +
             `🏷️ *التصنيف:* ${tag}\n` +
             tags.join(' ');
        return m;
    }

    function esc(t) { return String(t).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }

    function showResult() {
        const c = CARD;
        const first = esc(c.name.split(/[\s\-–—]+/)[0]);
        const form = document.getElementById('electroForm');
        let box = document.getElementById('resultBox');
        if (!box) { box = document.createElement('div'); box.id = 'resultBox'; form.after(box); }
        let html;
        if (c.book) {
            const p = bookPrice();
            const left = Math.floor((PROMO_END - new Date()) / 864e5);
            const promo = promoOn() ? `<div class="promo">⏳ خصم الإطلاق: ${left >= 3 ? 'باقي ' + left + ' أيام' : left === 2 ? 'باقي يومين' : left === 1 ? 'باقي يوم واحد' : 'آخر يوم!'}</div>` : '';
            html = `
            <h2>${first}، هيدا بيناسبك 👇</h2>
            <p>بما إنك بأول الطريق، بلّش بالأساس الصح.</p>
            <div class="rec">
              <div class="top">
                <img src="course/cover.jpg" alt="غلاف كتاب الكهرباء بالمختصر المفيد">
                <div>
                  <h3>الكهرباء بالمختصر المفيد</h3>
                  <div class="why">18 قاعدة من الصفر بلغة الورشة: الشرايط، التابلو، الديجنتير والدفرانسير، القازان، وكيف تلاقي العطل. ومعو كورس اختبارات وشهادة باسمك 🎓</div>
                </div>
              </div>
              <div class="price"><b>${p}$</b>${promoOn() ? '<s>10$</s>' : ''}</div>
              ${promo}
              <a class="buy-btn" id="sendBuy" href="${waLink(buildMessage(true))}" target="_blank" rel="noopener">اشتري الكتاب وابعت بطاقتي</a>
            </div>
            <a class="next-btn" id="sendOnly" href="${waLink(buildMessage(false))}" target="_blank" rel="noopener" style="display:block;text-decoration:none;text-align:center">مش هلّق، ابعت بطاقتي بس</a>`;
        } else {
            html = `
            <h2>شكراً ${first} 💪</h2>
            <p>مستواك متقدّم، فما رح نضيّع وقتك بكتاب مبتدئين. ابعتلي بطاقتك، ورح احكيك عالواتساب بشو بيناسبك بـ«${esc(c.targetSkills)}».</p>
            <a class="buy-btn" id="sendOnly" href="${waLink(buildMessage(false))}" target="_blank" rel="noopener">ابعت بطاقتي عالواتساب</a>
            <a class="ghost-btn" href="./#books">عندك متدرّب أو صانع؟ الكتاب بيبلّشو صح</a>`;
        }
        box.innerHTML = `<div class="result">${html}
            <p class="status" id="sentNote" style="display:none;margin-top:14px">✅ انفتح الواتساب. اكبس «إرسال» لتوصلني.</p>
            <a class="ghost-btn" href="#" id="editBack">رجوع لتعديل أجوبتي</a></div>`;
        box.querySelectorAll('#sendBuy, #sendOnly').forEach((a) => a.addEventListener('click', () => {
            document.getElementById('sentNote').style.display = 'block';
        }));
        document.getElementById('editBack').addEventListener('click', (e) => { e.preventDefault(); box.style.display = 'none'; form.style.display = ''; document.querySelector('.subtitle').style.display = ''; window.scrollTo(0, 0); });
        form.style.display = 'none'; box.style.display = '';
        document.querySelector('.subtitle').style.display = 'none';
        document.getElementById('errorToast').style.display = 'none';
        window.scrollTo(0, 0);
    }
</script>

<script src="t.js" data-page="quiz" defer></script>
</body>
</html>
