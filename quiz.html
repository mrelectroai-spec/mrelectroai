<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد المستوى والاهتمامات | MrElectroAI ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131b2e;
            --item-bg: #0d1322;
            --electric-blue: #00d2ff;
            --neon-blue-glow: rgba(0, 210, 255, 0.3);
            --gold: #ffb703;
            --gold-glow: rgba(255, 183, 3, 0.35);
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #23314f;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 183, 3, 0.08) 0%, transparent 40%);
            color: var(--text-light);
            padding: 12px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            margin: 10px auto;
            padding: 20px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 210, 255, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--electric-blue), #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        /* نظام الواجهات المغلقة (Accordion) */
        .accordion-item {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .accordion-item.active {
            border-color: var(--electric-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
        }

        .accordion-item.completed {
            border-color: rgba(255, 183, 3, 0.4);
        }

        .accordion-header {
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            transition: background 0.2s;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid var(--electric-blue);
            color: var(--electric-blue);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .accordion-item.completed .step-num {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
        }

        .question-text {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-light);
            white-space: nowrap;
        }

        .selected-preview {
            font-size: 12px;
            color: var(--gold);
            background: rgba(255, 183, 3, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: auto;
            margin-left: 8px;
            display: none;
        }

        .accordion-item.completed .selected-preview {
            display: inline-block;
        }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 12px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .accordion-item.active .arrow-icon {
            transform: rotate(180deg);
            color: var(--electric-blue);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(9, 13, 22, 0.6);
        }

        .accordion-content {
            padding: 12px 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* حقل الاسم */
        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px 14px;
            background: #131b2e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--electric-blue);
            box-shadow: 0 0 10px var(--neon-blue-glow);
        }

        .next-mini-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* خيارات الكبس */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .options-grid.two-cols {
            grid-template-columns: 1fr 1fr;
        }

        .option-item {
            position: relative;
        }

        .option-item input {
            position: absolute;
            opacity: 0;
            height: 0;
            width: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #131b2e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .option-item input:checked ~ .option-label {
            background: rgba(0, 210, 255, 0.14);
            border-color: var(--electric-blue);
            box-shadow: 0 0 10px var(--neon-blue-glow);
            color: #fff;
        }

        .indicator {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .checkbox-indicator {
            border-radius: 5px;
        }

        .option-item input:checked ~ .option-label .indicator {
            border-color: var(--gold);
            background-color: var(--gold);
        }

        .option-item input:checked ~ .option-label .indicator::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 11px;
            font-weight: 900;
        }

        .done-step-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 183, 3, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0, 210, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-title">MrElectroAI ⚡</div>
        <div class="subtitle">اكبس على كل خانة وحدد خياراتك بثواني</div>
    </div>

    <form id="electroForm" onsubmit="return false;">

        <!-- 1. الاسم والمنطقة -->
        <div class="accordion-item active" id="step-1">
            <div class="accordion-header" onclick="toggleStep(1)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-1">1</span>
                    <span class="question-text">👤 الاسم والمنطقة</span>
                    <span class="selected-preview" id="preview-1"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body" style="max-height: 120px;">
                <div class="accordion-content">
                    <div class="input-wrapper">
                        <input type="text" id="fullName" placeholder="مثال: أحمد - بيروت" oninput="updateNamePreview()">
                        <button type="button" class="next-mini-btn" onclick="completeNameStep()">التالي ⬅</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. الفئة العمرية -->
        <div class="accordion-item" id="step-2">
            <div class="accordion-header" onclick="toggleStep(2)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-2">2</span>
                    <span class="question-text">🎂 الفئة العمرية</span>
                    <span class="selected-preview" id="preview-2"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid two-cols">
                        <label class="option-item">
                            <input type="radio" name="age" value="أقل من 20 سنة" onchange="selectSingle(2, this.value)">
                            <span class="option-label"><span>أقل من 20</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="من 20 إلى 30 سنة" onchange="selectSingle(2, this.value)">
                            <span class="option-label"><span>20 إلى 30</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="من 30 إلى 40 سنة" onchange="selectSingle(2, this.value)">
                            <span class="option-label"><span>30 إلى 40</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="أكثر من 40 سنة" onchange="selectSingle(2, this.value)">
                            <span class="option-label"><span>أكثر من 40</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. سنوات الخبرة -->
        <div class="accordion-item" id="step-3">
            <div class="accordion-header" onclick="toggleStep(3)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-3">3</span>
                    <span class="question-text">⏳ سنوات الخبرة بالكهرباء</span>
                    <span class="selected-preview" id="preview-3"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="experience" value="مبتدئ من الصفر" onchange="selectSingle(3, this.value)">
                            <span class="option-label"><span>مبتدئ من الصفر (ما عندي فكرة)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="هاوي (معلومات بسيطة)" onchange="selectSingle(3, this.value)">
                            <span class="option-label"><span>هاوي (بعرف شغلات بسيطة)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="أقل من سنتين" onchange="selectSingle(3, this.value)">
                            <span class="option-label"><span>أقل من سنتين (عم أتعلم بالورش)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="من 2 إلى 5 سنوات" onchange="selectSingle(3, this.value)">
                            <span class="option-label"><span>من 2 إلى 5 سنوات (فني شغال)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="أكثر من 5 سنوات (معلم)" onchange="selectSingle(3, this.value)">
                            <span class="option-label"><span>أكثر من 5 سنوات (معلم / بروفيشنال)</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. المهارات الحالية -->
        <div class="accordion-item" id="step-4">
            <div class="accordion-header" onclick="toggleStep(4)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-4">4</span>
                    <span class="question-text">🛠️ شو بتشتغل حالياً؟</span>
                    <span class="selected-preview" id="preview-4"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="checkbox" name="currentSkills" value="ولا شي (مبتدئ)" onchange="updateMulti(4, 'currentSkills')">
                            <span class="option-label"><span>🆕 ولا شي (بعدني بالبداية)</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="currentSkills" value="تمديدات منزلية" onchange="updateMulti(4, 'currentSkills')">
                            <span class="option-label"><span>🔌 تمديدات منزلية وصيانة</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="currentSkills" value="طاقة شمسية (Solar)" onchange="updateMulti(4, 'currentSkills')">
                            <span class="option-label"><span>☀️ طاقة شمسية وانفرترات</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="currentSkills" value="كلاسيك كنترول و ATS" onchange="updateMulti(4, 'currentSkills')">
                            <span class="option-label"><span>⚙️ كلاسيك كنترول ولوحات ATS</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="currentSkills" value="سمارت هوم (Automation)" onchange="updateMulti(4, 'currentSkills')">
                            <span class="option-label"><span>🏠 منازل ذكية (Smart Home)</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                    </div>
                    <button type="button" class="done-step-btn" onclick="toggleStep(5)">تم الاختيار - انتقل للتالي ⬇</button>
                </div>
            </div>
        </div>

        <!-- 5. المجالات المطلوبة للتطوير -->
        <div class="accordion-item" id="step-5">
            <div class="accordion-header" onclick="toggleStep(5)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-5">5</span>
                    <span class="question-text">🎯 بشو حابب تطور حالك؟</span>
                    <span class="selected-preview" id="preview-5"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="checkbox" name="targetSkills" value="أساسيات الكهرباء من الصفر" onchange="updateMulti(5, 'targetSkills')">
                            <span class="option-label"><span>⚡ أساسيات الكهرباء من الصفر</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="targetSkills" value="احتراف الطاقة الشمسية والانفرترات" onchange="updateMulti(5, 'targetSkills')">
                            <span class="option-label"><span>🔋 احتراف الطاقة الشمسية والانفرترات</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="targetSkills" value="الكلاسيك كنترول وتجميع اللوحات" onchange="updateMulti(5, 'targetSkills')">
                            <span class="option-label"><span>🎛️ الكلاسيك كنترول وتجميع اللوحات</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="targetSkills" value="السمارت هوم والأنظمة الذكية" onchange="updateMulti(5, 'targetSkills')">
                            <span class="option-label"><span>📱 السمارت هوم والأنظمة الذكية</span><span class="indicator checkbox-indicator"></span></span>
                        </label>
                    </div>
                    <button type="button" class="done-step-btn" onclick="toggleStep(6)">تم الاختيار - انتقل للتالي ⬇</button>
                </div>
            </div>
        </div>

        <!-- 6. طريقة التعلم المفضلة -->
        <div class="accordion-item" id="step-6">
            <div class="accordion-header" onclick="toggleStep(6)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-6">6</span>
                    <span class="question-text">📘 طريقة التعلم المفضلة</span>
                    <span class="selected-preview" id="preview-6"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="كتب وأدلة PDF مختصرة" onchange="selectSingle(6, this.value)">
                            <span class="option-label"><span>📄 كتب وأدلة PDF مختصرة وعملية</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="فيديوهات مسجلة وشروحات" onchange="selectSingle(6, this.value)">
                            <span class="option-label"><span>🎥 فيديوهات مسجلة وشروحات</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="تدريب عملي حضوري مباشر" onchange="selectSingle(6, this.value)">
                            <span class="option-label"><span>🛠️ تدريب عملي حضوري / كورس مباشر</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <button type="button" class="submit-btn" onclick="sendToWhatsApp()">
            <span>إرسال البطاقة عبر واتساب</span>
            <span>📲</span>
        </button>

        <div class="footer-note">MrElectroAI © جميع الحقوق محفوظة</div>
    </form>
</div>

<script>
    function toggleStep(stepNumber) {
        const allItems = document.querySelectorAll('.accordion-item');
        allItems.forEach((item, index) => {
            const currentNum = index + 1;
            const body = item.querySelector('.accordion-body');
            if (currentNum === stepNumber) {
                const isOpen = item.classList.contains('active');
                if (isOpen) {
                    item.classList.remove('active');
                    body.style.maxHeight = null;
                } else {
                    item.classList.add('active');
                    body.style.maxHeight = body.scrollHeight + "px";
                }
            } else {
                item.classList.remove('active');
                body.style.maxHeight = null;
            }
        });
    }

    function markCompleted(stepNumber, previewText) {
        const item = document.getElementById(`step-${stepNumber}`);
        const preview = document.getElementById(`preview-${stepNumber}`);
        const numBadge = document.getElementById(`num-${stepNumber}`);
        if (previewText) {
            item.classList.add('completed');
            preview.textContent = previewText;
            numBadge.textContent = "✓";
        } else {
            item.classList.remove('completed');
            preview.textContent = "";
            numBadge.textContent = stepNumber;
        }
    }

    function updateNamePreview() {
        const val = document.getElementById('fullName').value.trim();
        markCompleted(1, val);
    }

    function completeNameStep() {
        const val = document.getElementById('fullName').value.trim();
        if (!val) {
            alert('يرجى كتابة الاسم أولاً ⚡');
            return;
        }
        markCompleted(1, val);
        toggleStep(2);
    }

    function selectSingle(stepNumber, value) {
        markCompleted(stepNumber, value);
        setTimeout(() => {
            if (stepNumber < 6) {
                toggleStep(stepNumber + 1);
            } else {
                // إغلاق البطاقة الأخيرة بعد الاختيار لتصبح الشاشة مختصرة وجاهزة للإرسال
                toggleStep(0);
            }
        }, 250);
    }

    function updateMulti(stepNumber, inputName) {
        let selected = [];
        document.querySelectorAll(`input[name="${inputName}"]:checked`).forEach(el => {
            selected.push(el.value);
        });
        markCompleted(stepNumber, selected.length > 0 ? `${selected.length} خيارات` : "");
    }

    function sendToWhatsApp() {
        const name = document.getElementById('fullName').value.trim();
        if (!name) {
            toggleStep(1);
            setTimeout(() => document.getElementById('fullName').focus(), 300);
            alert('يرجى كتابة الاسم والمنطقة في الخانة رقم 1 ⚡');
            return;
        }

        const age = document.querySelector('input[name="age"]:checked')?.value || 'غير محدد';
        const experience = document.querySelector('input[name="experience"]:checked')?.value || 'غير محدد';
        const learningMethod = document.querySelector('input[name="learningMethod"]:checked')?.value || 'غير محدد';

        let currentSkills = [];
        document.querySelectorAll('input[name="currentSkills"]:checked').forEach(el => currentSkills.push(el.value));
