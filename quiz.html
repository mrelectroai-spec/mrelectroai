<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد المستوى والاهتمامات | MrElectroAI ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131b2e;
            --item-bg: #0d1322;
            --electric-blue: #00d2ff;
            --neon-blue-glow: rgba(0, 210, 255, 0.3);
            --gold: #ffb703;
            --gold-glow: rgba(255, 183, 3, 0.35);
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #23314f;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 210, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 183, 3, 0.08) 0%, transparent 40%);
            color: var(--text-light);
            padding: 12px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            margin: 10px auto;
            padding: 20px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 210, 255, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--electric-blue), #ffffff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        /* تنبيه الخطأ */
        .error-toast {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* نظام الواجهات المغلقة (Accordion) */
        .accordion-item {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .accordion-item.active {
            border-color: var(--electric-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.15);
        }

        .accordion-item.completed {
            border-color: rgba(255, 183, 3, 0.45);
        }

        .accordion-item.error-border {
            border-color: var(--danger);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }

        .accordion-header {
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid var(--electric-blue);
            color: var(--electric-blue);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .accordion-item.completed .step-num {
            background: var(--gold);
            border-color: var(--gold);
            color: #000;
        }

        .question-text {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-light);
            white-space: nowrap;
        }

        .selected-preview {
            font-size: 12px;
            color: var(--gold);
            background: rgba(255, 183, 3, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: auto;
            margin-left: 8px;
            display: none;
        }

        .accordion-item.completed .selected-preview {
            display: inline-block;
        }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 12px;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .accordion-item.active .arrow-icon {
            transform: rotate(180deg);
            color: var(--electric-blue);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(9, 13, 22, 0.6);
        }

        .accordion-content {
            padding: 12px 14px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: #131b2e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            font-size: 14.5px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--electric-blue);
            box-shadow: 0 0 10px var(--neon-blue-glow);
        }

        /* خيارات الكبس */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .options-grid.two-cols {
            grid-template-columns: 1fr 1fr;
        }

        .option-item {
            position: relative;
        }

        .option-item input {
            position: absolute;
            opacity: 0;
            height: 0;
            width: 0;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 13px;
            background: #131b2e;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-light);
            transition: all 0.2s ease;
        }

        .option-item input:checked ~ .option-label {
            background: rgba(0, 210, 255, 0.14);
            border-color: var(--electric-blue);
            box-shadow: 0 0 10px var(--neon-blue-glow);
            color: #fff;
        }

        .indicator {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            position: relative;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-item input:checked ~ .option-label .indicator {
            border-color: var(--gold);
            background-color: var(--gold);
        }

        .option-item input:checked ~ .option-label .indicator::after {
            content: "✓";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-size: 11px;
            font-weight: 900;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0, 210, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-title">MrElectroAI ⚡</div>
        <div class="subtitle">اكبس على الخيار لننتقل تلقائياً للسؤال التالي</div>
    </div>

    <div id="errorToast" class="error-toast">⚠️ يرجى تعبئة كافة الخانات المطلوبة قبل الإرسال!</div>

    <form id="electroForm" onsubmit="return false;">

        <!-- 1. الاسم والمنطقة -->
        <div class="accordion-item active" id="step-1">
            <div class="accordion-header" onclick="toggleStep(1)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-1">1</span>
                    <span class="question-text">👤 الاسم والمنطقة</span>
                    <span class="selected-preview" id="preview-1"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body" style="max-height: 110px;">
                <div class="accordion-content">
                    <input type="text" id="fullName" placeholder="اكتب اسمك ومنطقتك (مثال: أحمد - بيروت)" oninput="handleNameInput()" onkeypress="handleNameKey(event)">
                </div>
            </div>
        </div>

        <!-- 2. الفئة العمرية -->
        <div class="accordion-item" id="step-2">
            <div class="accordion-header" onclick="toggleStep(2)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-2">2</span>
                    <span class="question-text">🎂 الفئة العمرية</span>
                    <span class="selected-preview" id="preview-2"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid two-cols">
                        <label class="option-item">
                            <input type="radio" name="age" value="أقل من 20 سنة" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>أقل من 20</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="من 20 إلى 30 سنة" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>20 إلى 30</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="من 30 إلى 40 سنة" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>30 إلى 40</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="age" value="أكثر من 40 سنة" onclick="autoAdvance(2, this.value)">
                            <span class="option-label"><span>أكثر من 40</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. سنوات الخبرة -->
        <div class="accordion-item" id="step-3">
            <div class="accordion-header" onclick="toggleStep(3)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-3">3</span>
                    <span class="question-text">⏳ سنوات الخبرة بالكهرباء</span>
                    <span class="selected-preview" id="preview-3"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="experience" value="مبتدئ من الصفر (ما عندي فكرة)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>مبتدئ من الصفر (ما عندي فكرة)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="هاوي (بعرف شغلات بسيطة)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>هاوي (بعرف شغلات بسيطة)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="أقل من سنتين (عم أتعلم بالورش)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>أقل من سنتين (عم أتعلم بالورش)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="من 2 إلى 5 سنوات (فني شغال)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>من 2 إلى 5 سنوات (فني شغال)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="experience" value="أكثر من 5 سنوات (معلم / بروفيشنال)" onclick="autoAdvance(3, this.value)">
                            <span class="option-label"><span>أكثر من 5 سنوات (معلم / بروفيشنال)</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. المهارات الحالية -->
        <div class="accordion-item" id="step-4">
            <div class="accordion-header" onclick="toggleStep(4)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-4">4</span>
                    <span class="question-text">🛠️ شو بتشتغل حالياً؟</span>
                    <span class="selected-preview" id="preview-4"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="ولا شي (بعدني بالبداية)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>🆕 ولا شي (بعدني بالبداية)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="تمديدات منزلية وصيانة" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>🔌 تمديدات منزلية وصيانة عامة</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="طاقة شمسية وانفرترات (Solar)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>☀️ طاقة شمسية وانفرترات (Solar)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="كلاسيك كنترول ولوحات ATS" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>⚙️ كلاسيك كنترول ولوحات ATS</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="منازل ذكية (Smart Home)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>🏠 منازل ذكية (Smart Home)</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="currentSkills" value="بتشتغل بأكثر من مجال (شامل)" onclick="autoAdvance(4, this.value)">
                            <span class="option-label"><span>⚡ بشتغل بأكثر من مجال (شامل)</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 5. المجالات المطلوبة للتطوير -->
        <div class="accordion-item" id="step-5">
            <div class="accordion-header" onclick="toggleStep(5)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-5">5</span>
                    <span class="question-text">🎯 بشو حابب تطور حالك؟</span>
                    <span class="selected-preview" id="preview-5"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="أساسيات الكهرباء من الصفر" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>⚡ أساسيات الكهرباء من الصفر</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="احتراف الطاقة الشمسية والانفرترات" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>🔋 احتراف الطاقة الشمسية والانفرترات</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="الكلاسيك كنترول وتجميع اللوحات" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>🎛️ الكلاسيك كنترول وتجميع اللوحات</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="السمارت هوم والأنظمة الذكية" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>📱 السمارت هوم والأنظمة الذكية</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="targetSkills" value="شامل (كل المجالات من الصفر للاحتراف)" onclick="autoAdvance(5, this.value)">
                            <span class="option-label"><span>🔥 شامل (كل المجالات من الصفر للاحتراف)</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 6. طريقة التعلم المفضلة -->
        <div class="accordion-item" id="step-6">
            <div class="accordion-header" onclick="toggleStep(6)">
                <div class="header-title-wrap">
                    <span class="step-num" id="num-6">6</span>
                    <span class="question-text">📘 طريقة التعلم المفضلة</span>
                    <span class="selected-preview" id="preview-6"></span>
                </div>
                <span class="arrow-icon">▼</span>
            </div>
            <div class="accordion-body">
                <div class="accordion-content">
                    <div class="options-grid">
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="كتب وأدلة PDF مختصرة وعملية" onclick="autoAdvance(6, this.value)">
                            <span class="option-label"><span>📄 كتب وأدلة PDF مختصرة وعملية</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="فيديوهات مسجلة وشروحات" onclick="autoAdvance(6, this.value)">
                            <span class="option-label"><span>🎥 فيديوهات مسجلة وشروحات</span><span class="indicator"></span></span>
                        </label>
                        <label class="option-item">
                            <input type="radio" name="learningMethod" value="تدريب عملي حضوري / كورس مباشر" onclick="autoAdvance(6, this.value)">
                            <span class="option-label"><span>🛠️ تدريب عملي حضوري / كورس مباشر</span><span class="indicator"></span></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <button type="button" class="submit-btn" onclick="sendToWhatsApp()">
            <span>إرسال البطاقة عبر واتساب</span>
            <span>📲</span>
        </button>

        <div class="footer-note">MrElectroAI © جميع الحقوق محفوظة</div>
    </form>
</div>

<script>
    let nameTimer = null;

    function toggleStep(stepNumber) {
        // إذا كان ينتقل من خطوة الاسم وكان كاتب اسمه، نسجلها مكتملة
        const nameVal = document.getElementById('fullName').value.trim();
        if (nameVal.length >= 2) {
            markCompleted(1, nameVal);
        }

        const allItems = document.querySelectorAll('.accordion-item');
        allItems.forEach((item, index) => {
            const currentNum = index + 1;
            const body = item.querySelector('.accordion-body');
            if (currentNum === stepNumber) {
                item.classList.add('active');
                item.classList.remove('error-border');
                body.style.maxHeight = body.scrollHeight + "px";
            } else {
                item.classList.remove('active');
                body.style.maxHeight = null;
            }
        });
    }

    function markCompleted(stepNumber, previewText) {
        const item = document.getElementById(`step-${stepNumber}`);
        const preview = document.getElementById(`preview-${stepNumber}`);
        const numBadge = document.getElementById(`num-${stepNumber}`);
        if (previewText) {
            item.classList.add('completed');
            item.classList.remove('error-border');
            preview.textContent = previewText;
            numBadge.textContent = "✓";
            document.getElementById('errorToast').style.display = 'none';
        } else {
            item.classList.remove('completed');
            preview.textContent = "";
            numBadge.textContent = stepNumber;
        }
    }

    function handleNameInput() {
        const val = document.getElementById('fullName').value.trim();
        markCompleted(1, val);
        clearTimeout(nameTimer);
        // ينتقل تلقائياً للسؤال الثاني بعد ثانية واحدة من التوقف عن كتابة الاسم
        if (val.length >= 4) {
            nameTimer = setTimeout(() => {
                toggleStep(2);
            }, 1100);
        }
    }

    function handleNameKey(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const val = document.getElementById('fullName').value.trim();
            if (val.length >= 2) {
                clearTimeout(nameTimer);
                markCompleted(1, val);
                toggleStep(2);
            }
        }
    }

    function autoAdvance(stepNumber, value) {
        markCompleted(stepNumber, value);
        setTimeout(() => {
            if (stepNumber < 6) {
                toggleStep(stepNumber + 1);
            } else {
                // إغلاق البطاقة الأخيرة بعد الاختيار لتصبح الشاشة جاهزة للإرسال
                toggleStep(0);
            }
        }, 220);
    }

    function showError(stepNumber, msg) {
        const toast = document.getElementById('errorToast');
        toast.textContent = msg;
        toast.style.display = 'block';
        const item = document.getElementById(`step-${stepNumber}`);
        item.classList.add('error-border');
        toggleStep(stepNumber);
    }

    function sendToWhatsApp() {
        const name = document.getElementById('fullName').value.trim();
        const age = document.querySelector('input[name="age"]:checked')?.value;
        const experience = document.querySelector('input[name="experience"]:checked')?.value;
        const currentSkills = document.querySelector('input[name="currentSkills"]:checked')?.value;
        const targetSkills = document.querySelector('input[name="targetSkills"]:checked')?.value;
        const learningMethod = document.querySelector('input[name="learningMethod"]:checked')?.value;

        // فحص إجباري لكل خانة من 1 إلى 6
        if (!name || name.length < 2) {
            showError(1, "⚠️ يرجى كتابة الاسم والمنطقة في الخانة رقم 1");
            setTimeout(() => document.getElementById('fullName').focus(), 300);
            return;
        }
        if (!age) {
            showError(2, "⚠️ يرجى اختيار الفئة العمرية (الخانة رقم 2)");
            return;
        }
        if (!experience) {
            showError(3, "⚠️ يرجى تحديد سنوات الخبرة (الخانة رقم 3)");
            return;
        }
        if (!currentSkills) {
            showError(4, "⚠️ يرجى تحديد شو بتشتغل حالياً (الخانة رقم 4)");
            return;
        }
        if (!targetSkills) {
            showError(5, "⚠️ يرجى تحديد بشو حابب تطور حالك (الخانة رقم 5)");
            return;
        }
        if (!learningMethod) {
            showError(6, "⚠️ يرجى اختيار طريقة التعلم المفضلة (الخانة رقم 6)");
            return;
        }

        const phone = "96179434479";

        const message = `⚡ *تقييم مستوى جديد - MrElectroAI* ⚡\n\n` +
                        `👤 *الاسم والمنطقة:* ${name}\n` +
                        `🎂 *الفئة العمرية:* ${age}\n` +
                        `⏳ *سنوات الخبرة:* ${experience}\n` +
                        `🛠️ *المهارات الحالية:* ${currentSkills}\n` +
                        `🎯 *يرغب بتعلم:* ${targetSkills}\n` +
                        `📘 *طريقة التعلم المفضلة:* ${learningMethod}`;

        const whatsappURL = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.location.href = whatsappURL;
    }
</script>

</body>
</html>
